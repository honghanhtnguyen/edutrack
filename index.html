============================================================ */
function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(elx=>{
    elx.addEventListener('click', ()=>{ state.tab = elx.dataset.nav; render(); });
  });

  app.querySelectorAll('[data-action]').forEach(elx=>{
    const action = elx.dataset.action;
    const evt = (elx.tagName==='INPUT' || elx.tagName==='SELECT' || elx.tagName==='TEXTAREA') ?
      (elx.type==='text'||elx.type==='number'||elx.tagName==='TEXTAREA' ? 'change' : 'change') : 'click';
    elx.addEventListener(evt, (e)=> handleAction(action, elx, e));
    if((elx.tagName==='INPUT' && (elx.type==='text')) || elx.tagName==='TEXTAREA'){
      elx.addEventListener('blur', (e)=> handleAction(action, elx, e));
    }
  });

  // textarea/content fields with data-field
  app.querySelectorAll('[data-field]').forEach(elx=>{
    elx.addEventListener('change', ()=> handleFieldChange(elx));
    elx.addEventListener('blur', ()=> handleFieldChange(elx));
  });

  // cập nhật ngay hiển thị "x.x/10" khi gõ số câu đúng, không cần render lại cả trang
  app.querySelectorAll('.score-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const total = Number(inp.dataset.total) || 10;
      const span = inp.parentElement && inp.parentElement.querySelector('.score-computed');
      if(!span) return;
      const val = inp.value;
      if(val===''){ span.textContent = '—'; return; }
      const c = clamp(Number(val), 0, total);
      span.textContent = ((c/total)*10).toFixed(1)+'/10';
    });
  });

  const exModeSel = app.querySelector('#new-exercise-mode');
  const exTotalInput = app.querySelector('#new-exercise-total');
  if(exModeSel && exTotalInput){
    const syncExMode = ()=>{ exTotalInput.style.display = exModeSel.value==='scale10' ? 'none' : ''; };
    syncExMode();
    exModeSel.addEventListener('change', syncExMode);
  }

  const modalInput = app.querySelector('#modal-input');
  if(modalInput){
    modalInput.addEventListener('keydown', (ev)=>{
      const isTextarea = modalInput.tagName==='TEXTAREA';
      if(ev.key==='Enter' && (!isTextarea || ev.ctrlKey || ev.metaKey)){
        ev.preventDefault(); const btn = app.querySelector('[data-action="modal-submit"]'); if(btn) btn.click();
      }
      if(ev.key==='Escape'){ ev.preventDefault(); closeModal(); }
    });
  }

  const search = app.querySelector('[data-action="progress-search"]');
  if(search){
    search.addEventListener('input', (e)=>{ state.progress.query = e.target.value; render(); setTimeout(()=>{ const i=app.querySelector('[data-action="progress-search"]'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });
  }
  const recSearch = app.querySelector('[data-action="records-search"]');
  if(recSearch){
    recSearch.addEventListener('input', (e)=>{ state.records.search = e.target.value; render(); setTimeout(()=>{ const i=app.querySelector('[data-action="records-search"]'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });
  }
  const globalSearchInput = app.querySelector('#global-student-search');
  if(globalSearchInput){
    globalSearchInput.addEventListener('input', (e)=>{ state.globalSearch = e.target.value; render(); setTimeout(()=>{ const i=app.querySelector('#global-student-search'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });
    globalSearchInput.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ state.globalSearch=''; render(); } });
  }
  const backupInput = app.querySelector('#backup-file-input');
  if(backupInput){
    backupInput.addEventListener('change', (e)=>{
      const file = e.target.files && e.target.files[0];
      if(file) importBackup(file);
      backupInput.value = '';
    });
  }

  // Enter để gửi nhanh: form ghi nhận vi phạm (ngày/điểm trừ/nội dung)
  ['violation-date','violation-points','violation-content'].forEach(id=>{
    const el = app.querySelector('#'+id);
    if(el){
      el.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const btn = app.querySelector('[data-action="add-violation"]');
          if(btn) btn.click();
        }
      });
    }
  });
  // Enter để gửi nhanh: form điều chỉnh điểm tổ (tổ/điểm/ngày/lý do)
  ['score-team-select','score-points','score-date','score-reason'].forEach(id=>{
    const el = app.querySelector('#'+id);
    if(el){
      el.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const btn = app.querySelector('[data-action="add-team-score"]');
          if(btn) btn.click();
        }
      });
    }
  });
}

async function handleFieldChange(elx){
  const sess = ensureSessionEditable();
  sess[elx.dataset.field] = elx.value;
  saveSessions(state.currentClassId);
}

async function handleAction(action, elx, e){
  switch(action){
    case 'go-classes': state.tab='classes'; render(); break;
    case 'export-backup': exportBackup(); break;
    case 'trigger-backup-import': {
      const inp = document.getElementById('backup-file-input');
      if(inp) inp.click();
      break;
    }
    case 'goto-suggestion': {
      state.tab = elx.dataset.tab;
      if(elx.dataset.section){ state.homeroom.section = elx.dataset.section; }
      render();
      break;
    }
    case 'toggle-sync-panel': state.syncPanelOpen = !state.syncPanelOpen; render(); break;
    case 'save-firebase-config': {
      const ta = document.getElementById('firebase-config-input');
      const text = ta ? ta.value : '';
      const parsed = parseFirebaseConfigInput(text);
      if(!parsed){
        showToast('Không đọc được cấu hình — cô kiểm tra lại đã dán đủ và đúng đoạn firebaseConfig chưa nhé.', 4000);
        break;
      }
      saveStoredFirebaseConfig(parsed);
      showToast('Đã lưu cấu hình — đang tải lại trang...', 2500);
      setTimeout(()=> location.reload(), 1200);
      break;
    }
    case 'show-firebase-config-form': state.syncShowConfigForm = !state.syncShowConfigForm; render(); break;
    case 'sync-connect': {
      if(!firebaseReady()){ showToast('Chưa cấu hình Firebase.'); break; }
      const inp = document.getElementById('sync-code-input');
      const code = inp ? inp.value.trim() : '';
      if(!code){ showToast('Nhập mã đồng bộ nhé.'); break; }
      setSyncCode(code);
      showToast('Đang kết nối...', 3000);
      (async ()=>{
        try{
          const existing = await firestoreBackend.get('classes', true);
          const hasCloudData = existing && existing.value && JSON.parse(existing.value).length;
          if(!hasCloudData && state.classes.length){
            openConfirmModal('Mã đồng bộ này chưa có dữ liệu trên đám mây. Tải toàn bộ dữ liệu hiện có trên máy này lên để bắt đầu đồng bộ?', false, async ()=>{
              try{
                showToast('Đang tải dữ liệu lên đám mây, chờ chút nhé...', 6000);
                const ok = await pushAllToFirestore();
                await loadAll();
                if(ok) setLastSyncAt();
                showToast(ok ? 'Đã tải dữ liệu lên và bắt đầu đồng bộ.' : 'Tải lên chưa trọn vẹn — kiểm tra lại Rules trên Firestore rồi thử lại.', 4500);
              }catch(e){
                showToast('Có lỗi khi tải dữ liệu lên — cô kiểm tra lại kết nối mạng và Firestore Rules nhé.', 4500);
              }finally{
                render();
              }
            });
            return;
          }
          await loadAll();
          setLastSyncAt();
          showToast('Đã kết nối đồng bộ.');
        }catch(e){
          showToast('Không kết nối được — kiểm tra lại cấu hình Firebase và Rules trên Firestore.', 4500);
        }finally{
          render();
        }
      })();
      break;
    }
    case 'copy-sync-code': {
      const code = getSyncCode();
      copyTextToClipboard(code).then(ok=>{
        showToast(ok ? 'Đã copy mã đồng bộ.' : 'Không copy được — mã của cô là: '+code, 4000);
      });
      break;
    }
    case 'sync-disconnect': {
      openConfirmModal('Ngắt kết nối đồng bộ? Thiết bị này sẽ quay lại lưu dữ liệu cục bộ, không mất dữ liệu hiện có.', false, ()=>{
        clearSyncCode();
        (async ()=>{ await loadAll(); render(); showToast('Đã ngắt kết nối đồng bộ.'); })();
      });
      break;
    }
    case 'toggle-daily-task': {
      const today = todayISO();
      if(!state.dailyTasks[today]) state.dailyTasks[today] = {};
      state.dailyTasks[today][elx.dataset.task] = elx.checked;
      render(); saveDailyTasks();
      break;
    }
    case 'toggle-suggestion-done': {
      const today = todayISO();
      if(!state.dailyTasks[today]) state.dailyTasks[today] = {};
      state.dailyTasks[today][elx.dataset.id] = elx.checked;
      render(); saveDailyTasks();
      break;
    }
    case 'add-daily-template': {
      const inp = document.getElementById('new-daily-task');
      const title = inp ? inp.value.trim() : '';
      if(!title){ showToast('Nhập tên việc cần làm nhé.'); break; }

    case 'goto-session-date': {

      state.session.date = elx.dataset.date;
      state.tab = 'session';
      render();
      break;
    }
    case 'goto-duties': {

      state.homeroom.classId = elx.dataset.class;

      render();

    /* ---- Modal ---- */
    case 'modal-cancel': closeModal(); break;
    case 'modal-backdrop': if(e && e.target===elx) closeModal(); break;
    case 'modal-input': break;
    case 'modal-submit': {
      const m = state.modal;
      if(!m) break;
      if(m.type==='prompt'){
        const input = document.getElementById('modal-input');
        const val = input ? input.value : '';
        const cb = m.onSubmit;
        state.modal = null;
        if(cb) cb(val);
        render();
      } else {
        const cb = m.onSubmit;
        state.modal = null;
        if(cb) cb();
        render();
      }
      break;
    }

    /* ---- Classes ---- */
    case 'add-class': {
      openPromptModal('Tên lớp học', '', (name)=>{
        if(name && name.trim()){
          const c = {id:uid(), name:name.trim(), students:[]};
          state.classes.push(c);
          state.currentClassId = c.id;
          saveClasses();
        }
      });
      break;
    }
    case 'rename-class': {
      const c = getClass(elx.dataset.id);
      openPromptModal('Đổi tên lớp', c.name, (name)=>{
        if(name && name.trim()){ c.name = name.trim(); saveClasses(); }
      });
      break;
    }
    case 'delete-class': {
      const id = elx.dataset.id;
      openConfirmModal('Xoá lớp này? Toàn bộ dữ liệu buổi học của lớp sẽ bị xoá.', true, ()=>{
        state.classes = state.classes.filter(c=>c.id!==id);
        delete state.sessionsByClass[id];
        storageSet('sessions_'+id, JSON.stringify([]));
        if(state.currentClassId===id) state.currentClassId = state.classes[0]? state.classes[0].id : null;
        saveClasses();
      });
      break;
    }
    case 'select-class': state.currentClassId = elx.dataset.id; render(); break;
    case 'add-student': {
      const c = getClass(state.currentClassId);
      openPromptModal('Thêm học sinh', '', (text)=>{
        const names = text.split(/\r?\n|,|;/)
          .map(s=> s.trim().replace(/^(\d+[\.\)]|[-•*])\s*/,'').trim())
          .filter(Boolean);
        if(names.length){
          names.forEach(name=> c.students.push({id:uid(), name}));
          saveClasses();
        }
      }, {
        multiline:true,
        showListTip:true,
        placeholder:'Nguyễn Văn A\nTrần Thị B\nLê Văn C\n...',
        hint:'Dán cả danh sách (mỗi học sinh một dòng) hoặc gõ từng tên — mỗi dòng sẽ tự tách thành một học sinh.'
      });
      break;
    }
    case 'rename-student': {
      const c = getClass(state.currentClassId);
      const s = c.students.find(x=>x.id===elx.dataset.id);
      openPromptModal('Sửa tên học sinh', s.name, (name)=>{
        if(name && name.trim()){ s.name = name.trim(); saveClasses(); }
      });
      break;
    }
    case 'delete-student': {
      const c = getClass(state.currentClassId);
      const sid = elx.dataset.id;
      openConfirmModal('Xoá học sinh này khỏi lớp?', true, ()=>{
        c.students = c.students.filter(x=>x.id!==sid);
        saveClasses();
      });
      break;
    }

    /* ---- Session ---- */
    case 'change-class-session': state.currentClassId = elx.value; state.session.prompt=''; render(); break;
    case 'change-session-date': state.session.date = elx.value; state.session.prompt=''; render(); break;
    case 'delete-session': {
      const classId = state.currentClassId, date = state.session.date;
      openConfirmModal(`Xoá toàn bộ dữ liệu buổi học ngày ${fmtDateVN(date)}? Điểm danh, checklist, điểm số và ghi chú của buổi này sẽ mất hết.`, true, ()=>{
        const list = state.sessionsByClass[classId] || [];
        state.sessionsByClass[classId] = list.filter(s=>s.date!==date);
        render(); saveSessions(classId);
      });
      break;
    }
    case 'set-teacher-name': state.teacherName = elx.value; saveTeacherName(); break;
    case 'export-session-doc': exportSessionWordTemplate(); break;
    case 'generate-session-prompt': {
      state.session.prompt = buildSessionReportPrompt(elx.dataset.class, elx.dataset.date);
      render();
      break;
    }
    case 'copy-session-prompt': {
      const el = document.getElementById('session-prompt-text');
      const text = el ? el.value : state.session.prompt;
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy prompt — dán vào công cụ AI để tạo bảng báo cáo.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }
    case 'set-att': {
      const sess = ensureSessionEditable();
      sess.attendance[elx.dataset.student] = elx.dataset.value;
      render(); saveSessions(state.currentClassId);
      break;
    }
    case 'tick-all-attendance': {
      const sess = ensureSessionEditable();
      getStudents(state.currentClassId).forEach(st=>{ sess.attendance[st.id] = 'present'; });
      render(); saveSessions(state.currentClassId);
      showToast('Đã tick cả lớp là Có mặt.');
      break;
    }
    case 'tick-all-checklist': {
      const sess = ensureSessionEditable();
      const typeId = elx.dataset.type;
      getStudents(state.currentClassId).forEach(st=>{
        if(!sess.checklist[st.id]) sess.checklist[st.id] = {};
        sess.checklist[st.id][typeId] = 'full';
      });
      render(); saveSessions(state.currentClassId);
      showToast('Đã tick cả lớp là Đầy đủ.');
      break;
    }
    case 'add-extype': {
      const input = document.getElementById('new-extype');
      if(input && input.value.trim()){
        const sess = ensureSessionEditable();
        sess.exerciseTypes.push({id:uid(), name:input.value.trim()});
        render(); saveSessions(state.currentClassId);
      }
      break;
    }
    case 'del-extype': {
      const sess = ensureSessionEditable();
      sess.exerciseTypes = sess.exerciseTypes.filter(t=>t.id!==elx.dataset.id);
      Object.keys(sess.checklist).forEach(sid=>{ delete sess.checklist[sid][elx.dataset.id]; });
      render(); saveSessions(state.currentClassId);
      break;
    }
    case 'cycle-check': {
      const sess = ensureSessionEditable();
      const sid = elx.dataset.student, tid = elx.dataset.type;
      if(!sess.checklist[sid]) sess.checklist[sid] = {};
      const cur = sess.checklist[sid][tid] || 'none';
      const next = cur==='none' ? 'partial' : (cur==='partial' ? 'full' : 'none');
      sess.checklist[sid][tid] = next;
      render(); saveSessions(state.currentClassId);
      break;
    }
    case 'add-exercise': {
      const input = document.getElementById('new-exercise');
      const modeSel = document.getElementById('new-exercise-mode');
      const totalInput = document.getElementById('new-exercise-total');
      const name = input ? input.value.trim() : '';
      const mode = modeSel ? modeSel.value : 'fraction';
      if(!name){ showToast('Nhập tên bài luyện tập nhé.'); break; }
      const sess = ensureSessionEditable();
      if(mode==='scale10'){
        sess.exercises.push({id:uid(), name, mode:'scale10'});
        render(); saveSessions(state.currentClassId);
      } else {
        const total = totalInput ? parseInt(totalInput.value, 10) : NaN;
        if(!(total>0)){ showToast('Nhập tổng số câu (lớn hơn 0) nhé.'); break; }
        sess.exercises.push({id:uid(), name, mode:'fraction', totalQuestions: total});
        render(); saveSessions(state.currentClassId);
      }
      break;
    }
    case 'del-exercise': {
      const sess = ensureSessionEditable();
      sess.exercises = sess.exercises.filter(x=>x.id!==elx.dataset.id);
      Object.keys(sess.scores).forEach(sid=>{ delete sess.scores[sid][elx.dataset.id]; });
      if(state.session.sortKey === elx.dataset.id) state.session.sortKey = 'default';
      render(); saveSessions(state.currentClassId);
      break;
    }
    case 'session-sort-key': state.session.sortKey = elx.value; render(); break;
    case 'session-sort-dir': state.session.sortDir = elx.value; render(); break;
    case 'reset-scores': {
      openConfirmModal('Đặt lại toàn bộ điểm bài luyện tập của buổi này? Các bài đã tạo vẫn được giữ nguyên, chỉ xoá điểm đã nhập.', true, ()=>{
        const sess = ensureSessionEditable();
        sess.scores = {};
        render(); saveSessions(state.currentClassId);
      });
      break;
    }
    case 'set-score': {
      const sess = ensureSessionEditable();
      const sid = elx.dataset.student, exid = elx.dataset.exercise;
      const total = Number(elx.dataset.total) || 10;
      const mode = elx.dataset.mode || 'fraction';
      if(!sess.scores[sid]) sess.scores[sid] = {};
      const val = elx.value;
      if(val===''){ delete sess.scores[sid][exid]; }
      else if(mode==='scale10'){
        sess.scores[sid][exid] = Math.round(clamp(Number(val),0,10)*10)/10;
      } else {
        sess.scores[sid][exid] = clamp(Math.round(Number(val)),0,total);
      }
      saveSessions(state.currentClassId);
      break;
    }
    case 'toggle-punishment-done': {
      const sess = ensureSessionEditable();
      if(!sess.punishmentDone) sess.punishmentDone = {};
      sess.punishmentDone[elx.dataset.student] = elx.checked;
      saveSessions(state.currentClassId);
      break;
    }
    case 'toggle-punishment-assign': {
      const sess = ensureSessionEditable();
      if(!sess.punishmentAssigned) sess.punishmentAssigned = {};
      sess.punishmentAssigned[elx.dataset.student] = elx.checked;
      saveSessions(state.currentClassId);
      break;
    }
    case 'set-note': {
      const sess = ensureSessionEditable();
      sess.studentNotes[elx.dataset.student] = elx.value;
      saveSessions(state.currentClassId);
      break;
    }

    /* ---- Report ---- */
    case 'report-change-class': state.report.classId = elx.value; state.report.studentId=null; render(); break;
    case 'report-change-student': state.report.studentId = elx.value; render(); break;
    case 'report-set-mode': state.report.mode = elx.dataset.mode; render(); break;
    case 'goto-report':
      state.report.classId = elx.dataset.class; state.report.studentId = elx.dataset.student; state.report.mode='student';
      state.tab = 'report'; render(); break;
    case 'goto-student-profile':
      state.studentProfileId = elx.dataset.student; state.globalSearch=''; state.tab = 'studentProfile'; render(); break;
    case 'close-student-profile':
      state.studentProfileId = null; state.tab = 'home'; render(); break;
    case 'goto-report-profile':
      state.report.classId = elx.dataset.class; state.report.studentId = elx.dataset.student; state.report.mode='student';
      state.tab = 'report'; render(); break;
    case 'goto-violations-profile':
      state.currentClassId = elx.dataset.class; state.homeroom.classId = elx.dataset.class;
      state.homeroom.section = 'violations'; state.homeroom.violationStudentId = elx.dataset.student;
      state.tab = 'homeroom'; render(); break;
    case 'goto-activities-profile':
      state.currentClassId = elx.dataset.class; state.homeroom.classId = elx.dataset.class;
      state.homeroom.section = 'activities'; state.homeroom.activityStudentId = elx.dataset.student;
      state.tab = 'homeroom'; render(); break;
    case 'goto-contacts-profile':
      state.currentClassId = elx.dataset.class; state.contacts.classId = elx.dataset.class; state.contacts.studentId = elx.dataset.student;
      state.tab = 'contacts'; render(); break;
    case 'export-doc': exportWordDoc(); break;
    case 'copy-zalo': copyZaloMessage(elx.dataset.class, elx.dataset.student); break;

    /* ---- Progress ---- */
    case 'progress-select':
      state.progress.classId = elx.dataset.class; state.progress.studentId = elx.dataset.student; state.progress.query=''; render(); break;
    case 'progress-class-overview':
      state.progress.classId = elx.dataset.class; state.progress.studentId = null; render(); break;
    case 'progress-pick':
      state.progress.classId = elx.dataset.class; state.progress.studentId = elx.dataset.student; render(); break;
    case 'progress-to-report':
      state.report.classId = elx.dataset.class; state.report.studentId = elx.dataset.student; state.report.mode='student'; state.tab='report'; render(); break;

    /* ---- Attendance ---- */
    case 'attendance-change-class': state.attendance.classId = elx.value; state.attendance.month='all'; render(); break;
    case 'attendance-change-month': state.attendance.month = elx.value; render(); break;
    case 'attendance-pick-month': state.attendance.month = elx.dataset.month; render(); break;
    case 'export-excel': exportExcel(); break;

    /* ---- Trao đổi phụ huynh ---- */
    case 'contacts-change-class': state.contacts.classId = elx.value; state.contacts.studentId=null; render(); break;
    case 'contacts-select': state.contacts.studentId = elx.dataset.student; render(); break;
    case 'contacts-back': state.contacts.studentId = null; render(); break;
    case 'add-contact': {
      const classId = elx.dataset.class, studentId = elx.dataset.student;
      const dateEl = document.getElementById('contact-date');
      const methodEl = document.getElementById('contact-method');
      const contentEl = document.getElementById('contact-content');
      const content = contentEl ? contentEl.value.trim() : '';
      if(!content){ showToast('Nhập nội dung trao đổi trước khi lưu nhé.'); break; }
      const cls = getClass(classId);
      const st = cls && cls.students.find(s=>s.id===studentId);
      if(st){
        if(!st.contactLog) st.contactLog = [];
        st.contactLog.push({
          id: uid(),
          date: dateEl && dateEl.value ? dateEl.value : todayISO(),
          method: methodEl ? methodEl.value : 'Khác',
          content
        });
        render(); saveClasses();
      }
      break;
    }
    case 'delete-contact': {
      const classId = elx.dataset.class, studentId = elx.dataset.student, entryId = elx.dataset.entry;
      openConfirmModal('Xoá lần trao đổi này khỏi lịch sử?', true, ()=>{
        const cls = getClass(classId);
        const st = cls && cls.students.find(s=>s.id===studentId);
        if(st && st.contactLog){ st.contactLog = st.contactLog.filter(e=>e.id!==entryId); }
        render(); saveClasses();
      });
      break;
    }

    /* ---- Thư khen ---- */
    case 'cert-change-class': state.certificates.classId = elx.value; state.certificates.studentId=null; state.certificates.description=''; render(); break;
    case 'cert-change-student': state.certificates.studentId = elx.value; state.certificates.description=''; render(); break;
    case 'cert-change-type': state.certificates.type = elx.value; state.certificates.description=''; render(); break;
    case 'cert-change-session': state.certificates.sessionDate = elx.value; state.certificates.description=''; render(); break;
    case 'cert-change-month': state.certificates.month = elx.value; state.certificates.description=''; render(); break;
    case 'generate-cert-description': {
      const desc = buildCertificateDescription(elx.dataset.class, elx.dataset.student, elx.dataset.type);
      if(!desc){ showToast('Chưa chọn được học sinh.'); break; }
      state.certificates.description = desc;
      render();
      break;
    }
    case 'copy-cert-description': {
      const el = document.getElementById('cert-description');
      const text = el ? el.value : state.certificates.description;
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy mô tả — dán vào công cụ tạo ảnh AI để tạo thư khen.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }

    /* ---- Challenge cả lớp ---- */
    case 'challenge-change-class': state.challenges.classId = elx.value; render(); break;
    case 'add-challenge': {
      const classId = elx.dataset.class;
      const titleEl = document.getElementById('new-challenge-title');
      const targetEl = document.getElementById('new-challenge-target');
      const unitEl = document.getElementById('new-challenge-unit');
      const descEl = document.getElementById('new-challenge-desc');
      const title = titleEl ? titleEl.value.trim() : '';
      const target = targetEl ? Number(targetEl.value) : NaN;
      const unit = unitEl ? unitEl.value.trim() : '';
      if(!title || !target || target<=0 || !unit){ showToast('Nhập đủ tên thử thách, mục tiêu (lớn hơn 0) và đơn vị nhé.'); break; }
      const cls = getClass(classId);
      if(!cls.challenges) cls.challenges = [];
      cls.challenges.push({
        id: uid(), title, description: descEl? descEl.value.trim() : '',
        target, unit, progress:0, createdDate: todayISO(), completed:false, log:[]
      });
      render(); saveClasses();
      break;
    }
    case 'add-challenge-progress': {
      const classId = elx.dataset.class, challengeId = elx.dataset.challenge;
      const amountEl = document.getElementById('add-progress-'+challengeId);
      const noteEl = document.getElementById('add-note-'+challengeId);
      const amount = amountEl ? Number(amountEl.value) : NaN;
      if(!amount || amount<=0){ showToast('Nhập số lượng cần cộng (lớn hơn 0) nhé.'); break; }
      const cls = getClass(classId);
      const ch = cls && cls.challenges && cls.challenges.find(c=>c.id===challengeId);
      if(ch){
        ch.progress += amount;
        if(!ch.log) ch.log = [];
        ch.log.push({id:uid(), date:todayISO(), amount, note: noteEl? noteEl.value.trim() : ''});
        if(ch.progress >= ch.target) ch.completed = true;
        render(); saveClasses();
      }
      break;

        const cls = getClass(classId);
        if(cls && cls.challenges){ cls.challenges = cls.challenges.filter(c=>c.id!==challengeId); }
        render(); saveClasses();

    case 'homeroom-set-section': state.homeroom.section = elx.dataset.section; state.homeroom.violationStudentId=null; render(); break;

    case 'homeroom-change-month': state.homeroom.month = elx.value; render(); break;
    case 'conduct-set-rating': {
      const classId = elx.dataset.class, month = elx.dataset.month, studentId = elx.dataset.student;
      const cls = getClass(classId);
      if(!cls.conduct) cls.conduct = {};
      if(!cls.conduct[month]) cls.conduct[month] = {};
      if(!cls.conduct[month][studentId]) cls.conduct[month][studentId] = {};
      cls.conduct[month][studentId].rating = elx.value;
      saveClasses();
      break;
    }
    case 'conduct-set-note': {
      const classId = elx.dataset.class, month = elx.dataset.month, studentId = elx.dataset.student;
      const cls = getClass(classId);
      if(!cls.conduct) cls.conduct = {};
      if(!cls.conduct[month]) cls.conduct[month] = {};
      if(!cls.conduct[month][studentId]) cls.conduct[month][studentId] = {};
      cls.conduct[month][studentId].note = elx.value;
      saveClasses();
      break;
    }
    case 'export-conduct': exportConductExcel(elx.dataset.class, elx.dataset.month); break;

    /* ---- Điểm kiểm tra tháng ---- */
    case 'exam-change-month': state.homeroom.examMonth = elx.value; state.homeroom.examPrompt=''; render(); break;
    case 'set-exam-score': {
      const classId = elx.dataset.class, month = elx.dataset.month, studentId = elx.dataset.student, subject = elx.dataset.subject;
      const cls = getClass(classId);
      if(!cls.monthlyExams) cls.monthlyExams = {};
      if(!cls.monthlyExams[month]) cls.monthlyExams[month] = {};
      if(!cls.monthlyExams[month][studentId]) cls.monthlyExams[month][studentId] = {};
      const val = elx.value;
      if(val===''){ delete cls.monthlyExams[month][studentId][subject]; }
      else { cls.monthlyExams[month][studentId][subject] = clamp(Number(val),0,10); }
      render(); saveClasses();
      break;
    }
    case 'export-exams': exportExamsExcel(elx.dataset.class, elx.dataset.month); break;
    case 'generate-exam-prompt': {
      state.homeroom.examPrompt = buildExamReportPrompt(elx.dataset.class, elx.dataset.month);
      render();
      break;
    }
    case 'copy-exam-prompt': {
      const el = document.getElementById('exam-prompt-text');
      const text = el ? el.value : state.homeroom.examPrompt;
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy prompt — dán vào công cụ AI để tạo báo cáo.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;

    /* ---- Hoạt động phong trào ---- */

    case 'activities-back': state.homeroom.activityStudentId = null; render(); break;
    case 'activity-change-semester': state.homeroom.activitySemester = elx.value; render(); break;
    case 'add-club': {
      const classId = elx.dataset.class;
      const nameEl = document.getElementById('new-club-name');
      const name = nameEl ? nameEl.value.trim() : '';
      if(!name){ showToast('Nhập tên CLB nhé.'); break; }
      const cls = getClass(classId);
      if(!cls.clubs) cls.clubs = [];
      cls.clubs.push({id: uid(), name});
      render(); saveClasses();
      break;

    case 'delete-club': {
      const classId = elx.dataset.class, clubId = elx.dataset.club;
      openConfirmModal('Xoá CLB này? Học sinh trong CLB sẽ về trạng thái chưa tham gia CLB.', true, ()=>{
        const cls = getClass(classId);
        if(cls.clubs){ cls.clubs = cls.clubs.filter(c=>c.id!==clubId); }
        cls.students.forEach(s=>{ if(s.clubId===clubId) s.clubId=''; });
        render(); saveClasses();
      });
      break;
    }
    case 'set-student-club': {
      const classId = elx.dataset.class, studentId = elx.dataset.student;
      const cls = getClass(classId);
      const st = cls.students.find(s=>s.id===studentId);
      if(st){ st.clubId = elx.value; saveClasses(); }
      break;
    }
    case 'add-activity': {
      const classId = elx.dataset.class, studentId = elx.dataset.student;
      const dateEl = document.getElementById('activity-date');
      const nameEl = document.getElementById('activity-name');
      const pointsEl = document.getElementById('activity-points-value');
      const noteEl = document.getElementById('activity-note');
      const activityName = nameEl ? nameEl.value.trim() : '';
      if(!activityName){ showToast('Nhập tên hoạt động trước khi lưu nhé.'); break; }
      const cls = getClass(classId);
      const st = cls.students.find(s=>s.id===studentId);
      if(st){
        if(!st.activities) st.activities = [];
        st.activities.push({
          id: uid(),
          date: dateEl && dateEl.value ? dateEl.value : todayISO(),
          activityName,
          points: pointsEl ? (Number(pointsEl.value)||0) : 5,
          note: noteEl ? noteEl.value.trim() : ''
        });
        render(); saveClasses();
      }
      break;
    }
    case 'delete-activity': {
      const classId = elx.dataset.class, studentId = elx.dataset.student, entryId = elx.dataset.entry;
      openConfirmModal('Xoá lượt hoạt động này khỏi lịch sử?', true, ()=>{
        const cls = getClass(classId);
        const st = cls.students.find(s=>s.id===studentId);
        if(st && st.activities){ st.activities = st.activities.filter(a=>a.id!==entryId); }
        render(); saveClasses();
      });
      break;
    }

    /* ---- Vi phạm nội quy ---- */
    case 'violations-select': state.homeroom.violationStudentId = elx.dataset.student; render(); break;
    case 'violations-back': state.homeroom.violationStudentId = null; render(); break;
    case 'violations-change-sort': state.violationsSort = elx.value; render(); break;
    case 'add-violation': {
      const classId = elx.dataset.class, studentId = elx.dataset.student;
      const dateEl = document.getElementById('violation-date');
      const pointsEl = document.getElementById('violation-points');
      const contentEl = document.getElementById('violation-content');
      const content = contentEl ? contentEl.value.trim() : '';
      if(!content){ showToast('Nhập nội dung vi phạm trước khi lưu nhé.'); break; }
      const points = pointsEl ? Math.max(0, Number(pointsEl.value)||0) : 5;
      const cls = getClass(classId);
      const st = cls && cls.students.find(s=>s.id===studentId);
      if(st){
        if(!st.violations) st.violations = [];
        st.violations.push({id: uid(), date: dateEl && dateEl.value ? dateEl.value : todayISO(), content, points});
        render(); saveClasses();
        showToast('Đã ghi nhận vi phạm.');
        setTimeout(()=>{ const i=document.getElementById('violation-content'); if(i) i.focus(); }, 0);
      }
      break;
    }
    case 'delete-violation': {
      const classId = elx.dataset.class, studentId = elx.dataset.student, entryId = elx.dataset.entry;
      openConfirmModal('Xoá lần vi phạm này khỏi lịch sử?', true, ()=>{
        const cls = getClass(classId);
        const st = cls && cls.students.find(s=>s.id===studentId);
        if(st && st.violations){ st.violations = st.violations.filter(v=>v.id!==entryId); }
        render(); saveClasses();
      });
      break;
    }

    /* ---- Trực nhật xoay vòng ---- */
    case 'duty-shuffle': {
      const classId = elx.dataset.class;
      const cls = getClass(classId);
      const duty = cls.duty || { order: cls.students.map(s=>s.id), groupSize:1, startDate: mondayOf(todayISO()) };
      const order = duty.order.slice();
      for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=order[i]; order[i]=order[j]; order[j]=tmp; }
      cls.duty = { order, groupSize: duty.groupSize||1, startDate: duty.startDate };
      render(); saveClasses();
      break;
    }
    case 'duty-reset-order': {
      const classId = elx.dataset.class;
      const cls = getClass(classId);
      const duty = cls.duty || { groupSize:1, startDate: mondayOf(todayISO()) };
      cls.duty = { order: cls.students.map(s=>s.id), groupSize: duty.groupSize||1, startDate: duty.startDate || mondayOf(todayISO()) };
      render(); saveClasses();
      break;
    }
    case 'duty-save': {
      const classId = elx.dataset.class;
      const cls = getClass(classId);
      const gEl = document.getElementById('duty-group-size');
      const dEl = document.getElementById('duty-start-date');
      const existing = cls.duty || { order: cls.students.map(s=>s.id) };
      const groupSize = gEl ? Math.max(1, parseInt(gEl.value,10)||1) : 1;
      const startDate = dEl && dEl.value ? mondayOf(dEl.value) : mondayOf(todayISO());
      cls.duty = { order: (existing.order && existing.order.length) ? existing.order : cls.students.map(s=>s.id), groupSize, startDate };
      render(); saveClasses();
      showToast('Đã lưu thiết lập trực nhật.');
      break;
    }

    /* ---- Nhiệm vụ tập thể theo đợt ---- */
    case 'add-task': {
      const classId = elx.dataset.class;
      const titleEl = document.getElementById('new-task-title');
      const dueEl = document.getElementById('new-task-due');
      const descEl = document.getElementById('new-task-desc');
      const studentsEl = document.getElementById('new-task-students');
      const title = titleEl ? titleEl.value.trim() : '';
      if(!title){ showToast('Nhập tên nhiệm vụ nhé.'); break; }
      const assignedIds = studentsEl ? Array.from(studentsEl.selectedOptions).map(o=>o.value) : [];
      const cls = getClass(classId);
      if(!cls.tasks) cls.tasks = [];
      cls.tasks.push({id: uid(), title, description: descEl?descEl.value.trim():'', dueDate: dueEl?dueEl.value:'', assignedIds, completed:false});
      render(); saveClasses();
      break;
    }
    case 'task-complete': {
      const classId = elx.dataset.class, taskId = elx.dataset.task;
      const cls = getClass(classId);
      const t = cls.tasks && cls.tasks.find(x=>x.id===taskId);
      if(t){ t.completed = true; render(); saveClasses(); }
      break;
    }
    case 'task-delete': {
      const classId = elx.dataset.class, taskId = elx.dataset.task;
      openConfirmModal('Xoá nhiệm vụ này?', true, ()=>{
        const cls = getClass(classId);
        if(cls.tasks){ cls.tasks = cls.tasks.filter(x=>x.id!==taskId); }
        render(); saveClasses();
      });
      break;
    }

    /* ---- Thi đua tổ/nhóm ---- */
    case 'add-team': {
      const classId = elx.dataset.class;
      const nameEl = document.getElementById('new-team-name');
      const name = nameEl ? nameEl.value.trim() : '';
      if(!name){ showToast('Nhập tên tổ nhé.'); break; }
      const cls = getClass(classId);
      if(!cls.teams) cls.teams = [];
      cls.teams.push({id: uid(), name});
      render(); saveClasses();
      break;
    }
    case 'delete-team': {
      const classId = elx.dataset.class, teamId = elx.dataset.team;
      openConfirmModal('Xoá tổ này? Điểm đã cộng của tổ cũng sẽ mất, học sinh trong tổ sẽ về trạng thái chưa phân tổ.', true, ()=>{
        const cls = getClass(classId);
        if(cls.teams){ cls.teams = cls.teams.filter(t=>t.id!==teamId); }
        if(cls.teamScores){ cls.teamScores = cls.teamScores.filter(s=>s.teamId!==teamId); }
        cls.students.forEach(s=>{ if(s.teamId===teamId) s.teamId=''; });
        render(); saveClasses();
      });
      break;
    }
    case 'set-student-team': {
      const classId = elx.dataset.class, studentId = elx.dataset.student;
      const cls = getClass(classId);
      const st = cls.students.find(s=>s.id===studentId);
      if(st){ st.teamId = elx.value; saveClasses(); }
      break;
    }
    case 'add-team-score': {
      const classId = elx.dataset.class;
      const teamSel = document.getElementById('score-team-select');
      const pointsEl = document.getElementById('score-points');
      const reasonEl = document.getElementById('score-reason');
      const dateEl = document.getElementById('score-date');
      const teamId = teamSel ? teamSel.value : '';
      const points = pointsEl ? Number(pointsEl.value) : NaN;
      if(!teamId || !points){ showToast('Chọn tổ và nhập số điểm (khác 0) nhé.'); break; }
      const cls = getClass(classId);
      if(!cls.teamScores) cls.teamScores = [];
      cls.teamScores.push({id: uid(), teamId, points, reason: reasonEl?reasonEl.value.trim():'', date: (dateEl&&dateEl.value)?dateEl.value:todayISO()});
      render(); saveClasses();
      showToast('Đã áp dụng điều chỉnh.');
      setTimeout(()=>{ const i=document.getElementById('score-points'); if(i) i.focus(); }, 0);
      break;
    }
    case 'teams-change-month': state.teamsMonth = elx.value; render(); break;
    case 'teams-set-base-score': {
      const classId = elx.dataset.class || state.homeroom.classId || state.currentClassId;
      const cls = getClass(classId);
      const v = Number(elx.value);
      if(!cls.teamSettings) cls.teamSettings = {};
      if(!isNaN(v)) cls.teamSettings.baseScore = v;
      render(); saveClasses();
      break;
    }
    case 'generate-team-prompt': {
      const text = buildTeamRosterPrompt(elx.dataset.class, elx.dataset.team, elx.dataset.month);
      if(text){ if(!state.teamsPrompts) state.teamsPrompts={}; state.teamsPrompts[elx.dataset.team] = text; render(); }
      break;
    }
    case 'generate-class-teams-prompt': {
      const text = buildClassTeamsDiagramPrompt(elx.dataset.class, elx.dataset.month);
      if(text){ state.classTeamsPrompt = text; render(); }
      else { showToast('Chưa có tổ nào để tạo sơ đồ.'); }
      break;
    }
    case 'copy-class-teams-prompt': {
      const el = document.getElementById('class-teams-prompt-text');
      const text = el ? el.value : state.classTeamsPrompt;
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy — dán vào ChatGPT để tạo sơ đồ.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }
    case 'copy-team-prompt': {
      const tid = elx.dataset.team;
      const el = document.getElementById('team-prompt-'+tid);
      const text = el ? el.value : (state.teamsPrompts||{})[tid];
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy — dán vào ChatGPT để tạo ảnh tổ.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }
    case 'remove-team-prompt': {
      if(state.teamsPrompts) delete state.teamsPrompts[elx.dataset.team];
      render();
      break;
    }

    /* ---- Chỗ ngồi ---- */
    case 'set-seat': {
      const classId = elx.dataset.class, seat = elx.dataset.seat;
      const cls = getClass(classId);
      if(!cls.seating) cls.seating = {assignments:{}};
      if(!cls.seating.assignments) cls.seating.assignments = {};
      if(elx.value){ cls.seating.assignments[seat] = elx.value; }
      else { delete cls.seating.assignments[seat]; }
      render(); saveClasses();
      break;
    }
    case 'generate-seating-prompt': {
      state.seating.prompt = buildSeatingPrompt(elx.dataset.class);
      render();
      break;
    }
    case 'copy-seating-prompt': {
      const el = document.getElementById('seating-prompt-text');
      const text = el ? el.value : state.seating.prompt;
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy prompt — dán vào công cụ AI để minh hoạ chỗ ngồi.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }

    /* ---- Vinh danh ---- */
    case 'honors-change-class': state.honors.classId = elx.value; render(); break;
    case 'honors-change-period': state.honors.period = elx.value; render(); break;
    case 'honors-change-month': state.honors.month = elx.value; render(); break;
    case 'honors-change-semester': state.honors.semester = elx.value; render(); break;
    case 'honors-toggle-criteria': state.honors.criteria[elx.dataset.key] = elx.checked; render(); break;
    case 'honors-set-threshold': {
      const v = Number(elx.value);
      if(!isNaN(v)) state.honors.thresholds[elx.dataset.key] = v;
      render();
      break;
    }
    case 'generate-honor-prompt': {
      const text = buildHonorPrompt(elx.dataset.class, elx.dataset.student, elx.dataset.period, elx.dataset.key);
      if(text){ state.honors.prompts[elx.dataset.student] = text; render(); }
      else { showToast('Không tạo được giấy khen — thử lại nhé.'); }
      break;
    }
    case 'copy-honor-prompt': {
      const sid = elx.dataset.student;
      const el = document.getElementById('honor-prompt-'+sid);
      const text = el ? el.value : state.honors.prompts[sid];
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy giấy khen — dán vào ChatGPT để hoàn thiện.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }
    case 'remove-honor-prompt': {
      delete state.honors.prompts[elx.dataset.student];
      render();
      break;
    }

    /* ---- Quản trị rủi ro ---- */
    case 'risk-change-class': state.riskMgmt.classId = elx.value; render(); break;
    case 'risk-set-session-count': {
      const v = parseInt(elx.value, 10);
      if(v>0) state.riskMgmt.sessionCount = v;
      render();
      break;
    }
    case 'risk-toggle-criteria': state.riskMgmt.criteria[elx.dataset.key] = elx.checked; render(); break;
    case 'risk-set-threshold': {
      const v = Number(elx.value);
      if(!isNaN(v)) state.riskMgmt.thresholds[elx.dataset.key] = v;
      render();
      break;
    }
    case 'generate-risk-prompt': {
      const classId = elx.dataset.class, studentId = elx.dataset.student, type = elx.dataset.type;
      let text = '';
      if(type==='parent') text = buildRiskParentPrompt(classId, studentId, state.riskMgmt.sessionCount);
      else if(type==='causes') text = buildRiskCausesPrompt(classId, studentId, state.riskMgmt.sessionCount);
      else text = buildRiskSupportPrompt(classId, studentId, state.riskMgmt.sessionCount);
      if(!state.riskMgmt.prompts[studentId]) state.riskMgmt.prompts[studentId] = {};
      state.riskMgmt.prompts[studentId][type] = text;
      render();
      break;
    }
    case 'copy-risk-prompt': {
      const sid = elx.dataset.student, type = elx.dataset.type;
      const el = document.getElementById(`risk-prompt-${sid}-${type}`);
      const text = el ? el.value : (state.riskMgmt.prompts[sid]||{})[type];
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy — dán vào ChatGPT để hoàn thiện.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }
    case 'remove-risk-prompt': {
      const sid = elx.dataset.student, type = elx.dataset.type;
      if(state.riskMgmt.prompts[sid]){
        delete state.riskMgmt.prompts[sid][type];
        if(!Object.keys(state.riskMgmt.prompts[sid]).length) delete state.riskMgmt.prompts[sid];
      }
      render();
      break;
    }

    /* ---- Lưu trữ hồ sơ ---- */
    case 'records-filter-type': state.records.filterType = elx.value; render(); break;
    case 'records-filter-from': state.records.dateFrom = elx.value; render(); break;
    case 'records-filter-to': state.records.dateTo = elx.value; render(); break;
    case 'record-filter-class': state.records.formClassId = elx.value; render(); break;
    case 'record-add-student-chip': {
      const sel = document.getElementById('record-add-student');
      const sid = sel ? sel.value : '';
      if(!sid){ showToast('Chọn lớp rồi chọn tên học sinh nhé.'); break; }
      if(!state.records.formStudentIds.includes(sid)) state.records.formStudentIds.push(sid);
      render();
      break;
    }
    case 'record-remove-student': {
      state.records.formStudentIds = state.records.formStudentIds.filter(id=>id!==elx.dataset.id);
      render();
      break;
    }
    case 'records-add': {
      const typeEl = document.getElementById('record-type');
      const dateEl = document.getElementById('record-date');
      const titleEl = document.getElementById('record-title');
      const summaryEl = document.getElementById('record-summary');
      const linkEl = document.getElementById('record-link');
      const title = titleEl ? titleEl.value.trim() : '';
      const studentIds = state.records.formStudentIds.slice();
      if(!title){ showToast('Nhập tiêu đề hồ sơ nhé.'); break; }
      if(!studentIds.length){ showToast('Chọn ít nhất 1 học sinh liên quan nhé.'); break; }
      state.records.list.push({
        id: uid(),
        type: typeEl ? typeEl.value : RECORD_TYPES[0],
        title,
        date: dateEl && dateEl.value ? dateEl.value : todayISO(),
        studentIds,
        summary: summaryEl ? summaryEl.value.trim() : '',
        link: linkEl ? linkEl.value.trim() : '',
      });
      state.records.formStudentIds = [];
      state.records.formClassId = '';
      render(); saveRecords();
      showToast('Đã lưu hồ sơ.');
      break;
    }
    case 'records-edit': {
      const rec = state.records.list.find(x=>x.id===elx.dataset.id);
      state.records.editingId = elx.dataset.id;
      state.records.formStudentIds = rec ? rec.studentIds.slice() : [];
      state.records.formClassId = '';
      render();
      break;
    }
    case 'records-cancel-edit': {
      state.records.editingId = null;
      state.records.formStudentIds = [];
      state.records.formClassId = '';
      render();
      break;
    }
    case 'records-save-edit': {
      const id = elx.dataset.id;
      const rec = state.records.list.find(x=>x.id===id);
      if(!rec) break;
      const typeEl = document.getElementById('record-type');
      const dateEl = document.getElementById('record-date');
      const titleEl = document.getElementById('record-title');
      const summaryEl = document.getElementById('record-summary');
      const linkEl = document.getElementById('record-link');
      const title = titleEl ? titleEl.value.trim() : '';
      const studentIds = state.records.formStudentIds.slice();
      if(!title){ showToast('Nhập tiêu đề hồ sơ nhé.'); break; }
      if(!studentIds.length){ showToast('Chọn ít nhất 1 học sinh liên quan nhé.'); break; }
      rec.type = typeEl ? typeEl.value : rec.type;
      rec.date = dateEl && dateEl.value ? dateEl.value : rec.date;
      rec.title = title;
      rec.studentIds = studentIds;
      rec.summary = summaryEl ? summaryEl.value.trim() : '';
      rec.link = linkEl ? linkEl.value.trim() : '';
      state.records.editingId = null;
      state.records.formStudentIds = [];
      state.records.formClassId = '';
      render(); saveRecords();
      showToast('Đã cập nhật hồ sơ.');
      break;
    }
    case 'records-delete': {
      const id = elx.dataset.id;
      openConfirmModal('Xoá hồ sơ này? Không thể khôi phục.', true, ()=>{
        state.records.list = state.records.list.filter(x=>x.id!==id);
        delete state.records.prompts[id];
        render(); saveRecords();
      });
      break;
    }
    case 'generate-record-prompt': {
      const text = buildRecordSummaryPrompt(elx.dataset.id);
      if(text){ state.records.prompts[elx.dataset.id] = text; render(); }
      break;
    }
    case 'copy-record-prompt': {
      const id = elx.dataset.id;
      const el = document.getElementById('record-prompt-'+id);
      const text = el ? el.value : state.records.prompts[id];
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy — dán vào ChatGPT để tóm tắt.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }
  }
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  await loadAll();
  state.syncPanelOpen = !syncActive();
  render();
})();

// Tạm gỡ bỏ hoàn toàn service worker/cache cũ (nếu thiết bị đã từng cài từ bản trước) —
// để đảm bảo mọi thiết bị luôn lấy đúng bản mới nhất khi cô cập nhật file, không bị
// kẹt lại bản cũ do cơ chế cache ngoại tuyến (PWA) từng thêm trước đây.
try{
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs=>{
      regs.forEach(reg=> reg.unregister());
    }).catch(()=>{});
  }
  if('caches' in window){
    caches.keys().then(keys=>{
      keys.forEach(k=> caches.delete(k));
    }).catch(()=>{});
  }
}catch(e){}
</script>
