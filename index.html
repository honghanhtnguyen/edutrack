function handle(action, elx){
  switch(action){
    case 'gt-mode': S.mode = elx.dataset.mode; rerender(); break;
    case 'gt-class': S.classId = elx.value; S.date = state.session.date || todayISO(); rerender(); break;
    case 'gt-date': S.date = elx.value; rerender(); break;
    case 'gt-num': S.numCount = clamp(parseInt(elx.value)||30,2,50); rerender(); break;
    case 'gt-temp': S.temp = elx.value; break;
    case 'gt-toggle': {
      const parts = participants(), idx = parseInt(elx.dataset.idx), p = parts[idx]; if(!p) break;
      S.override[overrideKey(p, idx)] = !p.included; rerender(); break;
    }
    case 'gt-all': {
      participants().forEach((p,idx)=>{ S.override[overrideKey(p,idx)] = true; }); rerender(); break;
    }
    case 'gt-game': cfg.game = elx.dataset.game; save(); rerender(); break;
    case 'gt-duration': cfg.duration = clamp(parseInt(elx.value)||20,10,30); save(); rerender(); break;
    case 'gt-opt': cfg.opts[elx.dataset.opt] = !!elx.checked; save(); rerender(); break;
    case 'gt-sound': cfg.sound = !!elx.checked; save(); rerender(); break;
    case 'gt-dark': cfg.dark = !cfg.dark; save(); rerender(); break;
    case 'gt-test': { const was = cfg.sound; cfg.sound = true; ac(); playSfx('win'); cfg.sound = was; if(!was) showToast('Âm thanh đang tắt — tick "Bật âm thanh" để nghe trong lúc chơi.', 3000); break; }
    case 'gt-challenges': {
      const arr = elx.value.split('\n').map(x=>x.trim()).filter(Boolean);
      cfg.challenges = arr.length ? arr : null; save(); break;
    }
    case 'gt-challenges-reset': cfg.challenges = null; save(); rerender(); showToast('Đã khôi phục danh sách thử thách mặc định.'); break;
    case 'gt-reset': resetRound(); S.tmpLog = []; rerender(); showToast('Đã làm lại từ đầu — ai cũng có thể được gọi.'); break;
    case 'gt-start': start(); break;
  }
}

/* ---------- Chuẩn bị 1 lượt gọi ---------- */
function prepareRound(){
  const all = participants().filter(p=>p.included);
  if(all.length<2){ showToast('Cần chọn ít nhất 2 bạn để chơi.'); return null; }
  const R = mulberry((Math.random()*4294967296)>>>0);
  const ck = p=> S.mode==='class' ? p.sid : p.key;
  let called = calledSet();
  let pool = cfg.opts.skip ? all.filter(p=>!called[ck(p)]) : all.slice();
  if(cfg.opts.skip && pool.length===0){
    resetRound(); called = calledSet(); pool = all.slice();
    showToast('Cả lớp đã được gọi — bắt đầu vòng mới!', 2800);
  }
  // người chơi hiển thị: nhóm còn lại + (nếu ít) vài bạn đã gọi làm "người ngoài cuộc" để màn chơi không trống
  let chars = pool.slice();
  if(chars.length<6){
    const extra = shuffleArr(all.filter(p=>chars.indexOf(p)<0), R);
    while(chars.length<Math.min(6,all.length) && extra.length) chars.push(extra.pop());
  }
  if(cfg.opts.shuffle) chars = shuffleArr(chars, R);
  // chọn người thắng (có trọng số công bằng)
  const counts = callCounts();
  const wts = pool.map(p=> (cfg.opts.fair && S.mode==='class') ? 1/Math.pow(1+(counts[p.sid]||0),2) : 1);
  const sum = wts.reduce((a,b)=>a+b,0); let r = R()*sum, wp = pool[pool.length-1];
  for(let i=0;i<pool.length;i++){ r-=wts[i]; if(r<=0){ wp = pool[i]; break; } }
  const winner = chars.indexOf(wp);
  let fake = -1;
  if(cfg.opts.flip && chars.length>=2){
    do{ fake = Math.floor(R()*chars.length); }while(fake===winner);
  }
  return {chars, winner, fake, seed:(R()*4294967296)>>>0};
}

/* ---------- Lớp phủ toàn màn hình ---------- */
let OV=null, G=null, resultShown=false;
function ensureOverlay(){
  if(OV) return;
  OV = document.createElement('div'); OV.id='gt-overlay';
  OV.innerHTML = `<canvas id="gt-cv"></canvas>
    <div class="gt-prog"><i id="gt-pg"></i></div>
    <div class="gt-hud"><div class="gt-title" id="gt-title"></div><div class="gt-hud-r">
      <button id="gt-snd" title="Bật/tắt âm thanh">🔊</button><button id="gt-fs" title="Toàn màn hình">⛶</button><button id="gt-x" title="Đóng (Esc)">✕</button></div></div>
    <div class="gt-hint" id="gt-hint"></div>
    <div class="gt-result" id="gt-result"></div>`;
  document.body.appendChild(OV);
  OV.querySelector('#gt-x').addEventListener('click', closeGame);
  OV.querySelector('#gt-fs').addEventListener('click', toggleFS);
  OV.querySelector('#gt-snd').addEventListener('click', ()=>{ cfg.sound=!cfg.sound; save(); syncSndBtn(); if(cfg.sound){ ac(); playSfx('hit'); } });
  OV.querySelector('#gt-result').addEventListener('click', onResultClick);
  document.addEventListener('keydown', e=>{ if(OV && OV.style.display!=='none' && e.key==='Escape'){ closeGame(); } });
  window.addEventListener('resize', ()=>{ if(G) resize(G); });
  document.addEventListener('fullscreenchange', ()=>{ if(G) setTimeout(()=>resize(G),60); });
  document.addEventListener('webkitfullscreenchange', ()=>{ if(G) setTimeout(()=>resize(G),60); });
}
function syncSndBtn(){ if(OV) OV.querySelector('#gt-snd').textContent = cfg.sound ? '🔊' : '🔇'; }
function toggleFS(){
  const d=document, el=OV;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
  const r = el.requestFullscreen||el.webkitRequestFullscreen;
  if(r){ try{ const p=r.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
  else showToast('Thiết bị này không hỗ trợ toàn màn hình (iPhone) — bạn xoay ngang điện thoại để xem rộng hơn.', 3500);
}
function start(){
  ac(); // mở khoá âm thanh ngay trong thao tác bấm (bắt buộc với iPhone/iPad)
  const R = prepareRound(); if(!R) return;
  launch(R);
}
function launch(R){
  ensureOverlay();
  OV.style.display='flex'; OV.classList.toggle('gt-dark', !!cfg.dark);
  document.body.classList.add('gt-noscroll');
  syncSndBtn();
  OV.querySelector('#gt-result').innerHTML=''; OV.querySelector('#gt-result').className='gt-result';
  resultShown=false;
  const def = GAME_BY_ID[cfg.game];
  OV.querySelector('#gt-title').textContent = def.emoji+' '+def.name;
  OV.querySelector('#gt-hint').textContent = 'Ai sẽ được gọi nhỉ? 👀'; OV.querySelector('#gt-hint').style.color = (cfg.game==='firefly'||cfg.dark) ? '#E8EEF2' : '';
  if(G && G.raf) cancelAnimationFrame(G.raf);
  G = newGame(R);
  G.t0 = performance.now()+350;
  G.raf = requestAnimationFrame(loop);
}
function closeGame(){
  if(G && G.raf) cancelAnimationFrame(G.raf);
  G = null;
  if(OV) OV.style.display='none';
  document.body.classList.remove('gt-noscroll');
  const d=document; if(d.fullscreenElement||d.webkitFullscreenElement){ try{ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }catch(e){} }
  if(state.tab==='callname') rerender();
}

function newGame(R){
  const cv = OV.querySelector('#gt-cv');
  const def = GAME_BY_ID[cfg.game];
  const players = R.chars.map((p,i)=>({name:p.name, key:p.key, sid:p.sid, col:i%PAL.length, p}));
  const sh = shortNames(players.map(p=>p.name)); players.forEach((p,i)=>{ p.short = sh[i]; });
  const g = {cv, ctx:cv.getContext('2d'), game:cfg.game, kind:def.kind, D:cfg.duration, players, N:players.length,
    winner:R.winner, fake:R.fake, rng:mulberry(R.seed), done:false, ev:[], fs:20, dpr:1, W:0, H:0};
  const rg = g.rng;
  g.order = cfg.opts.shuffle ? shuffleArr(players.map((_,i)=>i), rg) : players.map((_,i)=>i);
  g.wp = players.map(()=>({f:[.5+rg()*.9,.5+rg()*.9,.5+rg()*.9,.5+rg()*.9], p:[rg()*TAU,rg()*TAU,rg()*TAU,rg()*TAU], ph:rg()*TAU}));
  g.maxChars = Math.max(2, ...players.map(p=>p.short.length));
  if(def.kind==='chase') buildChase(g); else if(def.kind==='elim') buildElim(g); else buildProg(g);
  g.ev.sort((a,b)=>a.t-b.t);
  for(let t=0.8; t<g.D-2.2; t+=0.9) g.ev.push({t, k:'tick'});
  g.ev.sort((a,b)=>a.t-b.t);
  resize(g);
  return g;
}
function resize(g){
  const cv=g.cv, w=OV.clientWidth||window.innerWidth, h=OV.clientHeight||window.innerHeight, dpr=Math.min(window.devicePixelRatio||1,2);
  g.W=w; g.H=h; g.dpr=dpr; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.width=w+'px'; cv.style.height=h+'px';
  GFX[g.game].init(g);
}

/* ---------- Kịch bản thời gian ---------- */
function buildChase(g){
  const D=g.D, R=g.rng, flip=g.fake>=0, A=[];
  const FINAL0 = D-2.5;
  let missEnd = FINAL0-0.15, fakeAtt=null;
  if(flip){
    const f0 = D-6.1;
    fakeAtt = {idx:g.fake, hit:true, fake:true, t0:f0, ts:f0+1.2, tr:f0+1.2+0.35+1.7, t1:f0+1.2+0.35+1.7+0.55};
    missEnd = f0-0.1;
  }
  const avail = missEnd-0.5;
  const m = Math.max(1, Math.min(4, Math.floor(avail/2.0)));
  const others = []; for(let i=0;i<g.N;i++) if(i!==g.winner && i!==g.fake) others.push(i);
  const pickPool = shuffleArr(others.length?others:[g.winner===0?1:0], R);
  const slot = avail/m;
  for(let k=0;k<m;k++){
    const t0 = 0.5 + k*slot + 0.05, ts = t0 + Math.min(1.2, slot*0.55), t1 = ts + 0.35 + Math.min(0.8, slot*0.32);
    const ang = R()*TAU;
    A.push({idx:pickPool[k%pickPool.length], hit:false, fake:false, t0, ts, t1, dv:{x:Math.cos(ang), y:Math.sin(ang)}});
  }
  if(fakeAtt) A.push(fakeAtt);
  A.push({idx:g.winner, hit:true, fake:false, t0:FINAL0, ts:D-1.15, tr:Infinity, t1:Infinity});
  A.forEach((a,k)=>{ a.k=k; });
  g.att = A;
  A.forEach(a=>{
    g.ev.push({t:a.ts, k:'strike'});
    if(a.hit){ g.ev.push({t:a.ts+0.2, k:'hit'}); }
    else g.ev.push({t:a.ts+0.4, k:'miss'});
  });
  if(fakeAtt){ g.stamp = {a:fakeAtt.ts+0.5, b:fakeAtt.tr}; g.ev.push({t:g.stamp.a, k:'stamp'}); }
  g.ev.push({t:D, k:'win'});
}
function buildElim(g){
  const N=g.N, D=g.D, R=g.rng, w=g.winner, f=g.fake, flip=f>=0;
  g.te = new Array(N).fill(Infinity); g.rev = null; g.dips = []; for(let i=0;i<N;i++) g.dips.push([]);
  const others=[]; for(let i=0;i<N;i++) if(i!==w && i!==f) others.push(i);
  const order = shuffleArr(others, R), t_start = 0.9;
  let tEnd;
  if(flip){
    const tw = D-5.9; g.rev = tw+2.2; g.te[w] = tw; g.te[f] = g.rev+0.9; tEnd = tw-0.5;
    g.stamp = {a:tw+0.5, b:g.rev}; g.flare0 = g.te[f];
    g.ev.push({t:tw,k:'pop'},{t:tw+0.5,k:'stamp'},{t:g.rev,k:'revive'},{t:g.te[f],k:'pop'});
  } else { tEnd = D-2.3; g.flare0 = tEnd; }
  const n = order.length;
  order.forEach((i,k)=>{
    const fr=(k+1)/n; g.te[i] = t_start + (tEnd-t_start)*Math.pow(fr,1.45);
    g.ev.push({t:g.te[i], k:'pop'});
  });
  // những lần "suýt nổ"
  const wl = flip ? g.te[w]-0.8 : D-2.6;
  [0.38,0.66].forEach(fr=>{ const t=D*fr; if(t<wl-0.5 && t>1.5) g.dips[w].push(t); });
  shuffleArr(order.filter(i=>g.te[i]>4), R).slice(0,3).forEach(i=>{ g.dips[i].push(g.te[i]-1.7); });
  g.ev.push({t:D,k:'win'});
}
function buildProg(g){
  const N=g.N, D=g.D, R=g.rng, w=g.winner, f=g.fake;
  g.pp = [];
  for(let i=0;i<N;i++){
    const gusts=[], ng = 1+Math.floor(R()*2);
    for(let k=0;k<ng;k++) gusts.push({t:1.2+R()*(D-5.2), a:0.12+R()*0.18});
    g.pp.push({cap:0.46+R()*0.34, ph:R()*TAU, fq:0.5+R()*0.8, gusts});
  }
  g.pp[w].cap = 0.5+R()*0.2; g.pp[w].gusts = [];
  if(f>=0){ g.tF = D-5.4; g.stamp = {a:g.tF+0.5, b:g.tF+1.8}; g.ev.push({t:g.tF-0.2,k:'hit'},{t:g.stamp.a,k:'stamp'}); }
  g.ev.push({t:D-3.0,k:'strike'});
  g.ev.push({t:D,k:'win'});
}
/* progress 0..1 của người chơi i tại thời điểm t (đua rùa, thả diều) */
function prog(g,i,t){
  const D=g.D, p=g.pp[i], b = p.cap*(0.55*ease(Math.min(1,t/(D*0.45)))+0.45*clamp(t/(D-1),0,1));
  let v = b + 0.06*Math.sin(p.ph+t*p.fq*2.2);
  p.gusts.forEach(s=>{ const x=(t-s.t)/0.9; v += s.a*Math.exp(-x*x); });
  v = clamp(v, 0, 0.86);
  if(i===g.winner){
    const c = ease((t-(D-3.2))/2.3); v = v*(1-c)+1.0*c;
  } else if(i===g.fake){
    const tF=g.tF, up = ease((t-(tF-2.2))/2.2);
    if(t<tF+1.8) v = v*(1-up)+1.0*up;
    else { const d = ease((t-(tF+1.8))/0.9); v = 1.0*(1-d)+v*d; }
  }
  return v;
}

/* ---------- Vòng lặp vẽ ---------- */
function loop(now){
  if(!G) return; const g=G; g.raf = requestAnimationFrame(loop);
  const t = Math.max(0,(now-g.t0)/1000);
  while(g.ev.length && g.ev[0].t<=t){ const e=g.ev.shift(); if(t-e.t<0.6) playSfx(e.k); }
  const c=g.ctx; c.setTransform(g.dpr,0,0,g.dpr,0,0); c.clearRect(0,0,g.W,g.H);
  const def = GFX[g.game];
  def.bg(g,t);
  if(cfg.dark && g.game!=='firefly'){ c.fillStyle='rgba(8,14,34,.46)'; c.fillRect(0,0,g.W,g.H); }
  def.fg(g,t);
  drawStamp(g,t);
  if(!g.done && t>=g.D){ g.done=true; finish(); }
  if(g.done) drawConfetti(g, t-g.D);
  const pg = OV.querySelector('#gt-pg'); if(pg) pg.style.width = Math.min(100,t/g.D*100)+'%';
}
function drawStamp(g,t){
  if(!g.stamp || t<g.stamp.a || t>g.stamp.b) return;
  const c=g.ctx, u=(t-g.stamp.a)/0.28, sc = 1+ (1-easeOut(u))*1.6, al = Math.min(1, u*2) * (t>g.stamp.b-0.25 ? (g.stamp.b-t)/0.25 : 1);
  c.save(); c.globalAlpha=Math.max(0,al); c.translate(g.W/2, g.H*0.46); c.rotate(-0.2); c.scale(sc,sc);
  const fs = Math.min(g.W*0.1, g.H*0.17);
  c.font='900 '+fs+'px "Baloo 2","Be Vietnam Pro",sans-serif'; c.textAlign='center'; c.textBaseline='middle';
  const w=c.measureText('NHẦM RỒI!').width+fs*0.9, h=fs*1.5;
  rrect(c,-w/2,-h/2,w,h,fs*0.25); c.fillStyle='rgba(255,255,255,.88)'; c.fill();
  c.lineWidth=fs*0.1; c.strokeStyle='#DC2626'; c.stroke();
  rrect(c,-w/2+fs*0.14,-h/2+fs*0.14,w-fs*0.28,h-fs*0.28,fs*0.16); c.lineWidth=fs*0.03; c.stroke();
  c.fillStyle='#DC2626'; c.fillText('NHẦM RỒI!',0,fs*0.05);
  c.restore();
}
function drawConfetti(g,tt){
  const c=g.ctx, n=110, W=g.W, H=g.H;
  for(let k=0;k<n;k++){
    const r1=Math.abs(Math.sin(k*91.7)), r2=Math.abs(Math.sin(k*47.3+1)), r3=Math.abs(Math.sin(k*13.9+2));
    const x0=r1*W, vy=110+r2*220, y=((-r3*H*0.8 + vy*tt) % (H+80)) - 30, x=x0+Math.sin(tt*2+k)*24;
    c.save(); c.translate(x,y); c.rotate(tt*(2+r3*4)+k); c.fillStyle=PAL[k%PAL.length]; c.fillRect(-5,-3,10,6); c.restore();
  }
  // vòng lấp lánh bung ra khi vừa công bố
  if(tt<1.2){
    const cx=W/2, cy=H*0.42;
    for(let k=0;k<26;k++){ const a=k/26*TAU, r=easeOut(tt/1.1)*Math.min(W,H)*0.55; circ(c,cx+Math.cos(a)*r,cy+Math.sin(a)*r,6*(1-tt/1.2)+1,PAL[k%PAL.length]); }
  }
}

/* ---------- Công bố kết quả ---------- */
function finish(){
  const g=G; if(!g) return;
  const pl = g.players[g.winner];
  // ghi nhận lượt gọi
  let entry = null;
  if(S.mode==='class' && pl.sid){
    const sess = sessionFor(S.classId, S.date, true);
    if(!sess.callLog) sess.callLog=[];
    entry = {id:uid(), sid:pl.sid, name:pl.name, t:Date.now(), game:g.game, res:null, flip:g.fake>=0, round:sess.callRound||0};
    sess.callLog.push(entry); saveSessions(S.classId);
  } else {
    S.tmpCalled[pl.key]=true; S.tmpLog.push(pl.name);
  }
  g.entry = entry;
  const hint = OV.querySelector('#gt-hint'); hint.textContent='';
  let extra = '';
  if(g.game==='envelope'){
    const ch = getChallenges(); g.challenge = ch[Math.floor(Math.random()*ch.length)];
    extra = `<div class="gt-b-chal">🧧 Thử thách: <b>${esc(g.challenge)}</b></div>`;
  }

/* ============================================================
   CÁC TRÒ CHƠI — mọi hình vẽ bằng canvas
============================================================ */
const GFX = {};

/* ---------- Bố cục & nhãn tên ---------- */
function gridLayout(g,x0,y0,x1,y1){
  const N=g.N, w=x1-x0, h=y1-y0; let best=null;
  for(let cols=1; cols<=N; cols++){
    const rows=Math.ceil(N/cols), cw=w/cols, ch=h/rows, score=Math.min(cw, ch*1.3);
    if(!best || score>best.score) best={cols,rows,cw,ch,score};
  }
  const pos=[];
  for(let i=0;i<N;i++){
    const slot=g.order[i], r=Math.floor(slot/best.cols), c=slot%best.cols;
    const inRow = r<best.rows-1 ? best.cols : N-(best.rows-1)*best.cols;
    pos.push({x:x0+(c+0.5)*best.cw+(best.cols-inRow)*best.cw/2, y:y0+(r+0.5)*best.ch});
  }
  return {pos, cw:best.cw, ch:best.ch, cols:best.cols, rows:best.rows};
}
function wob(g,i,t){ const p=g.wp[i]; return {x:.6*Math.sin(p.f[0]*t+p.p[0])+.4*Math.sin(p.f[1]*t+p.p[1]), y:.6*Math.sin(p.f[2]*t+p.p[2])+.4*Math.sin(p.f[3]*t+p.p[3])}; }
function fontFor(g,cw,ch){ return clamp(Math.min(cw*0.96/(g.maxChars*0.56+1.3), ch*0.32), 12, 38); }
function tag(g,x,y,i,o){
  o=o||{}; const c=g.ctx, fs=o.fs||g.fs, txt=g.players[i].short;
  c.save(); if(o.alpha!==undefined) c.globalAlpha=o.alpha;
  c.font='800 '+fs+'px "Baloo 2","Be Vietnam Pro",sans-serif'; c.textAlign='center'; c.textBaseline='middle';
  const w=c.measureText(txt).width+fs*0.8, h=fs*1.35;
  rrect(c,x-w/2,y-h/2,w,h,h/2); c.fillStyle=o.bg||'rgba(255,255,255,.95)'; c.fill();
  c.lineWidth=Math.max(2,fs*0.12); c.strokeStyle=o.border||PAL[g.players[i].col]; c.stroke();
  c.fillStyle=o.fg||'#1F2933'; c.fillText(txt,x,y+fs*0.04); c.restore();
}

/* ---------- Khung "đuổi bắt" dùng chung ---------- */
function attState(g,t){
  const A=g.att; let k=-1;
  for(let j=0;j<A.length;j++){ if(t>=A[j].t0) k=j; else break; }
  if(k<0) return {k:-1,a:null,ph:'idle',u:0};
  const a=A[k];
  if(t<a.ts) return {k,a,ph:'approach',u:(t-a.t0)/(a.ts-a.t0)};
  const su=(t-a.ts)/0.35; if(su<1) return {k,a,ph:'strike',u:su};
  if(a.hit){
    if(a.fake && t>=a.tr) return {k,a,ph:'release',u:clamp((t-a.tr)/0.55,0,1)};
    return {k,a,ph:'hold',u:t-a.ts-0.35};
  }
  if(t<a.t1) return {k,a,ph:'recover',u:(t-a.ts-0.35)/(a.t1-a.ts-0.35)};
  return {k,a,ph:'idle',u:1};
}
function chaseInit(g,home,tpos,o){
  o=o||{};
  g.home=home; g.tpos=tpos; g.strikeOff=o.strikeOff||{x:0,y:0}; g.missD=o.missD||40; g.liftMax=o.liftMax||0;
  g.holdOff=o.holdOff||(()=>({x:0,y:0})); g.dodgeD=o.dodgeD||40; g.E=[];
  g.att.forEach((a,k)=>{
    const tp=tpos(a.idx,a.ts), so=g.strikeOff, prev=k?g.E[k-1]:home;
    if(a.hit) g.E[k]={x:tp.x+so.x, y:tp.y+so.y};
    else {
      let dx=tp.x-prev.x, dy=tp.y-prev.y; const L=Math.hypot(dx,dy)||1;
      g.E[k]={x:tp.x+so.x+dx/L*g.missD, y:tp.y+so.y+dy/L*g.missD*0.35};
    }
  });
}
function chase(g,t){
  const s=attState(g,t);
  if(s.k<0){ s.x=g.home.x; s.y=g.home.y; s.face=1; return s; }
  const a=s.a, prev=s.k?g.E[s.k-1]:g.home, E=g.E[s.k];
  if(s.ph==='approach'){ const tp=g.tpos(a.idx,t), e=ease(s.u); s.x=lerp(prev.x,tp.x,e); s.y=lerp(prev.y,tp.y,e); }
  else if(s.ph==='strike'){ const tp=g.tpos(a.idx,a.ts), e=easeOut(s.u); s.x=lerp(tp.x,E.x,e); s.y=lerp(tp.y,E.y,e); }
  else if(s.ph==='hold'){ s.x=E.x; s.y=E.y-g.liftMax*easeOut(s.u/0.9); }
  else if(s.ph==='release'){ s.x=E.x; s.y=E.y-g.liftMax*(1-ease(s.u)); }
  else { s.x=E.x; s.y=E.y; }
  s.face = (E.x-prev.x)<-1 ? -1 : 1;
  return s;
}
/* vị trí hiển thị của người chơi i: tự do / né / bị giữ / trả lại */
function tgt(g,i,t,c,nat){
  const p=nat(i,t), A=g.att;
  for(let j=0;j<A.length;j++){
    const a=A[j]; if(a.idx!==i) continue;
    if(a.hit){
      if(t>=a.ts+0.2 && (!a.fake || t<a.tr)){ const h=g.holdOff(c); return {x:c.x+h.x,y:c.y+h.y,st:'held',a,hu:Math.max(0,t-a.ts-0.35)}; }
      if(a.fake && t>=a.tr && t<a.tr+0.55){
        const u=ease((t-a.tr)/0.55), E=g.E[a.k], h=g.holdOff({x:E.x,y:E.y-g.liftMax,face:c.face});
        const fx=g.backFrom?g.backFrom(a):{x:E.x+h.x,y:E.y-g.liftMax+h.y};
        return {x:lerp(fx.x,p.x,u),y:lerp(fx.y,p.y,u),st:'back',a,u};
      }
    } else if(t>=a.ts && t<=a.t1){
      const u=(t-a.ts)/(a.t1-a.ts), m=u<0.25?easeOut(u/0.25):1-ease((u-0.25)/0.75);
      return {x:p.x+a.dv.x*g.dodgeD*m, y:p.y+a.dv.y*g.dodgeD*m*0.6, st:'dodge',a,m};
    }
  }
  return {x:p.x,y:p.y,st:'free'};
}
function drawWorld(g,t,nat,drawOne,after){ // vẽ mọi người chơi theo thứ tự y
  const c=chase(g,t); g.c=c;
  const list=[];
  for(let i=0;i<g.N;i++){ const q=tgt(g,i,t,c,nat); q.i=i; list.push(q); }
  list.sort((a,b)=>a.y-b.y);
  list.forEach(q=>{ if(q.st!=='held' || !g.skipHeld) drawOne(q,c); });
  return c;
}

/* ---------- Thành phần nền dùng lại ---------- */
function vgrad(c,x0,y0,x1,y1,stops){ const gr=c.createLinearGradient(x0,y0,x1,y1); stops.forEach(s=>gr.addColorStop(s[0],s[1])); return gr; }
function cloud(c,x,y,s){ c.fillStyle='rgba(255,255,255,.9)'; circ(c,x,y,s*.5,'rgba(255,255,255,.9)'); circ(c,x+s*.5,y+s*.1,s*.4,'rgba(255,255,255,.9)'); circ(c,x-s*.5,y+s*.12,s*.36,'rgba(255,255,255,.9)'); circ(c,x+s*.1,y-s*.2,s*.38,'rgba(255,255,255,.9)'); }
function sparkle(c,x,y,r,col){ c.save(); c.translate(x,y); c.fillStyle=col||'#FFF59D'; c.beginPath(); for(let k=0;k<8;k++){ const a=k*Math.PI/4, rr=k%2?r*.3:r; c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } c.closePath(); c.fill(); c.restore(); }
function bigTag(g,x,y,i,t0,t){ // nhãn lớn nổi lên cho nhân vật đang được chọn
  const u=easeOut((t-t0)/0.35); if(u<=0) return;
  tag(g,x,y,i,{fs:g.fs*(1.1+0.5*u), bg:'#FFF8E1', border:'#F59E0B'});
}
function eye(c,x,y,r,lx,ly){ circ(c,x,y,r,'#fff','#2b2b2b',Math.max(1,r*.18)); circ(c,x+lx*r*.4,y+ly*r*.4,r*.52,'#222'); circ(c,x+lx*r*.4-r*.15,y+ly*r*.4-r*.2,r*.17,'#fff'); }

/* =================================================================

================================================================= */
GFX.cat = {
  init(g){
    const W=g.W,H=g.H, L=gridLayout(g,W*0.05,H*0.30,W*0.95,H*0.93); g.L=L;
    g.fs=fontFor(g,L.cw,L.ch); g.ms=clamp(Math.min(L.cw,L.ch)*0.28,12,40); g.cs=clamp(Math.min(W,H)*0.095,44,110);
    g.nat=(i,t)=>{ const b=L.pos[i], w=wob(g,i,t); return {x:b.x+w.x*L.cw*0.26, y:b.y+w.y*L.ch*0.18}; };
    chaseInit(g,{x:W*0.1,y:H*0.2},(i,t)=>g.nat(i,t),{missD:g.cs*0.9,dodgeD:Math.max(L.cw,70)*0.8,
      holdOff:c=>({x:(c.face||1)*g.cs*0.62,y:g.cs*0.12})});
  },
  bg(g,t){
    const c=g.ctx,W=g.W,H=g.H, wy=H*0.28;
    c.fillStyle=vgrad(c,0,0,0,wy,[[0,'#FFF1D6'],[1,'#FFE0B2']]); c.fillRect(0,0,W,wy);
    c.strokeStyle='rgba(255,183,77,.35)'; c.lineWidth=Math.max(2,W*0.004);
    for(let x=W*0.02;x<W;x+=W*0.05){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,wy); c.stroke(); }
    // cửa sổ + nắng
    const wx=W*0.78, ww=Math.min(W*0.16,200), wh=wy*0.7;
    rrect(c,wx,wy*0.12,ww,wh,10); c.fillStyle='#9ADCF5'; c.fill(); c.lineWidth=6; c.strokeStyle='#fff'; c.stroke();
    c.beginPath(); c.moveTo(wx+ww/2,wy*0.12); c.lineTo(wx+ww/2,wy*0.12+wh); c.moveTo(wx,wy*0.12+wh/2); c.lineTo(wx+ww,wy*0.12+wh/2); c.stroke();
    circ(c,wx+ww*0.72,wy*0.3,ww*0.1,'#FFE082');
    // tranh
    rrect(c,W*0.42,wy*0.15,W*0.1,wy*0.5,6); c.fillStyle='#fff'; c.fill(); c.lineWidth=5; c.strokeStyle='#A1887F'; c.stroke();
    circ(c,W*0.47,wy*0.4,wy*0.1,'#81C784');
    // sàn gỗ
    c.fillStyle='#D9A86C'; c.fillRect(0,wy,W,H-wy);
    c.fillStyle='#8D6E63'; c.fillRect(0,wy-6,W,10);
    c.strokeStyle='rgba(141,110,99,.35)'; c.lineWidth=2;
    for(let y=wy+H*0.07;y<H;y+=H*0.07){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
    let row=0; for(let y=wy;y<H;y+=H*0.07){ for(let x=(row%2)*W*0.09;x<W;x+=W*0.18){ c.beginPath(); c.moveTo(x,y); c.lineTo(x,y+H*0.07); c.stroke(); } row++; }
    ell(c,W*0.5,H*0.64,W*0.36,H*0.24,'rgba(239,154,154,.55)'); ell(c,W*0.5,H*0.64,W*0.3,H*0.19,null,'rgba(255,255,255,.55)',4);
  },
  fg(g,t){
    const c=g.ctx; g.skipHeld=true;
    const cat=drawWorld(g,t,g.nat,(q)=>{
      const i=q.i, ms=g.ms, a=g.nat(i,t), a2=g.nat(i,t+0.08);
      let face = (a2.x-a.x)<0?-1:1;
      const fear = q.st==='dodge';
      drawMouse(g,q.x,q.y,ms,face,PAL[g.players[i].col],t,i,fear);
      tag(g,q.x,q.y+ms*1.45,i);
    });
    drawCatSprite(g,cat,t);
    // chuột bị bắt
    for(let i=0;i<g.N;i++){
      const q=tgt(g,i,t,cat,g.nat);
      if(q.st==='held'){
        const wig=Math.sin(t*22)*3;
        drawMouse(g,q.x+wig,q.y,g.ms*1.25,-cat.face,PAL[g.players[i].col],t,i,true);
        bigTag(g,q.x,q.y-g.ms*2.8,i,q.a.ts+0.2,t);

};
function drawMouse(g,x,y,s,face,col,t,i,scared){
  const c=g.ctx; c.save(); c.translate(x,y); c.scale(face,1);
  const sw=Math.sin(t*9+i)*s*0.2;
  c.strokeStyle='#E8A9B5'; c.lineWidth=Math.max(2,s*0.12); c.lineCap='round';
  c.beginPath(); c.moveTo(-s*0.9,s*0.1); c.quadraticCurveTo(-s*1.7,s*0.3+sw,-s*1.9,-s*0.3+sw); c.stroke();
  ell(c,0,0,s*1.0,s*0.72,'#C9CBD6','#9EA1B3',1.5);
  ell(c,0,s*0.2,s*0.6,s*0.4,'#EEF0F6');
  // khăn màu để phân biệt
  c.fillStyle=col; rrect(c,s*0.45,-s*0.5,s*0.28,s*0.95,s*0.1); c.fill();
  circ(c,s*0.95,-s*0.1,s*0.5,'#C9CBD6','#9EA1B3',1.5);
  circ(c,s*0.72,-s*0.62,s*0.34,'#F7B6C2','#9EA1B3',1.5); circ(c,s*1.12,-s*0.58,s*0.28,'#F7B6C2','#9EA1B3',1.5);
  eye(c,s*1.08,-s*0.18,s*(scared?0.2:0.15),1,0.3);
  circ(c,s*1.42,-s*0.02,s*0.1,'#F06292');
  c.restore();
}
function drawCatSprite(g,cat,t){
  const c=g.ctx, s=g.cs, face=cat.face||1;
  let pose='idle';
  if(cat.ph==='approach') pose = cat.u>0.55?'crouch':'walk';
  else if(cat.ph==='strike') pose='leap';
  else if(cat.ph==='recover') pose='dizzy';
  const bob = pose==='walk'?Math.sin(t*14)*s*0.04:0;
  c.save(); c.translate(cat.x, cat.y+bob - (pose==='leap'?Math.sin(cat.u*Math.PI)*s*0.5:0)); c.scale(face,1);
  const cr = pose==='crouch'?1:0, lp = pose==='leap'?1:0;
  const sway = Math.sin(t*5)*s*0.22;
  c.strokeStyle='#F2994A'; c.lineWidth=s*0.18; c.lineCap='round';
  c.beginPath(); c.moveTo(-s*0.65,s*0.1); c.quadraticCurveTo(-s*1.3,-s*0.1+sway,-s*1.15,-s*0.8+sway); c.stroke();
  c.strokeStyle='#D9731F'; c.lineWidth=s*0.18; c.beginPath(); c.moveTo(-s*1.2,-s*0.55+sway); c.lineTo(-s*1.14,-s*0.82+sway); c.stroke();
  ell(c,0,s*(0.2+cr*0.1),s*(0.78+cr*0.12+lp*0.22),s*(0.5-cr*0.1-lp*0.08),'#F2994A');
  ell(c,0,s*(0.32+cr*0.1),s*0.5,s*0.3,'#FFE0B2');
  c.strokeStyle='#D9731F'; c.lineWidth=s*0.07;
  for(let k=-1;k<=1;k++){ c.beginPath(); c.moveTo(k*s*0.3,-s*0.18+cr*s*0.1); c.lineTo(k*s*0.3+s*0.05,s*0.05+cr*s*0.1); c.stroke(); }
  // chân
  const lg = pose==='walk'?Math.sin(t*14)*s*0.12:0;
  ell(c,s*0.45+lg,s*0.62,s*0.2,s*0.14,'#FFE0B2','#D9731F',2); ell(c,-s*0.4-lg,s*0.62,s*0.2,s*0.14,'#FFE0B2','#D9731F',2);
  if(lp){ ell(c,s*1.05,s*0.1,s*0.28,s*0.12,'#FFE0B2','#D9731F',2); }
  // đầu
  const hx=s*0.72+lp*s*0.15, hy=-s*(0.12-cr*0.12);
  circ(c,hx,hy,s*0.5,'#F2994A','#D9731F',2);
  poly(c,[[hx-s*0.42,hy-s*0.2],[hx-s*0.34,hy-s*0.78],[hx-s*0.02,hy-s*0.42]],'#F2994A','#D9731F',2);
  poly(c,[[hx+s*0.42,hy-s*0.2],[hx+s*0.34,hy-s*0.78],[hx+s*0.02,hy-s*0.42]],'#F2994A','#D9731F',2);
  poly(c,[[hx-s*0.34,hy-s*0.3],[hx-s*0.3,hy-s*0.6],[hx-s*0.1,hy-s*0.4]],'#F7B6C2');
  poly(c,[[hx+s*0.34,hy-s*0.3],[hx+s*0.3,hy-s*0.6],[hx+s*0.1,hy-s*0.4]],'#F7B6C2');
  if(pose==='dizzy'){
    c.strokeStyle='#222'; c.lineWidth=s*0.05;
    [[-0.2],[0.22]].forEach(([dx])=>{ c.beginPath(); c.moveTo(hx+dx*s-s*0.07,hy-s*0.12); c.lineTo(hx+dx*s+s*0.07,hy); c.moveTo(hx+dx*s+s*0.07,hy-s*0.12); c.lineTo(hx+dx*s-s*0.07,hy); c.stroke(); });

  }
  poly(c,[[hx-s*0.07,hy+s*0.1],[hx+s*0.07,hy+s*0.1],[hx,hy+s*0.18]],'#F06292');
  c.strokeStyle='#8D5524'; c.lineWidth=s*0.025;
  [-1,1].forEach(d=>{ c.beginPath(); c.moveTo(hx+d*s*0.18,hy+s*0.15); c.lineTo(hx+d*s*0.62,hy+s*0.08); c.moveTo(hx+d*s*0.18,hy+s*0.2); c.lineTo(hx+d*s*0.6,hy+s*0.26); c.stroke(); });
  c.restore();
  if(pose==='dizzy'){ for(let k=0;k<3;k++){ const a=t*5+k*TAU/3; sparkle(c_(g),cat.x+face*s*0.7+Math.cos(a)*s*0.45, cat.y-s*0.85+Math.sin(a)*s*0.14, s*0.14,'#FFD54F'); } }
}
function c_(g){ return g.ctx; }

GFX.turtle = {
  init(g){
    const W=g.W,H=g.H, top=H*0.12, bot=H*0.96, minLane = H<600?34:44;
    const per = Math.max(1,Math.floor((bot-top)/minLane));
    const cols = clamp(Math.ceil(g.N/per),1,4), rows = Math.ceil(g.N/cols);
    g.TL={cols,rows,laneH:(bot-top)/rows,top,colW:W/cols};
    g.ts=clamp(g.TL.laneH*0.5,11,34);
    g.fs=clamp(Math.min(g.TL.laneH*0.5, g.TL.colW*0.22/(g.maxChars*0.0+1)*0.5),11,28);
    g.fs=clamp(Math.min(g.TL.laneH*0.52, g.TL.colW*0.8/(g.maxChars*0.56+1.3)*0.6),11,26);
  },
  bg(g,t){
    const c=g.ctx,W=g.W,H=g.H, T=g.TL;
    c.fillStyle=vgrad(c,0,0,0,H*0.12,[[0,'#8FD3F4'],[1,'#CFEFFF']]); c.fillRect(0,0,W,H*0.12);
    cloud(c,W*0.2,H*0.05,H*0.05); cloud(c,W*0.65,H*0.04,H*0.04);
    c.fillStyle='#F6D58E'; c.fillRect(0,H*0.12,W,H*0.88);
    for(let k=0;k<T.cols;k++){

function elimState(g,i,t){
  let alive = t<g.te[i], since=-1, revU=-1;
  if(i===g.winner && g.rev!==null){
    if(t>=g.te[i] && t<g.rev){ alive=false; }
    else if(t>=g.rev){ alive=true; revU=clamp((t-g.rev)/0.8,0,1); }
  }
  if(!alive){ since = (i===g.winner && g.rev!==null) ? t-g.te[i] : t-g.te[i]; }
  let dip=0; g.dips[i].forEach(d=>{ const u=(t-d)/1.1; if(u>0&&u<1) dip=Math.max(dip,Math.sin(u*Math.PI)); });
  const flare = (alive && t>g.flare0 && i===(g.fake>=0?g.winner:g.winner)) ? clamp((t-g.flare0)/1.2,0,1) : 0;
  return {alive,since,revU,dip,flare};
}
GFX.bubble = {
  init(g){

    for(let k=0;k<9;k++){ const r=H*(0.05+(k%3)*0.03), x=((k*0.211+0.07)%1)*W, y=H-((t*(18+k*4)+k*140)%(H+r*2)); circ(c,x,y,r,null,'rgba(255,255,255,.55)',2); }
  },
  fg(g,t){
    const c=g.ctx, br=g.br, items=[];

      const st=elimState(g,i,t), p=g.nat(i,t), col=PAL[g.players[i].col];
      if(!st.alive){
        if(st.since>=0 && st.since<0.6){ const u=st.since/0.6; // mảnh nổ tan
          for(let k=0;k<9;k++){ const a=k/9*TAU+i, r=br*(1+u*0.9); circ(c,p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,br*0.1*(1-u),col); }
          c.strokeStyle='rgba(255,255,255,'+(0.8*(1-u))+')'; c.lineWidth=3; c.beginPath(); c.arc(p.x,p.y,br*(1+u*0.5),0,TAU); c.stroke(); }

      const rx=br*sc*(1+0.1*Math.sin(t*3+i)-sq*0.12), ry=br*sc*(1+0.1*Math.cos(t*3+i)+sq*0.1);

GFX.frog = {
  init(g){
    const W=g.W,H=g.H, L=gridLayout(g,W*0.06,H*0.08,W*0.94,H*0.62); g.L=L;
    g.fs=fontFor(g,L.cw,L.ch); g.fl=clamp(Math.min(L.cw,L.ch)*0.16,8,22); g.fr=clamp(Math.min(W,H)*0.11,44,110);

    c.fillStyle=vgrad(c,0,H*0.7,0,H,[[0,'#5CC6D6'],[1,'#26869A']]); c.fillRect(0,H*0.7,W,H*0.3);

    for(let k=0;k<3;k++){ ell(c,W*(0.15+k*0.35),H*0.93,W*0.06,H*0.02,'#7CB342'); circ(c,W*(0.15+k*0.35)+10,H*0.925,H*0.012,'#F8BBD0'); }
    // bãi cỏ + sậy
    c.fillStyle='#8BC34A'; c.fillRect(0,H*0.69,W,H*0.015);

    if(s.k>=0){

GFX.claw = {
  init(g){
    const W=g.W,H=g.H, L=gridLayout(g,W*0.11,H*0.37,W*0.89,H*0.78); g.L=L;
    g.fs=fontFor(g,L.cw,L.ch); g.pl=clamp(Math.min(L.cw*0.42,L.ch*0.5),13,56);
    g.nat=(i,t)=>{ const b=L.pos[i]; return {x:b.x+Math.sin(t*1.1+g.wp[i].ph)*L.cw*0.04, y:b.y+Math.sin(t*1.4+g.wp[i].ph)*1.5}; };
    chaseInit(g,{x:W*0.5,y:H*0.28},(i,t)=>{ const p=g.nat(i,t); return {x:p.x,y:H*0.28}; },
      {strikeOff:{x:0,y:0},missD:0,dodgeD:g.pl*0.9,liftMax:H*0.14,holdOff:()=>({x:0,y:g.pl*1.0})});

    g.att.forEach((a,k)=>{ const p=g.nat(a.idx,a.ts); g.E[k].y = p.y-g.pl*0.9; });
    g.backFrom=a=>({x:g.E[a.k].x,y:g.E[a.k].y-g.liftMax+g.pl});
  },
  bg(g,t){
    const c=g.ctx,W=g.W,H=g.H;
    c.fillStyle=vgrad(c,0,0,0,H,[[0,'#FDE1F0'],[1,'#E7D6FF']]); c.fillRect(0,0,W,H);
    // thân máy
    rrect(c,W*0.04,H*0.03,W*0.92,H*0.94,28); c.fillStyle='#FF6FA8'; c.fill(); c.lineWidth=6; c.strokeStyle='#C2185B'; c.stroke();
    rrect(c,W*0.12,H*0.045,W*0.76,H*0.085,16); c.fillStyle='#FFEB3B'; c.fill(); c.lineWidth=4; c.strokeStyle='#F57F17'; c.stroke();
    c.font='900 '+Math.min(H*0.06,W*0.05)+'px "Baloo 2",sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillStyle='#C2185B'; c.fillText('GẮP THÚ BÔNG',W/2,H*0.089);
    for(let k=0;k<14;k++){ circ(c,W*0.14+k*W*0.0575,H*0.145,5,(Math.floor(t*4)+k)%2?'#FFF176':'#FF8A65'); }
    // kính
    const gx=W*0.09,gy=H*0.17,gw=W*0.82,gh=H*0.62;
    rrect(c,gx,gy,gw,gh,14); c.fillStyle=vgrad(c,0,gy,0,gy+gh,[[0,'#F3FBFF'],[1,'#CDEBFA']]); c.fill(); c.lineWidth=5; c.strokeStyle='#fff'; c.stroke();
    c.strokeStyle='#9E9E9E'; c.lineWidth=8; c.beginPath(); c.moveTo(gx+8,H*0.215); c.lineTo(gx+gw-8,H*0.215); c.stroke();

    c.fillStyle='#F8BBD0'; c.fillRect(gx+4,H*0.79-6,gw-8,6);
    rrect(c,W*0.1,H*0.82,W*0.22,H*0.12,12); c.fillStyle='#4A148C'; c.fill(); c.lineWidth=4; c.strokeStyle='#AB47BC'; c.stroke();
    c.font='800 '+Math.min(H*0.035,W*0.025)+'px "Baloo 2",sans-serif'; c.fillStyle='#fff'; c.fillText('LẤY THÚ Ở ĐÂY',W*0.21,H*0.88);
    // nút điều khiển
    rrect(c,W*0.42,H*0.84,W*0.4,H*0.1,14); c.fillStyle='#AD1457'; c.fill();
    circ(c,W*0.5,H*0.89,H*0.03,'#42A5F5'); circ(c,W*0.58,H*0.89,H*0.03,'#EF5350');

function drawPlush(g,x,y,s,i,rot){

function drawClaw(g,x,y,s,open){

// Tạm gỡ bỏ hoàn toàn service worker/cache cũ (nếu thiết bị đã từng cài từ bản trước) —
// để đảm bảo mọi thiết bị luôn lấy đúng bản mới nhất khi cô cập nhật file, không bị
// kẹt lại bản cũ do cơ chế cache ngoại tuyến (PWA) từng thêm trước đây.
try{
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs=>{
      regs.forEach(reg=> reg.unregister());
    }).catch(()=>{});
  }
  if('caches' in window){
    caches.keys().then(keys=>{
      keys.forEach(k=> caches.delete(k));
    }).catch(()=>{});
  }
}catch(e){}
