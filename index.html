<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-alt:#F1FAF9;
    --ink:#1F2933;
    --ink-soft:#5A6873;
    --ink-faint:#9AA6AC;
    --accent:#41BFB6;
    --accent-soft:#DBF3F1;
    --accent-deep:#2C8F87;
    --danger:#DC2626;
    --danger-soft:#FBE1E1;
    --success:#41BFB6;
    --success-soft:#DBF3F1;
    --late:#D97706;
    --late-soft:#FCEACB;
    --line:#E4EFEE;
    --shadow: 0 1px 2px rgba(31,41,51,.05), 0 4px 14px rgba(31,41,51,.05);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Be Vietnam Pro',sans-serif;
    font-weight:500;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Baloo 2',sans-serif; font-weight:700; margin:0; letter-spacing:-.01em;}
  .mono{ font-family:'IBM Plex Mono',monospace; }
  #app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--surface-alt); color:var(--ink); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 14px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 8px 22px 8px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .brand-mark{ width:34px;height:34px;border-radius:8px;background:var(--accent); display:flex;align-items:center;justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:22px; color:#fff;}
  .brand-name{ font-family:'Baloo 2',sans-serif; font-size:22px; font-weight:700; line-height:1.15; color:var(--ink);}
  .brand-sub{ font-size:12.5px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase; margin-top:2px;}
  .nav-group-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#8C8C8C; padding:14px 12px 6px; }
  .global-search-wrap{ position:relative; padding:0 4px 6px; }
  .global-search-wrap input{ width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 12px; font-size:14px; font-family:'Be Vietnam Pro',sans-serif; background:#fff; }
  .global-search-results{ position:absolute; top:calc(100% - 2px); left:4px; right:4px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); z-index:80; max-height:340px; overflow-y:auto; }
  .global-search-item{ display:flex; flex-direction:column; gap:1px; padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line); font-size:14px; }
  .global-search-item:last-child{ border-bottom:none; }
  .global-search-item:hover{ background:var(--accent-soft); }
  .nav-group-label:first-of-type{ padding-top:4px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px; cursor:pointer; font-family:'Baloo 2',sans-serif;
    font-size:18.5px; font-weight:600; color:var(--ink-soft); margin-bottom:2px; transition:background .12s ease, transform .1s ease;
  }
  .nav-item:hover{ background:var(--accent-soft); }
  .nav-item:active{ transform:scale(.97); }
  .nav-item.active{ background:var(--accent); color:#fff; font-weight:600; }
  .nav-icon{ width:18px; text-align:center; font-size:17px; }
  .nav-badge{ margin-left:auto; background:var(--danger); color:#fff; font-size:12.5px; padding:2px 7px; border-radius:20px; font-weight:600;}
  .sidebar-foot{ margin-top:auto; padding:12px 8px 0 8px; border-top:1px solid var(--line); font-size:13px; color:var(--ink-faint); line-height:1.5;}


  /* ---------- Main ---------- */
  .main{ flex:1; padding:30px 38px 60px 38px; max-width:1180px; animation: pageIn .32s cubic-bezier(.22,1,.36,1); }
  @keyframes pageIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes modalPop{ from{ opacity:0; transform:scale(.94) translateY(8px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .page-title{ font-size:30.5px; }
  .page-sub{ color:var(--ink-soft); font-size:16px; margin-top:4px; }
  .chalk-underline{ display:block; width:56px; height:8px; margin-top:6px; }

  .class-select{
    font-family:'Be Vietnam Pro',sans-serif; font-size:16px; padding:8px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:500;
  }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px; transition:box-shadow .2s ease, transform .2s ease;}
  .card-title{ font-size:21px; font-weight:700; font-family:'Baloo 2',sans-serif; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .muted{ color:var(--ink-soft); font-size:15px; }
  .tiny{ font-size:13.5px; color:var(--ink-faint); }

  .btn{
    font-family:'Be Vietnam Pro',sans-serif; border:none; border-radius:9px; padding:10px 17px; font-size:15px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:transform .18s cubic-bezier(.22,1,.36,1), opacity .18s ease, background-color .18s ease;
  }
  .btn:active{ transform:scale(.94); opacity:.85; }
  .btn-primary{ background:var(--ink); color:#FFFFFF; }
  .btn-primary:hover{ opacity:.9; }
  .btn-accent{ background:var(--accent); color:#FFFFFF; }
  .btn-accent:hover{ opacity:.9; }
  .btn-outline{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn-outline:hover{ background:var(--surface-alt); }
  .btn-danger-outline{ background:transparent; color:var(--danger); border:1px solid #E8C3BE; }
  .btn-sm{ padding:7px 12px; font-size:14px; border-radius:7px; }
  input[type=text], input[type=number], input[type=date], textarea, select{
    font-family:'Be Vietnam Pro',sans-serif; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:16px;
    background:#fff; color:var(--ink); width:100%;
  }
  textarea{ resize:vertical; font-family:'Be Vietnam Pro',sans-serif; }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent-soft); border-color:var(--accent); }
  label.field-label{ font-size:14px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}

  table{ border-collapse:collapse; width:100%; font-size:16px; }
  th{ text-align:left; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:10px 12px; border-bottom:2px solid var(--line); }
  td{ padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr.ledger:nth-child(even) td{ background:var(--surface-alt); }
  tr.flagged td{ background:var(--danger-soft) !important; }

  /* Bảng tổng hợp buổi học: cột Học sinh cố định + tiêu đề dính khi cuộn */
  .session-table th, .session-table td{ white-space:nowrap; }
  .session-table thead th{ position:sticky; top:0; background:var(--surface-alt); z-index:2; border-bottom:2px solid var(--line); }
  .session-table td:first-child, .session-table th:first-child{
    position:sticky; left:0; background:var(--surface); z-index:1; border-right:1px solid var(--line);
  }
  .session-table thead th:first-child{ z-index:3; background:var(--surface-alt); }
  .session-table tr.ledger:nth-child(even) td:first-child{ background:var(--surface-alt); }
  .session-table tr.flagged td:first-child{ background:var(--danger-soft); }
  .session-table .seg button{ padding:6px 11px; font-size:15px; }

  .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent-deep); padding:5px 10px; border-radius:20px; font-size:14.5px; font-weight:600;}
  .chip button{ background:none; border:none; color:var(--accent-deep); cursor:pointer; font-weight:700; font-size:14px; line-height:1;}
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }

  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button{ border:none; background:#fff; padding:6px 12px; font-size:14.5px; cursor:pointer; color:var(--ink-soft); font-weight:600; }
  .seg button.on.present{ background:var(--success); color:#fff; }
  .seg button.on.absent{ background:var(--danger); color:#fff; }
  .seg button.on.late{ background:var(--late); color:#fff; }
  .seg button:not(:last-child){ border-right:1px solid var(--line); }

  .tick{ width:36px; height:32px; border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; font-weight:700; user-select:none; border:1px solid var(--line); background:#fff; color:var(--ink-faint); margin:0 auto;}
  .tick.full{ background:var(--success); color:#fff; border-color:var(--success); }
  .tick.partial{ background:var(--accent); color:#FFFFFF; border-color:var(--accent); }
  .tick.none{ background:#fff; color:var(--ink-faint); }

  .rating-row{ display:flex; gap:4px; }
  .rating-dot{ width:30px;height:30px;border-radius:50%;border:1px solid var(--line); display:flex;align-items:center;justify-content:center; font-size:13px; cursor:pointer; color:var(--ink-soft); background:#fff; font-weight:700;}
  .rating-dot.on{ background:var(--accent); color:#FFFFFF; border-color:var(--accent); }

  .score-input{ width:68px !important; padding:7px 6px !important; text-align:center; font-family:'IBM Plex Mono',monospace; }

  .sync-badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:12.5px; font-weight:600; }
  .sync-badge-on{ background:var(--success-soft); color:var(--success); }
  .sync-badge-off{ background:var(--surface-alt); color:var(--ink-faint); }

  /* Danh sách dạng hàng: icon tròn + tiêu đề + mô tả + trạng thái + nút bo tròn (pill) */
  .data-card{ background:#F0F5EE; border:1px solid #DDE7D9; border-radius:16px; padding:6px 20px; margin-bottom:18px; }
  .data-row{ display:flex; align-items:center; gap:16px; padding:18px 0; border-bottom:1px solid #DDE7D9; flex-wrap:wrap; }
  .data-row:last-child{ border-bottom:none; }
  .data-row-icon{ width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; }
  .data-row-icon.peach{ background:#FBE3D5; }
  .data-row-icon.blue{ background:#DCE7FB; }
  .data-row-body{ flex:1; min-width:200px; }
  .data-row-title{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:17px; color:var(--ink); }
  .data-row-desc{ font-size:13.5px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .data-row-status{ font-size:13px; font-weight:700; margin-top:7px; }
  .data-row-status.warn{ color:#C2792E; }
  .data-row-status.ok{ color:var(--success); }
  .data-row-status.off{ color:var(--ink-faint); }
  .pill-btn{ border-radius:999px; padding:11px 22px; font-weight:700; font-size:14.5px; border:none; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; transition:transform .18s cubic-bezier(.22,1,.36,1), opacity .18s ease; font-family:'Be Vietnam Pro',sans-serif; }
  .pill-btn:active{ transform:scale(.94); opacity:.85; }
  .pill-btn-solid{ background:var(--accent); color:#fff; }
  .pill-btn-outline{ background:#fff; border:1.5px solid #DDE7D9; color:var(--ink); }
  .sync-detail-panel{ background:#fff; border:1px solid #DDE7D9; border-radius:12px; padding:16px; margin:0 0 16px; }

  .warn-banner{ display:flex; gap:12px; align-items:flex-start; background:var(--danger-soft); border:1px solid #E8C3BE; border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; }
  .warn-banner .dot{ width:9px;height:9px; border-radius:50%; background:var(--danger); margin-top:5px; flex-shrink:0; }
  .warn-title{ font-weight:700; font-size:16px; }
  .warn-detail{ font-size:14.5px; color:var(--ink-soft); margin-top:2px; }

  .empty{ text-align:center; padding:50px 20px; color:var(--ink-faint); }
  .empty h3{ color:var(--ink-soft); margin-bottom:6px; font-size:17.5px; }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .stat-box{ background:var(--surface-alt); border-radius:8px; padding:12px 14px; }
  .stat-num{ font-family:'IBM Plex Mono',monospace; font-size:25.5px; font-weight:600; }
  .stat-label{ font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .tabs-sub{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs-sub button{ border:1px solid var(--line); background:#fff; padding:8px 16px; border-radius:20px; font-size:17px; font-weight:600; font-family:'Baloo 2',sans-serif; cursor:pointer; color:var(--ink-soft);}
  .tabs-sub button.on{ background:var(--accent); color:#FFFFFF; border-color:var(--accent); }

  .search-box{ position:relative; }
  .search-results{ position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); z-index:20; max-height:280px; overflow:auto; }
  .search-result-item{ padding:9px 13px; font-size:16px; cursor:pointer; border-bottom:1px solid var(--line); }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover{ background:var(--surface-alt); }
  .search-result-item b{ color:var(--accent-deep); }

  .toast{ position:fixed; bottom:22px; right:22px; max-width:360px; background:var(--accent-deep); color:#FFFFFF; padding:11px 18px; border-radius:8px; font-size:15px; line-height:1.5; box-shadow:var(--shadow); z-index:100; opacity:0; transform:translateY(10px); transition:opacity .25s cubic-bezier(.22,1,.36,1), transform .25s cubic-bezier(.22,1,.36,1); pointer-events:none;}
  .toast.show{ opacity:1; transform:translateY(0); }

  .note-text{ font-size:15px; color:var(--ink-soft); white-space:pre-wrap; }
  .legend{ display:flex; gap:16px; font-size:14px; color:var(--ink-soft); margin-top:6px;}
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:14px;height:3px;display:inline-block;border-radius:2px;}

  .modal-backdrop{ position:fixed; inset:0; background:rgba(34,51,59,.45); display:flex; align-items:center; justify-content:center; z-index:200; animation: fadeIn .18s ease; }
  .modal{ background:#fff; border-radius:12px; padding:22px 24px; width:380px; max-width:90vw; box-shadow:0 12px 40px rgba(0,0,0,.25); animation: modalPop .22s cubic-bezier(.22,1,.36,1); }
  .modal h3{ margin-bottom:14px; font-size:18.5px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

  .report-header{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:18px; }
  .remark-box{ background:var(--accent-soft); border-left:3px solid var(--accent); padding:12px 14px; border-radius:6px; font-size:16px; line-height:1.6; color:#3B0764; }

  @media print{
    .no-print{ display:none !important; }
    .sidebar{ display:none !important; }
    .main{ padding:0; max-width:100%; }
    body{ background:#fff; }
    .card{ box-shadow:none; border:none; padding:0; margin-bottom:20px;}
  }
  @media (max-width: 880px){
    #app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:12px; align-items:center; }
    .brand{ display:none; }
    .global-search-wrap{ display:none; }
    .sidebar-foot{ display:none; }
    .nav-item{ white-space:nowrap; }
    .main{ padding:20px; }
    .grid-2, .grid-3, .grid-4{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   LỚP TƯƠNG THÍCH LƯU TRỮ
   Trong Claude: dùng window.storage có sẵn (lưu trên máy chủ Claude).
   Khi chạy độc lập ngoài Claude (VD host tĩnh trên GitHub Pages) thì
   window.storage không tồn tại — tự động thay bằng localStorage của
   chính trình duyệt, để app vẫn lưu/đọc được dữ liệu bình thường.
   Lưu ý: localStorage chỉ lưu trên MÁY/TRÌNH DUYỆT đang mở, không
   đồng bộ giữa các thiết bị hay giữa nhiều người dùng khác nhau.
============================================================ */
const APP_VERSION = '2026-08-14.3';
const RUNNING_STANDALONE = (typeof window.storage === 'undefined');
if(RUNNING_STANDALONE){
  window.storage = {
    async get(key, shared){
      try{
        const raw = localStorage.getItem('edutrack_'+key);
        if(raw===null) return null;
        return {key, value: raw, shared: !!shared};
      }catch(e){ return null; }
    },
    async set(key, value, shared){
      try{
        localStorage.setItem('edutrack_'+key, value);
        return {key, value, shared: !!shared};
      }catch(e){ return null; }
    },
    async delete(key, shared){
      try{
        localStorage.removeItem('edutrack_'+key);
        return {key, deleted:true, shared: !!shared};
      }catch(e){ return null; }
    },
    async list(prefix, shared){
      try{
        const p = 'edutrack_' + (prefix||'');
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(p)) keys.push(k.slice('edutrack_'.length));
        }
        return {keys, prefix, shared: !!shared};
      }catch(e){ return null; }
    }
  };
}

/* ============================================================
   ĐỒNG BỘ FIRESTORE (đa thiết bị: điện thoại ↔ máy tính)
   ------------------------------------------------------------
   1) Tạo dự án Firebase + bật Firestore (xem hướng dẫn cô nhận kèm).
   2) KHÔNG cần sửa file — mở app → vào Trang chủ → thẻ
      "☁️ Đồng bộ & Sao lưu" → dán nguyên đoạn "firebaseConfig" từ
      Firebase Console vào ô trên web → bấm Lưu → trang tự tải lại.
   3) Sau đó đặt 1 "Mã đồng bộ" tuỳ ý (VD: "hoa-thcs-trungvuong") →
      gõ đúng mã đó trên mọi thiết bị muốn dùng chung dữ liệu.
   Nếu chưa cấu hình gì, app hoạt động như cũ — không bắt buộc dùng Firebase.
============================================================ */
function loadStoredFirebaseConfig(){
  try{
    const raw = localStorage.getItem('edutrack_firebase_config');
    if(!raw) return null;
    const obj = JSON.parse(raw);
    return (obj && obj.apiKey) ? obj : null;
  }catch(e){ return null; }
}
function saveStoredFirebaseConfig(obj){
  try{ localStorage.setItem('edutrack_firebase_config', JSON.stringify(obj)); return true; }
  catch(e){ return false; }
}
function clearStoredFirebaseConfig(){
  try{ localStorage.removeItem('edutrack_firebase_config'); }catch(e){}
}
// Chấp nhận cả JSON thuần lẫn nguyên đoạn code Firebase hay đưa ra
// (VD: "const firebaseConfig = { apiKey: \"...\", ... };") — tự cắt lấy
// đúng phần { ... } rồi phân tích, không bắt cô phải sửa lại cú pháp.
function parseFirebaseConfigInput(text){
  if(!text) return null;
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start===-1 || end===-1 || end<start) return null;
  const objText = text.slice(start, end+1);
  // Đọc từng dòng dạng  key: "value"  bằng regex — không dùng eval/new Function
  // (một số trình duyệt/tiện ích mở rộng chặn eval vì lý do bảo mật).
  const obj = {};
  const re = /["']?([A-Za-z0-9_]+)["']?\s*:\s*["']([^"']+)["']/g;
  let m;
  while((m = re.exec(objText)) !== null){
    obj[m[1]] = m[2];
  }
  if(obj.apiKey && obj.projectId) return obj;
  return null;
}

let _firestoreTimedOutOnce = false;
function withTimeout(promise, ms, fallback){
  return new Promise((resolve)=>{
    let done = false;
    const timer = setTimeout(()=>{
      if(done) return;
      done = true;
      if(!_firestoreTimedOutOnce){
        _firestoreTimedOutOnce = true;
        showToast('Không kết nối được tới Firestore (quá thời gian chờ) — kiểm tra lại Firestore Database đã bật chưa.', 5000);
      }
      resolve(fallback);
    }, ms);
    promise.then((v)=>{ if(!done){ done=true; clearTimeout(timer); resolve(v); } })
           .catch(()=>{ if(!done){ done=true; clearTimeout(timer); resolve(fallback); } });
  });
}
const firestoreBackend = {
  async get(key, shared){
    try{
      const snap = await withTimeout(firestoreKvCollection().doc(key).get(), 8000, null);
      if(!snap || !snap.exists) return null;
      return {key, value: snap.data().value, shared: !!shared};
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    try{
      const ok = await withTimeout(firestoreKvCollection().doc(key).set({value, updatedAt: Date.now()}).then(()=>true), 8000, false);
      return ok ? {key, value, shared: !!shared} : null;
    }catch(e){ return null; }
  },
  async delete(key, shared){
    try{
      const ok = await withTimeout(firestoreKvCollection().doc(key).delete().then(()=>true), 8000, false);
      return ok ? {key, deleted:true, shared: !!shared} : null;
    }catch(e){ return null; }
  },
  async list(prefix, shared){
    try{
      const snaps = await withTimeout(firestoreKvCollection().get(), 8000, null);
      if(!snaps) return {keys:[], prefix, shared: !!shared};
      const keys = [];
      snaps.forEach(doc=>{ if(!prefix || doc.id.startsWith(prefix)) keys.push(doc.id); });
      return {keys, prefix, shared: !!shared};
    }catch(e){ return null; }
  }
};

async function storageGet(key){
  try{ const r = await activeBackend().get(key, true); return r ? r.value : null; }
  catch(e){ return null; }
}
async function storageSetRaw(key, value){
  try{
    const r = await activeBackend().set(key, value, true);
    if(r && syncActive()) setLastSyncAt();
    return !!r;
  }
  catch(e){ return false; }
}
// Lưu có tự thử lại 1 lần nếu lần đầu thất bại (thường do bị giới hạn tần suất khi lưu quá nhanh liên tục)
async function storageSet(key, value){
  let ok = await storageSetRaw(key, value);
  if(ok) return true;
  await new Promise(res=>setTimeout(res, 900));
  ok = await storageSetRaw(key, value);
  if(ok) return true;
  showToast('Không thể lưu dữ liệu, thử lại nhé.');
  return false;
}
// Gộp nhiều lần lưu liên tiếp trên cùng 1 khoá thành 1 lần lưu duy nhất sau khi ngừng thao tác ~600ms,
// tránh gửi dồn dập nhiều yêu cầu lưu khi cô nhập liệu nhanh (VD: gõ điểm liên tục nhiều ô).
const _saveDebounceTimers = {};
function debouncedStorageSet(key, value, delay){
  clearTimeout(_saveDebounceTimers[key]);
  _saveDebounceTimers[key] = setTimeout(()=>{ storageSet(key, value); }, delay || 600);
}
async function loadAll(){
  let cRaw = await storageGet('classes');

  // Di chuyển 1 lần: nếu kho "dùng chung" chưa có dữ liệu nhưng kho "riêng tư" cũ (trước khi bật chế độ
  // dùng chung) đang có dữ liệu, tự động chuyển sang kho chung để không bị mất dữ liệu đã nhập trước đó.
  // (Chỉ áp dụng khi KHÔNG đang đồng bộ qua Firestore — đây là logic riêng của window.storage.)
  if(!cRaw && !syncActive()){
    try{
      const oldClasses = await window.storage.get('classes', false);
      if(oldClasses && oldClasses.value){
        await window.storage.set('classes', oldClasses.value, true);
        const oldSessList = await window.storage.list('sessions_', false);
        if(oldSessList && oldSessList.keys){
          for(const k of oldSessList.keys){
            const oldSess = await window.storage.get(k, false);

          }

        cRaw = oldClasses.value;
        showToast('Đã chuyển dữ liệu cũ sang chế độ dùng chung.', 3500);
      }
    }catch(e){ /* không có dữ liệu riêng tư cũ, bỏ qua */ }
  }

  state.classes = cRaw ? JSON.parse(cRaw) : [];
  state.sessionsByClass = {};
  try{
    const list = await activeBackend().list('sessions_', true);
    if(list && list.keys){
      const entries = await Promise.all(list.keys.map(async (k)=>{
        const classId = k.slice('sessions_'.length);
        const raw = await storageGet(k);
        return [classId, raw ? JSON.parse(raw) : []];
      }));
      entries.forEach(([classId, sessions])=>{ state.sessionsByClass[classId] = sessions; });
    }
  }catch(e){ /* no sessions yet */ }
  const tName = await storageGet('teacherName');

  const recRaw = await storageGet('records');
  state.records.list = recRaw ? JSON.parse(recRaw) : [];
  if(state.classes.length && !state.currentClassId) state.currentClassId = state.classes[0].id;
  state.loaded = true;
}

// Học sinh có đang "nợ" chép phạt tính đến trước ngày `beforeDate` hay không:

function studentOwesPunishment(classId, studentId, beforeDate){
  const sessions = getSessions(classId).filter(s=>s.date < beforeDate);
  let owes = false;
  sessions.forEach(s=>{
    if(s.punishmentAssigned && s.punishmentAssigned[studentId]) owes = true;
    if(s.punishmentDone && s.punishmentDone[studentId]) owes = false;
  });
  return owes;
}
function getPendingPunishments(classId, beforeDate){

}

// Điểm 1 bài luyện tập. 2 kiểu:
// - "fraction" (mặc định, tương thích dữ liệu cũ): nhập số câu đúng, quy đổi sang thang 10.
// - "scale10": nhập thẳng điểm theo thang 10, cho phép thập phân 1 chữ số.
function exerciseTotal(ex){ return (ex && ex.totalQuestions) ? ex.totalQuestions : 10; }
function exerciseMode(ex){ return (ex && ex.mode==='scale10') ? 'scale10' : 'fraction'; }
function scoreOn10(correct, total){
  if(correct===null || correct===undefined || correct==='' || !total) return null;
  return clamp((Number(correct)/total)*10, 0, 10);
}
// Điểm hiển thị/tính toán cho 1 bài luyện tập của 1 học sinh, tự chọn công thức theo kiểu bài
function exerciseScoreOn10(ex, raw){
  if(raw===null || raw===undefined || raw==='') return null;
  if(exerciseMode(ex)==='scale10') return clamp(Number(raw), 0, 10);
  return scoreOn10(raw, exerciseTotal(ex));
}

function sessionScoreAvg(session, studentId){
  const sc = session.scores[studentId];
  if(!sc) return null;
  const vals = [];
  Object.keys(sc).forEach(exId=>{
    const ex = (session.exercises||[]).find(e=>e.id===exId);
    const s10 = exerciseScoreOn10(ex, sc[exId]);
    if(s10!==null) vals.push(s10);
  });
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function sessionClassAvg(session, studentIds){
  const vals = studentIds.map(id=>sessionScoreAvg(session,id)).filter(v=>v!==null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
// Tỷ lệ % học sinh có mặt trong 1 buổi cụ thể (trên số học sinh đã điểm danh buổi đó)
function sessionAttendanceRate(session, studentIds){
  let present=0, total=0;
  studentIds.forEach(id=>{
    const a = session.attendance[id];
    if(!a) return;
    total++;
    if(a==='present') present++;
  });
  return total ? Math.round(present/total*100) : null;
}
// Tỷ lệ % hoàn thành checklist bài tập của cả lớp trong 1 buổi cụ thể
function sessionChecklistRate(session, studentIds){
  if(!session.exerciseTypes || !session.exerciseTypes.length) return null;
  let full=0, partial=0, total=0;
  studentIds.forEach(id=>{
    const rec = session.checklist[id] || {};
    session.exerciseTypes.forEach(t=>{
      const v = rec[t.id] || 'none';
      total++;
      if(v==='full') full++;
      else if(v==='partial') partial++;
    });
  });
  return total ? Math.round(((full + partial*0.5)/total)*100) : null;
}

function attendanceFromSessions(sessions, studentId){
  let present=0, absent=0, late=0, total=0;
  sessions.forEach(s=>{
    const a = s.attendance[studentId];
    if(!a) return;
    total++;
    if(a==='present') present++;
    else if(a==='absent') absent++;
    else if(a==='late') late++;
  });
  return {present, absent, late, total, rate: total? Math.round((present)/total*100) : null};
}
function studentAttendanceStats(classId, studentId){
  return attendanceFromSessions(getSessions(classId), studentId);
}
function monthKey(dateStr){ return dateStr.slice(0,7); } // YYYY-MM
function monthLabel(key){
  const [y,m] = key.split('-');
  return `Tháng ${Number(m)}/${y}`;
}
function getClassMonths(classId){
  const sessions = getSessions(classId);
  const keys = Array.from(new Set(sessions.map(s=>monthKey(s.date))));
  return keys.sort();
}

function checklistFromSessions(sessions, studentId){
  let full=0, partial=0, none=0, total=0;
  sessions.forEach(s=>{
    if(!s.exerciseTypes || !s.exerciseTypes.length) return;
    const rec = s.checklist[studentId] || {};
    s.exerciseTypes.forEach(t=>{
      const v = rec[t.id] || 'none';
      total++;
      if(v==='full') full++;
      else if(v==='partial') partial++;
      else none++;
    });
  });
  const rate = total? Math.round(((full + partial*0.5)/total)*100) : null;
  return {full, partial, none, total, rate};
}
function studentChecklistStats(classId, studentId){
  return checklistFromSessions(getSessions(classId), studentId);
}

function studentScoreSeries(classId, studentId){
  const sessions = getSessions(classId);
  const students = getStudents(classId).map(s=>s.id);
  const out = [];
  sessions.forEach(s=>{
    const my = sessionScoreAvg(s, studentId);
    if(my===null) return;
    out.push({ date:s.date, score: my, classAvg: sessionClassAvg(s, students) });
  });
  return out;
}

function getWarnings(classId){
  const warns = [];
  const students = getStudents(classId);
  const sessions = getSessions(classId);
  students.forEach(st=>{
    // consecutive absences (last 2+ recorded sessions)
    const attended = sessions.filter(s=> s.attendance[st.id]);
    if(attended.length>=2){
      const lastTwo = attended.slice(-2);
      if(lastTwo.every(s=>s.attendance[st.id]==='absent')){
        warns.push({studentId:st.id, name:st.name, type:'absence', detail:`Vắng ${lastTwo.length} buổi liên tiếp gần đây nhất`});
      }
    }
    // declining scores (last 3 sessions strictly decreasing)
    const series = studentScoreSeries(classId, st.id);
    if(series.length>=3){
      const last3 = series.slice(-3);
      if(last3[0].score > last3[1].score && last3[1].score > last3[2].score){
        warns.push({studentId:st.id, name:st.name, type:'decline', detail:`Điểm giảm dần 3 buổi gần nhất: ${last3.map(x=>x.score.toFixed(1)).join(' → ')}`});
      }
    }
  });
  return warns;
}

   MODAL (thay thế prompt()/confirm() bị trình duyệt chặn)
============================================================ */
function openPromptModal(title, defaultValue, onSubmit, opts){
  opts = opts || {};
  state.modal = {type:'prompt', title, value: defaultValue || '', onSubmit, multiline: !!opts.multiline, placeholder: opts.placeholder || '', hint: opts.hint || '', submitLabel: opts.submitLabel || 'Lưu', showListTip: !!opts.showListTip};
  render();
  setTimeout(()=>{ const i = document.getElementById('modal-input'); if(i){ i.focus(); if(i.select) i.select(); } }, 30);
}
function openConfirmModal(title, danger, onSubmit){
  state.modal = {type:'confirm', title, danger, onSubmit};
  render();
}
function closeModal(){ state.modal = null; render(); }
function renderModal(){
  if(!state.modal) return '';
  const m = state.modal;
  if(m.type==='prompt'){
    const field = m.multiline
      ? `<textarea id="modal-input" rows="9" placeholder="${esc(m.placeholder)}" style="font-family:'Be Vietnam Pro',sans-serif;">${esc(m.value)}</textarea>`
      : `<input type="text" id="modal-input" value="${esc(m.value)}" placeholder="${esc(m.placeholder)}" data-action="modal-input">`;
    return `
    <div class="modal-backdrop no-print" data-action="modal-backdrop">
      <div class="modal" data-stop="1" style="${m.multiline?'width:440px;':''}">
        <h3>${esc(m.title)}</h3>
        ${m.hint? `<div class="muted" style="margin:-8px 0 12px;">${esc(m.hint)}</div>` : ''}
        ${field}
        ${m.multiline && m.showListTip? `<div class="tiny" style="margin-top:6px;">Mẹo: chọn cả danh sách trong Excel/Word rồi dán trực tiếp vào ô trên (Ctrl+Enter để lưu nhanh).</div>` : ''}
        <div class="modal-actions">
          <button class="btn btn-outline" data-action="modal-cancel">Huỷ</button>
          <button class="btn btn-accent" data-action="modal-submit">${esc(m.submitLabel)}</button>
        </div>
      </div>
    </div>`;
  }
  return `
  <div class="modal-backdrop no-print" data-action="modal-backdrop">
    <div class="modal" data-stop="1">
      <h3>${esc(m.title)}</h3>
      <div class="modal-actions">
        <button class="btn btn-outline" data-action="modal-cancel">Huỷ</button>
        <button class="btn ${m.danger?'btn-danger-outline':'btn-accent'}" style="${m.danger?'background:var(--danger);color:#fff;border-color:var(--danger);':''}" data-action="modal-submit">Đồng ý</button>
      </div>
    </div>
  </div>`;
}

function getTodaySuggestions(){
  const d = new Date();
  const dayOfMonth = d.getDate();
  const dayOfWeek = d.getDay(); // 0=CN,1=T2,...,6=T7
  const suggestions = [];

  suggestions.push({id:'session-today', icon:'✎', title:'Ghi nhận buổi học hôm nay', detail:'Điểm danh, checklist bài tập và điểm số cho buổi dạy hôm nay.', tab:'session'});

  if(dayOfMonth<=5){
    suggestions.push({id:'monthly-conduct-exam', icon:'📋', title:'Đầu tháng — chấm hạnh kiểm & nhập điểm KT tháng trước', detail:'Vào Công tác chủ nhiệm để xếp loại hạnh kiểm và nhập điểm kiểm tra định kỳ của tháng vừa qua.', tab:'homeroom', section:'conduct'});
  }
  if(dayOfMonth>=25){
    suggestions.push({id:'monthly-honors', icon:'🎖️', title:'Cuối tháng — xét vinh danh học sinh', detail:'Xem học sinh xứng đáng vinh danh trước khi sang tháng mới.', tab:'honors'});
    suggestions.push({id:'monthly-risk', icon:'🚨', title:'Cuối tháng — rà soát Quản trị rủi ro', detail:'Kiểm tra lại danh sách học sinh cần hỗ trợ trước khi tổng kết tháng.', tab:'riskMgmt'});
  }
  if(dayOfWeek===5 || dayOfWeek===6){
    suggestions.push({id:'weekend-duty', icon:'🧹', title:'Cuối tuần — sắp xếp trực nhật tuần tới', detail:'Xem lại lịch xoay vòng trực nhật cho tuần sau.', tab:'homeroom', section:'duties'});
  }
  if(dayOfWeek===1){
    suggestions.push({id:'monday-teams', icon:'🏁', title:'Đầu tuần — cộng điểm thi đua tổ/nhóm', detail:'Tổng kết điểm thi đua tuần trước cho các tổ.', tab:'homeroom', section:'teams'});
  }

  return suggestions;
}

  if(!st){
    return `<div class="topbar"><h1 class="page-title">Hồ sơ học sinh</h1></div><div class="card empty"><h3>Không tìm thấy học sinh</h3><button class="btn btn-outline" data-action="goto-suggestion" data-tab="home" style="margin-top:10px;">← Về Trang chủ</button></div>`;

  const classId = cls.id;
  const att = studentAttendanceStats(classId, studentId);
  const series = studentScoreSeries(classId, studentId);
  const avgScore = series.length? (series.reduce((a,b)=>a+b.score,0)/series.length) : null;

function renderHome(){
  if(!state.classes.length){
    return `
      <div class="topbar"><div><h1 class="page-title">Trang chủ</h1>${chalkUnderline()}<div class="page-sub">Bắt đầu bằng cách tạo lớp học đầu tiên, hoặc kết nối đồng bộ để lấy dữ liệu từ thiết bị khác</div></div></div>
      ${renderSyncCard()}
      <div class="card empty">
        <h3>Chưa có lớp học nào</h3>
        <div class="muted" style="margin-bottom:14px;">Tạo lớp và thêm danh sách học sinh để bắt đầu ghi nhận buổi học — hoặc nếu đã có dữ liệu ở thiết bị khác, dùng thẻ "Đồng bộ đa thiết bị" ở trên để lấy về.</div>
        <button class="btn btn-accent" data-action="go-classes">+ Tạo lớp học</button>
      </div>`;
  }

  const today = todayISO();
  const suggestions = getTodaySuggestions();

  // Gộp việc cần chú ý hôm nay: cảnh báo học sinh + nhiệm vụ quá hạn
  const attentionItems = [];
  state.classes.forEach(c=>{
    getWarnings(c.id).forEach(w=>{
      attentionItems.push({
        icon:'⚠', title:`${w.name} — ${w.type==='absence'?'Vắng học liên tiếp':'Điểm giảm dần'}`,
        detail:`${c.name} · ${w.detail}`,
        actionLabel:'Xem báo cáo', action:'goto-report', classId:c.id, studentId:w.studentId
      });
    });
    (c.tasks||[]).forEach(t=>{
      if(!t.completed && t.dueDate && t.dueDate < today){
        attentionItems.push({
          icon:'⏰', title:`Nhiệm vụ quá hạn: ${t.title}`,
          detail:`${c.name} · Hạn hoàn thành: ${fmtDateVN(t.dueDate)}`,
          actionLabel:'Xem nhiệm vụ', action:'goto-duties', classId:c.id
        });
      }
    });
  });

  const attentionHtml = attentionItems.length ? `
    <div class="card">
      <div class="card-title">🔔 Cần chú ý hôm nay <span class="tiny">(${attentionItems.length})</span></div>
      ${attentionItems.map(item=>`
        <div class="warn-banner">
          <div class="dot"></div>
          <div style="flex:1;">
            <div class="warn-title">${item.icon} ${esc(item.title)}</div>
            <div class="warn-detail">${esc(item.detail)}</div>
          </div>
          <button class="btn btn-outline btn-sm" data-action="${item.action}" data-class="${item.classId}" ${item.studentId?`data-student="${item.studentId}"`:''}>${item.actionLabel}</button>
        </div>`).join('')}
    </div>
  ` : `<div class="card"><div class="card-title">✓ Không có gì cần chú ý</div><div class="muted">Chưa có cảnh báo, chép phạt còn nợ hay nhiệm vụ quá hạn nào.</div></div>`;

  const totalStudents = state.classes.reduce((s,c)=>s+c.students.length,0);
  const totalSessions = state.classes.reduce((s,c)=>s+getSessions(c.id).length,0);

  const todayDone = state.dailyTasks[today] || {};
  const templates = state.dailyTaskTemplates || [];
  const doneCount = templates.filter(tpl=>todayDone[tpl.id]).length;

  return `
    <div class="topbar">
      <div><h1 class="page-title">Trang chủ</h1>${chalkUnderline()}<div class="page-sub">Tổng quan nhanh trước khi vào lớp</div></div>
    </div>

    <div class="card" style="background:var(--ink); color:#fff;">
      <div class="card-title" style="color:#fff;">🧭 Gợi ý cho hôm nay <span class="tiny" style="color:#C7CBCE;">(${fmtDateVN(today)})</span></div>
      ${suggestions.map(s=>{
        const done = !!todayDone[s.id];
        return `
        <div style="display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12);">
          <input type="checkbox" ${done?'checked':''} data-action="toggle-suggestion-done" data-id="${s.id}" style="width:20px;height:20px;flex-shrink:0;">
          <span style="font-size:20px;">${s.icon}</span>
          <div style="flex:1;">
            <div style="font-weight:700; font-family:'Baloo 2',sans-serif; font-size:15.5px; ${done?'text-decoration:line-through;opacity:.65;':''}">${esc(s.title)}</div>
            <div class="tiny" style="color:#C7CBCE;">${esc(s.detail)}</div>
          </div>
          <button class="btn btn-outline btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4);" data-action="goto-suggestion" data-tab="${s.tab}" ${s.section?`data-section="${s.section}"`:''}>Đi tới →</button>
        </div>`;
      }).join('')}
    </div>

    ${renderSyncCard()}

    <div class="grid-3" style="margin-bottom:18px;">
      <div class="card" style="margin-bottom:0;"><div class="stat-num">${state.classes.length}</div><div class="stat-label">Lớp học</div></div>
      <div class="card" style="margin-bottom:0;"><div class="stat-num">${totalStudents}</div><div class="stat-label">Học sinh</div></div>
      <div class="card" style="margin-bottom:0;"><div class="stat-num">${totalSessions}</div><div class="stat-label">Buổi học đã ghi</div></div>
    </div>

    <div class="card">
      <div class="card-title">📝 Việc cần làm hôm nay ${templates.length? `<span class="tiny">(${doneCount}/${templates.length})</span>`:''}</div>
      ${templates.length? templates.map(tpl=>{
        const done = !!todayDone[tpl.id];
        return `
        <div style="display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line);">
          <input type="checkbox" ${done?'checked':''} data-action="toggle-daily-task" data-task="${tpl.id}" style="width:20px;height:20px;flex-shrink:0;">
          <span style="flex:1;${done?'text-decoration:line-through;color:var(--ink-soft);':''}">${esc(tpl.title)}</span>
          <button class="btn btn-danger-outline btn-sm" data-action="delete-daily-template" data-task="${tpl.id}">Xoá</button>
        </div>`;
      }).join('') : `<div class="muted" style="margin-bottom:10px;">Chưa có việc nào — thêm việc cô muốn nhắc lặp lại mỗi ngày bên dưới.</div>`}
      <div style="display:flex; gap:8px; margin-top:12px;">
        <input type="text" id="new-daily-task" placeholder="VD: Viết báo cáo cuối ngày, nhập điểm...">
        <button class="btn btn-outline btn-sm" data-action="add-daily-template">+ Thêm việc</button>
      </div>
    </div>

    ${attentionHtml}
  `;
}

/* ============================================================
   SESSION (TRÊN LỚP)
============================================================ */
function currentSession(){
  const list = state.sessionsByClass[state.currentClassId] || [];
  let s = list.find(x=>x.date===state.session.date);
  return s || null;
}
function ensureSessionEditable(){
  if(!state.currentClassId) return null;
  let list = state.sessionsByClass[state.currentClassId] || (state.sessionsByClass[state.currentClassId]=[]);
  let s = list.find(x=>x.date===state.session.date);
  if(!s){ s = newSession(state.session.date); list.push(s); }
  return s;
}

function renderSession(){
  if(!state.classes.length){
    return `<div class="topbar"><h1 class="page-title">Buổi học</h1></div><div class="card empty"><h3>Chưa có lớp học</h3><div class="muted">Hãy tạo lớp và thêm học sinh trước.</div></div>`;
  }
  const students = getStudents(state.currentClassId);
  const s = currentSession();

  const classOptions = state.classes.map(c=>`<option value="${c.id}" ${c.id===state.currentClassId?'selected':''}>${esc(c.name)}</option>`).join('');

  let body;
  if(!students.length){
    body = `<div class="card empty"><h3>Lớp này chưa có học sinh</h3><div class="muted">Vào tab "Lớp học" để thêm danh sách học sinh.</div></div>`;
  } else {
    const sess = s || newSession(state.session.date);
    const warns = getWarnings(state.currentClassId);
    const warnSet = {}; warns.forEach(w=> warnSet[w.studentId]=true);
    const pending = getPendingPunishments(state.currentClassId, state.session.date);
    const pendingSet = {}; pending.forEach(p=> pendingSet[p.id]=true);
    const types = sess.exerciseTypes || [];
    const exercises = sess.exercises || [];
    const colCount = 3 + types.length + exercises.length; // Học sinh + Điểm danh + Chép phạt + Ghi chú + động

    const sortKey = state.session.sortKey || 'default';
    const sortDir = state.session.sortDir || 'desc';
    const sortExercise = exercises.find(e=>e.id===sortKey);
    function sortValueOf(studentId){
      if(sortKey==='avg') return sessionScoreAvg(sess, studentId);
      if(sortExercise){
        const raw = (sess.scores[studentId]||{})[sortExercise.id];
        return exerciseScoreOn10(sortExercise, raw);
      }
      return null;
    }
    let orderedStudents = students;
    if(exercises.length && sortKey !== 'default'){
      const withScore = students.map(st=>({st, val: sortValueOf(st.id)}));
      withScore.sort((a,b)=>{
        if(a.val===null && b.val===null) return 0;
        if(a.val===null) return 1;
        if(b.val===null) return -1;
        return sortDir==='desc' ? b.val-a.val : a.val-b.val;
      });
      orderedStudents = withScore.map(x=>x.st);
    }

    body = `
      ${pending.length ? `
      <div class="warn-banner" style="margin-bottom:16px;">
        <div class="dot"></div>
        <div style="flex:1;">
          <div class="warn-title">📌 Cần kiểm tra chép phạt buổi này</div>
          <div class="warn-detail">${pending.map(p=>esc(p.name)).join(', ')} — còn nợ chép phạt từ buổi trước. Tick cột "✅ Đã KT" ở bảng bên dưới khi đã nộp.</div>
        </div>
      </div>` : ''}

      <div class="card">
        <div class="card-title">📝 Ghi chú buổi học</div>
        <div class="grid-2">
          <div>
            <label class="field-label">Nội dung học tập</label>
            <textarea rows="2" placeholder="VD: Unit 5 - Present Perfect, luyện nói theo cặp..." data-field="content">${esc(sess.content)}</textarea>
          </div>
          <div>
            <label class="field-label">Nhận xét về nền nếp</label>
            <textarea rows="2" placeholder="VD: Lớp học nghiêm túc, một số em nói chuyện riêng..." data-field="disciplineNote">${esc(sess.disciplineNote||'')}</textarea>
          </div>
          <div>
            <label class="field-label">Lưu ý của buổi học <span class="tiny">(mỗi dòng 1 ý)</span></label>
            <textarea rows="2" placeholder="VD: Cần luyện thêm phát âm âm cuối..." data-field="generalNote">${esc(sess.generalNote)}</textarea>
          </div>
          <div>
            <label class="field-label">Bài tập về nhà <span class="tiny">(mỗi dòng 1 bài)</span></label>
            <textarea rows="2" placeholder="VD: Làm bài tập Unit 5 trang 20..." data-field="homework">${esc(sess.homework||'')}</textarea>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">⚙️ Thiết lập Checklist bài tập</div>
        <div class="chip-row" style="margin-bottom:8px;">
          ${types.map(t=>`<div class="chip">${esc(t.name)} <button data-action="del-extype" data-id="${t.id}">×</button></div>`).join('') || `<span class="tiny">Chưa có loại bài nào.</span>`}
        </div>
        <div style="display:flex; gap:8px; max-width:420px;">
          <input type="text" id="new-extype" placeholder="VD: Phiếu bài tập, Đặt câu...">
          <button class="btn btn-outline btn-sm" data-action="add-extype">+ Thêm</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>📋 Bảng ghi nhận buổi học</span>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            ${exercises.length? `
            <select data-action="session-sort-key" style="width:auto;">
              <option value="default" ${sortKey==='default'?'selected':''}>Không sắp xếp</option>
              <option value="avg" ${sortKey==='avg'?'selected':''}>Sắp xếp theo: Điểm TB buổi</option>
              ${exercises.map(e=>`<option value="${e.id}" ${sortKey===e.id?'selected':''}>Sắp xếp theo: ${esc(e.name)}</option>`).join('')}
            </select>
            ${sortKey!=='default'? `
            <select data-action="session-sort-dir" style="width:auto;">
              <option value="desc" ${sortDir==='desc'?'selected':''}>Cao → thấp</option>
              <option value="asc" ${sortDir==='asc'?'selected':''}>Thấp → cao</option>
            </select>` : ''}` : ''}
            ${exercises.length? `<button class="btn btn-danger-outline btn-sm" data-action="reset-scores">↺ Đặt lại điểm buổi này</button>`:''}
          </div>
        </div>
        <div class="muted" style="margin-bottom:10px;">Checklist: bấm ô để chuyển Chưa làm → Làm thiếu → Đầy đủ. Dùng nút "Tick tất cả" ở tiêu đề cột để làm nhanh cả lớp, rồi chỉnh lại từng em ngoại lệ. Cuộn ngang nếu bảng rộng hơn màn hình — cột "Học sinh" luôn cố định.</div>

        <div style="border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:14px; background:var(--surface-alt);">
          <div class="chip-row" style="margin-bottom:${exercises.length?'8px':'0'};">
            ${exercises.map(e=>`<div class="chip">${esc(e.name)} · ${exerciseMode(e)==='scale10' ? 'thang 10' : exerciseTotal(e)+' câu'} <button data-action="del-exercise" data-id="${e.id}">×</button></div>`).join('')}
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="new-exercise" placeholder="+ Tên bài luyện tập mới..." style="flex:2;min-width:140px;">
            <select id="new-exercise-mode" style="flex:1;min-width:150px;">
              <option value="fraction">Theo số câu đúng/tổng</option>
              <option value="scale10">Thang 10</option>
            </select>
            <input type="number" id="new-exercise-total" placeholder="Tổng số câu" min="1" step="1" style="flex:1;min-width:90px;">
            <button class="btn btn-outline btn-sm" data-action="add-exercise">+ Thêm bài luyện tập</button>
          </div>
        </div>

        <div style="overflow-x:auto;">
        <table class="session-table" style="min-width:${560 + (types.length+exercises.length)*90}px;">
          <thead>
            <tr>
              <th rowspan="2" style="min-width:130px;">Học sinh</th>
              <th rowspan="2" style="min-width:150px;">
                Điểm danh<br>
                <button class="btn btn-outline btn-sm" data-action="tick-all-attendance" style="margin-top:4px;font-size:10.5px;padding:3px 7px;font-weight:600;text-transform:none;letter-spacing:0;">✓ Tất cả có mặt</button>
              </th>
              ${types.length? `<th colspan="${types.length}" style="text-align:center;">Checklist bài tập</th>` : ''}
              ${exercises.length? `<th colspan="${exercises.length}" style="text-align:center;">Điểm luyện tập</th>` : ''}
              <th rowspan="2" style="min-width:130px;">📌 Chép phạt</th>
              <th rowspan="2" style="min-width:170px;">Ghi chú riêng</th>
            </tr>
            <tr>
              ${types.map(t=>`<th style="text-align:center;min-width:80px;">
                ${esc(t.name)}<br>
                <button class="btn btn-outline btn-sm" data-action="tick-all-checklist" data-type="${t.id}" style="margin-top:4px;font-size:10.5px;padding:3px 6px;font-weight:600;text-transform:none;letter-spacing:0;">✓ Đủ tất cả</button>
              </th>`).join('')}
              ${exercises.map(e=>`<th style="text-align:center;min-width:90px;">${esc(e.name)}<div class="tiny" style="text-transform:none;letter-spacing:0;">(${exerciseMode(e)==='scale10' ? 'thang 10' : exerciseTotal(e)+' câu'})</div></th>`).join('')}
            </tr>
          </thead>
          <tbody>
          ${orderedStudents.map(st=>{
            const a = sess.attendance[st.id] || '';
            const owes = pendingSet[st.id] || false;
            const done = !!(sess.punishmentDone||{})[st.id];
            const assigned = !!(sess.punishmentAssigned||{})[st.id];
            return `<tr class="ledger ${warnSet[st.id]||owes?'flagged':''}">
              <td><b>${esc(st.name)}</b>${exercises.length? (()=>{ const v = sortKey!=='default'? sortValueOf(st.id) : sessionScoreAvg(sess, st.id); return v!==null? ` <span class="tiny mono" style="color:var(--ink-soft);">(${v.toFixed(1)})</span>` : ''; })() : ''}</td>
              <td>
                <div class="seg" data-attendance-group="${st.id}">
                  <button class="${a==='present'?'on present':''}" title="Có mặt" data-action="set-att" data-student="${st.id}" data-value="present">✓</button>
                  <button class="${a==='absent'?'on absent':''}" title="Vắng" data-action="set-att" data-student="${st.id}" data-value="absent">✗</button>
                  <button class="${a==='late'?'on late':''}" title="Muộn" data-action="set-att" data-student="${st.id}" data-value="late">⏰</button>
                </div>
              </td>
              ${types.map(t=>{
                const v = (sess.checklist[st.id]||{})[t.id] || 'none';
                const label = v==='full'?'✓':(v==='partial'?'½':'—');
                return `<td style="text-align:center;"><div class="tick ${v}" data-action="cycle-check" data-student="${st.id}" data-type="${t.id}">${label}</div></td>`;
              }).join('')}
              ${exercises.map(e=>{
                const mode = exerciseMode(e);
                const total = exerciseTotal(e);
                const v = (sess.scores[st.id]||{})[e.id];
                if(mode==='scale10'){
                  return `<td style="text-align:center;">
                    <input class="score-input" type="number" min="0" max="10" step="0.1" value="${v!==undefined?v:''}" placeholder="0-10" data-action="set-score" data-student="${st.id}" data-exercise="${e.id}" data-total="${total}" data-mode="scale10">
                  </td>`;
                }
                const computed = exerciseScoreOn10(e, v);
                return `<td style="text-align:center;">
                  <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
                    <input class="score-input" type="number" min="0" max="${total}" step="1" value="${v!==undefined?v:''}" placeholder="0-${total}" data-action="set-score" data-student="${st.id}" data-exercise="${e.id}" data-total="${total}" data-mode="fraction">
                    <span class="tiny mono score-computed">${computed!==null? computed.toFixed(1)+'/10' : '—'}</span>
                  </div>
                </td>`;
              }).join('')}
              <td>
                <div style="display:flex; flex-direction:column; gap:4px; font-size:12.5px;">
                  ${owes? `<label style="display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--danger);"><input type="checkbox" ${done?'checked':''} data-action="toggle-punishment-done" data-student="${st.id}"> Đã KT</label>` : ''}
                  <label style="display:flex;align-items:center;gap:4px;cursor:pointer;" title="Giao chép phạt buổi này"><input type="checkbox" ${assigned?'checked':''} data-action="toggle-punishment-assign" data-student="${st.id}"> Giao mới</label>
                </div>
              </td>
              <td><input type="text" placeholder="Lưu ý riêng..." value="${esc(sess.studentNotes[st.id]||'')}" data-action="set-note" data-student="${st.id}"></td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
        </div>
      </div>
    `;
  }

  return `
    <div class="topbar">
      <div><h1 class="page-title">Buổi học</h1>${chalkUnderline()}<div class="page-sub">Ghi nhận điểm danh, bài tập và đánh giá theo từng buổi</div></div>
    </div>
    <div class="card" style="display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;">
      <div>
        <label class="field-label">Lớp</label>
        <select class="class-select" data-action="change-class-session">${classOptions}</select>
      </div>
      <div>
        <label class="field-label">Ngày học</label>
        <input type="date" value="${state.session.date}" data-action="change-session-date" style="width:170px;">
      </div>
      <div>
        <label class="field-label">Giáo viên</label>
        <input type="text" value="${esc(state.teacherName)}" placeholder="Tên giáo viên" data-action="set-teacher-name" style="width:180px;">
      </div>
      ${currentSession()? `<button class="btn btn-danger-outline btn-sm" data-action="delete-session">🗑 Xoá buổi học này</button>`:''}
      ${currentSession()? `<button class="btn btn-outline btn-sm" data-action="generate-session-prompt" data-class="${state.currentClassId}" data-date="${state.session.date}">✨ Tạo prompt báo cáo</button>`:''}
      ${currentSession()? `<button class="btn btn-accent btn-sm" data-action="export-session-doc">⬇ Xuất báo cáo buổi học (mẫu)</button>`:''}
      <div class="muted" style="margin-left:auto;">${currentSession()? 'Đã có dữ liệu cho buổi này — mọi thay đổi tự lưu.':'Buổi mới — dữ liệu sẽ được tạo khi bạn nhập.'}</div>
    </div>
    ${body}
    ${state.session.prompt ? `
    <div class="card">
      <div class="card-title">
        <span>📝 Prompt báo cáo buổi học</span>
        <button class="btn btn-outline btn-sm" data-action="copy-session-prompt">💬 Copy prompt</button>
      </div>
      <div class="muted" style="margin-bottom:8px;">Dán prompt này vào ChatGPT/Claude/Gemini... (bản có hỗ trợ xuất file) để tạo file Word (.docx) báo cáo hoàn chỉnh, sẵn sàng in hoặc gửi đi.</div>
      <textarea id="session-prompt-text" rows="14">${esc(state.session.prompt)}</textarea>
    </div>` : ''}
  `;
}

/* ============================================================
   REPORT
============================================================ */
function generateRemark(classId, studentId){
  const att = studentAttendanceStats(classId, studentId);
  const series = studentScoreSeries(classId, studentId);
  const students = getStudents(classId);
  const lastSession = getSessions(classId).slice(-1)[0];
  let parts = [];

  if(att.total===0){ parts.push('Chưa có đủ dữ liệu điểm danh để đánh giá nền nếp.'); }
  else if(att.rate>=90) parts.push(`Nền nếp tốt, đi học đều đặn (đạt ${att.rate}% số buổi).`);
  else if(att.rate>=75) parts.push(`Nền nếp khá ổn, tuy nhiên còn ${att.absent} buổi vắng và ${att.late} buổi đi muộn cần lưu ý.`);
  else parts.push(`Cần cải thiện nền nếp: tỷ lệ đi học đạt ${att.rate}%, đã vắng ${att.absent} buổi.`);

  // Điểm danh buổi gần nhất so với buổi liền trước
  const allSess = getSessions(classId);
  if(allSess.length>=2){
    const last = allSess[allSess.length-1], prev = allSess[allSess.length-2];
    const lastA = last.attendance[studentId], prevA = prev.attendance[studentId];
    if(lastA && prevA){
      const label = (a)=> a==='present'?'có mặt': a==='absent'?'vắng':'đi muộn';
      if(lastA===prevA) parts.push(`Buổi gần nhất (${fmtDateVN(last.date)}) vẫn ${label(lastA)}, giống như buổi trước (${fmtDateVN(prev.date)}).`);
      else parts.push(`Buổi gần nhất (${fmtDateVN(last.date)}) ${label(lastA)}, trong khi buổi trước (${fmtDateVN(prev.date)}) ${label(prevA)}.`);
    }
  }

  if(series.length>=2){
    const first = series[0].score, last = series[series.length-1].score;
    if(last - first > 0.5) parts.push('Kết quả học tập có xu hướng tiến bộ rõ rệt qua các buổi.');
    else if(first - last > 0.5) parts.push('Điểm số có xu hướng giảm dần, cần được quan tâm và hỗ trợ thêm.');
    else parts.push('Kết quả học tập ổn định qua các buổi gần đây.');
  }

  if(series.length){
    const lastScore = series[series.length-1].score;
    const classAvg = series[series.length-1].classAvg;
    if(classAvg!==null){
      if(lastScore - classAvg > 0.5) parts.push(`Điểm buổi gần nhất (${lastScore.toFixed(1)}) cao hơn mức trung bình của lớp (${classAvg.toFixed(1)}).`);
      else if(classAvg - lastScore > 0.5) parts.push(`Điểm buổi gần nhất (${lastScore.toFixed(1)}) còn thấp hơn mức trung bình của lớp (${classAvg.toFixed(1)}), cần luyện tập thêm.`);
      else parts.push(`Điểm buổi gần nhất (${lastScore.toFixed(1)}) tương đương mức trung bình chung của lớp.`);
    }
  }

  if(lastSession){
    const allScores = students.map(s=>sessionScoreAvg(lastSession, s.id)).filter(v=>v!==null);
    if(allScores.length){
      const max = Math.max(...allScores), min = Math.min(...allScores);
      parts.push(`Buổi ${fmtDateVN(lastSession.date)}, điểm cao nhất của lớp là ${max.toFixed(1)}, thấp nhất là ${min.toFixed(1)}.`);
    }
  }

  const cl = studentChecklistStats(classId, studentId);
  if(cl.total>0){
    if(cl.rate>=90) parts.push(`Hoàn thành bài tập rất tốt (đạt ${cl.rate}%, trong đó có ${cl.partial} lượt làm chưa đầy đủ và ${cl.none} lượt chưa làm).`);
    else if(cl.rate>=70) parts.push(`Hoàn thành bài tập khá tốt (đạt ${cl.rate}%), tuy nhiên còn ${cl.partial} lượt làm thiếu và ${cl.none} lượt chưa làm bài.`);
    else parts.push(`Cần chú ý hơn về việc hoàn thành bài tập: chỉ đạt ${cl.rate}% (${cl.none} lượt chưa làm, ${cl.partial} lượt làm chưa đầy đủ trên tổng ${cl.total} lượt được giao).`);
  }

  return parts.join(' ');
}

function generateClassRemark(classId){
  const cls = getClass(classId);
  const students = cls.students;
  const sessions = getSessions(classId);
  if(!sessions.length || !students.length) return 'Chưa có đủ dữ liệu buổi học để nhận xét về lớp.';

  const rates = students.map(s=>studentAttendanceStats(classId,s.id).rate).filter(r=>r!==null);
  const avgRate = rates.length? Math.round(rates.reduce((a,b)=>a+b,0)/rates.length) : null;

  const perSession = sessions.map(s=>sessionClassAvg(s, students.map(x=>x.id))).filter(v=>v!==null);
  let trendText = '';
  if(perSession.length>=2){
    const diff = perSession[perSession.length-1]-perSession[0];
    if(diff>0.5) trendText = 'Điểm trung bình chung của lớp có xu hướng tăng dần qua các buổi.';
    else if(diff<-0.5) trendText = 'Điểm trung bình chung của lớp có xu hướng giảm dần, cần có biện pháp hỗ trợ thêm.';
    else trendText = 'Điểm trung bình chung của lớp khá ổn định qua các buổi.';
  }

  const warns = getWarnings(classId);
  const warnText = warns.length ? `Hiện có ${warns.length} lượt học sinh cần chú ý (vắng liên tiếp hoặc điểm giảm dần).` : 'Chưa có học sinh nào trong diện cần cảnh báo đặc biệt.';

  const attendText = avgRate!==null ? `Tỷ lệ chuyên cần trung bình của lớp đạt ${avgRate}%.` : '';

  const clRates = students.map(s=>studentChecklistStats(classId,s.id).rate).filter(r=>r!==null);
  const avgCl = clRates.length? Math.round(clRates.reduce((a,b)=>a+b,0)/clRates.length) : null;
  const lowClCount = students.filter(s=>{ const r = studentChecklistStats(classId,s.id).rate; return r!==null && r<60; }).length;
  let clText = '';
  if(avgCl!==null){
    clText = `Tỷ lệ hoàn thành bài tập trung bình của lớp đạt ${avgCl}%`;
    clText += lowClCount>0 ? `, trong đó có ${lowClCount} học sinh hoàn thành dưới 60% số bài được giao, cần được nhắc nhở thêm.` : '.';
  }

  // So sánh buổi gần nhất với buổi liền trước — nói rõ % chuyên cần thay đổi ra sao
  let compareText = '';
  if(sessions.length>=2){
    const studentIds = students.map(s=>s.id);
    const last = sessions[sessions.length-1], prev = sessions[sessions.length-2];
    const lastAtt = sessionAttendanceRate(last, studentIds);
    const prevAtt = sessionAttendanceRate(prev, studentIds);
    if(lastAtt!==null && prevAtt!==null){
      const d = lastAtt-prevAtt;
      if(d>0) compareText = `So với buổi trước (${fmtDateVN(prev.date)}), chuyên cần buổi gần nhất (${fmtDateVN(last.date)}) tăng ${d}%, từ ${prevAtt}% lên ${lastAtt}%.`;
      else if(d<0) compareText = `So với buổi trước (${fmtDateVN(prev.date)}), chuyên cần buổi gần nhất (${fmtDateVN(last.date)}) giảm ${Math.abs(d)}%, từ ${prevAtt}% xuống ${lastAtt}%.`;
      else compareText = `Chuyên cần buổi gần nhất (${fmtDateVN(last.date)}) giữ nguyên ở mức ${lastAtt}% so với buổi trước.`;
    }
  }

  return [attendText, compareText, trendText, clText, warnText].filter(Boolean).join(' ');
}

function trendArrow(d){ if(d===null||d===undefined) return ''; if(d>0) return '▲ '; if(d<0) return '▼ '; return '● '; }
function trendColor(d){ return d===null||d===undefined ? 'var(--ink-soft)' : (d>0 ? 'var(--success)' : (d<0 ? 'var(--danger)' : 'var(--ink-soft)')); }

function renderClassReportBody(classId){
  const cls = getClass(classId);
  const students = cls.students;
  const studentIds = students.map(s=>s.id);
  const sessions = getSessions(classId);
  const perSession = sessions.map(s=>({date:s.date, avg: sessionClassAvg(s, studentIds)})).filter(x=>x.avg!==null);
  const rates = students.map(s=>studentAttendanceStats(classId,s.id).rate).filter(r=>r!==null);
  const avgRate = rates.length? Math.round(rates.reduce((a,b)=>a+b,0)/rates.length) : null;
  const allAvgs = students.map(s=>{
    const series = studentScoreSeries(classId, s.id);
    return series.length? series.reduce((a,b)=>a+b.score,0)/series.length : null;
  });
  const validAvgs = allAvgs.filter(v=>v!==null);
  const classAvg = validAvgs.length? validAvgs.reduce((a,b)=>a+b,0)/validAvgs.length : null;
  const warns = getWarnings(classId);
  const warnMap = {}; warns.forEach(w=>{ warnMap[w.studentId] = warnMap[w.studentId]? warnMap[w.studentId]+', '+ (w.type==='absence'?'vắng liên tiếp':'điểm giảm dần') : (w.type==='absence'?'vắng liên tiếp':'điểm giảm dần'); });
  const checklistStats = students.map(s=>studentChecklistStats(classId, s.id));
  const validCl = checklistStats.filter(c=>c.rate!==null);
  const avgChecklist = validCl.length? Math.round(validCl.reduce((a,b)=>a+b.rate,0)/validCl.length) : null;

  const chartSvg = perSession.length ? lineChartSVG(perSession.map(p=>fmtDateVN(p.date)), [{name:'Trung bình lớp', color:'var(--accent-deep)', values:perSession.map(p=>p.avg)}]) : `<div class="muted">Chưa có dữ liệu điểm để vẽ biểu đồ.</div>`;

  // Bảng lịch sử: mỗi buổi so với đúng buổi liền trước nó (mới nhất lên đầu)
  const historyRows = sessions.map((s,i)=>{
    const prev = i>0 ? sessions[i-1] : null;
    const avg = sessionClassAvg(s, studentIds);
    const prevAvg = prev ? sessionClassAvg(prev, studentIds) : null;
    const att = sessionAttendanceRate(s, studentIds);
    const prevAtt = prev ? sessionAttendanceRate(prev, studentIds) : null;
    const hw = sessionChecklistRate(s, studentIds);
    const prevHw = prev ? sessionChecklistRate(prev, studentIds) : null;
    return {
      date: s.date,
      avg, dAvg: (avg!==null && prevAvg!==null) ? avg-prevAvg : null,
      att, dAtt: (att!==null && prevAtt!==null) ? att-prevAtt : null,
      hw, dHw: (hw!==null && prevHw!==null) ? hw-prevHw : null,
    };
  }).reverse();
  const historyShown = historyRows.slice(0, 12);

  const lastRow = historyRows[0] || null;
  const prevRow = historyRows[1] || null;

  return `
    <div class="report-header">
      <div>
        <h2>Báo cáo tình hình học tập — Cả lớp</h2>
        <div class="muted">Lớp: ${esc(cls.name)} · Ngày xuất: ${fmtDateVN(todayISO())} · ${sessions.length} buổi học đã ghi nhận</div>
      </div>
    </div>

    <div class="grid-4" style="margin-bottom:18px;">
      <div class="stat-box"><div class="stat-num">${students.length}</div><div class="stat-label">Học sinh</div></div>
      <div class="stat-box"><div class="stat-num">${avgRate!==null? avgRate+'%':'—'}</div><div class="stat-label">Chuyên cần TB lớp (toàn bộ)</div></div>
      <div class="stat-box"><div class="stat-num">${classAvg!==null? classAvg.toFixed(1):'—'}</div><div class="stat-label">Điểm TB lớp (toàn bộ)</div></div>
      <div class="stat-box"><div class="stat-num">${avgChecklist!==null? avgChecklist+'%':'—'}</div><div class="stat-label">Hoàn thành BT TB lớp (toàn bộ)</div></div>
    </div>

    ${lastRow ? `
    <h3 style="font-size:16.5px;margin-bottom:10px;">🔍 Buổi gần nhất (${fmtDateVN(lastRow.date)}) so với buổi trước${prevRow? ' ('+fmtDateVN(prevRow.date)+')' : ''}</h3>
    <table style="margin-bottom:22px;">
      <thead><tr><th>Chỉ số</th><th style="text-align:center;">Buổi trước</th><th style="text-align:center;">Buổi này</th><th style="text-align:center;">Thay đổi</th></tr></thead>
      <tbody>
        <tr class="ledger">
          <td>Điểm trung bình lớp</td>
          <td class="mono" style="text-align:center;">${prevRow && prevRow.avg!==null? prevRow.avg.toFixed(1) : '—'}</td>
          <td class="mono" style="text-align:center;font-weight:700;">${lastRow.avg!==null? lastRow.avg.toFixed(1) : '—'}</td>
          <td class="mono" style="text-align:center;color:${trendColor(lastRow.dAvg)};">${trendArrow(lastRow.dAvg)}${lastRow.dAvg!==null? (lastRow.dAvg>=0?'+':'')+lastRow.dAvg.toFixed(1) : '—'}</td>
        </tr>
        <tr class="ledger">
          <td>Tỷ lệ chuyên cần</td>
          <td class="mono" style="text-align:center;">${prevRow && prevRow.att!==null? prevRow.att+'%' : '—'}</td>
          <td class="mono" style="text-align:center;font-weight:700;">${lastRow.att!==null? lastRow.att+'%' : '—'}</td>
          <td class="mono" style="text-align:center;color:${trendColor(lastRow.dAtt)};">${trendArrow(lastRow.dAtt)}${lastRow.dAtt!==null? (lastRow.dAtt>=0?'+':'')+lastRow.dAtt+'%' : '—'}</td>
        </tr>
        <tr class="ledger">
          <td>Tỷ lệ hoàn thành bài tập</td>
          <td class="mono" style="text-align:center;">${prevRow && prevRow.hw!==null? prevRow.hw+'%' : '—'}</td>
          <td class="mono" style="text-align:center;font-weight:700;">${lastRow.hw!==null? lastRow.hw+'%' : '—'}</td>
          <td class="mono" style="text-align:center;color:${trendColor(lastRow.dHw)};">${trendArrow(lastRow.dHw)}${lastRow.dHw!==null? (lastRow.dHw>=0?'+':'')+lastRow.dHw+'%' : '—'}</td>
        </tr>
      </tbody>
    </table>` : ''}

    <h3 style="font-size:16.5px;margin-bottom:10px;">📈 Biến động qua từng buổi ${historyRows.length>12? '<span class="tiny">(12 buổi gần nhất)</span>':''}</h3>
    <table style="margin-bottom:22px;">
      <thead><tr><th>Ngày</th><th style="text-align:center;">Điểm TB</th><th style="text-align:center;">Δ điểm</th><th style="text-align:center;">Chuyên cần</th><th style="text-align:center;">Δ chuyên cần</th><th style="text-align:center;">Hoàn thành BT</th><th style="text-align:center;">Δ BT</th></tr></thead>
      <tbody>
      ${historyShown.map(r=>`
        <tr class="ledger">
          <td>${fmtDateVN(r.date)}</td>
          <td class="mono" style="text-align:center;">${r.avg!==null? r.avg.toFixed(1) : '—'}</td>
          <td class="mono" style="text-align:center;color:${trendColor(r.dAvg)};">${r.dAvg!==null? trendArrow(r.dAvg)+(r.dAvg>=0?'+':'')+r.dAvg.toFixed(1) : '—'}</td>
          <td class="mono" style="text-align:center;">${r.att!==null? r.att+'%' : '—'}</td>
          <td class="mono" style="text-align:center;color:${trendColor(r.dAtt)};">${r.dAtt!==null? trendArrow(r.dAtt)+(r.dAtt>=0?'+':'')+r.dAtt+'%' : '—'}</td>
          <td class="mono" style="text-align:center;">${r.hw!==null? r.hw+'%' : '—'}</td>
          <td class="mono" style="text-align:center;color:${trendColor(r.dHw)};">${r.dHw!==null? trendArrow(r.dHw)+(r.dHw>=0?'+':'')+r.dHw+'%' : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>

    <h3 style="font-size:16.5px;margin-bottom:10px;">Diễn biến điểm trung bình của lớp</h3>
    <div style="margin-bottom:18px;">${chartSvg}</div>

    <h3 style="font-size:16.5px;margin-bottom:10px;">Tổng hợp theo học sinh (toàn bộ)</h3>
    <table style="margin-bottom:18px;"><thead><tr><th>Học sinh</th><th>Chuyên cần</th><th>Điểm TB</th><th>So với TB lớp</th><th>Hoàn thành BT</th><th>Ghi chú</th></tr></thead><tbody>
    ${students.map((s,i)=>{
      const att = studentAttendanceStats(classId, s.id);
      const series = studentScoreSeries(classId, s.id);
      const avg = series.length? series.reduce((a,b)=>a+b.score,0)/series.length : null;
      const diff = (avg!==null && classAvg!==null) ? avg-classAvg : null;
      const cl = checklistStats[i];
      return `<tr class="ledger ${warnMap[s.id]?'flagged':''}">
        <td>${esc(s.name)}</td>
        <td class="mono">${att.rate!==null?att.rate+'%':'—'}</td>
        <td class="mono">${avg!==null?avg.toFixed(1):'—'}</td>
        <td class="mono">${diff!==null? (diff>=0?'+':'')+diff.toFixed(1) : '—'}</td>
        <td class="mono">${cl.rate!==null?cl.rate+'%':'—'}</td>
        <td class="note-text">${esc(warnMap[s.id]||'')}</td>
      </tr>`;
    }).join('')}
    </tbody></table>

    <h3 style="font-size:16.5px;margin:18px 0 10px;">Nhận xét chung</h3>
    <div class="remark-box">${esc(generateClassRemark(classId))}</div>
  `;
}

function renderReport(){
  if(!state.classes.length) return `<div class="topbar"><h1 class="page-title">Báo cáo</h1></div><div class="card empty"><h3>Chưa có lớp học</h3></div>`;
  const classId = state.report.classId || state.currentClassId;
  const students = getStudents(classId);
  const mode = state.report.mode || 'student';
  const studentId = state.report.studentId || (students[0] && students[0].id);

  const classOptions = state.classes.map(c=>`<option value="${c.id}" ${c.id===classId?'selected':''}>${esc(c.name)}</option>`).join('');
  const studentOptions = students.map(s=>`<option value="${s.id}" ${s.id===studentId?'selected':''}>${esc(s.name)}</option>`).join('');

  const modeToggle = `<div class="tabs-sub no-print">
