function exportExamsExcel(classId, month){
  try{
    const cls = getClass(classId);
    if(!cls){ showToast('Không tìm thấy lớp để xuất.'); return; }
    const monthData = (cls.monthlyExams && cls.monthlyExams[month]) || {};
    const rows = [['Học sinh', ...EXAM_SUBJECTS.map(([,l])=>l), 'Điểm TB tháng']];
    cls.students.forEach(s=>{
      const rec = monthData[s.id] || {};
      const avg = studentExamAvg(rec);
      rows.push([s.name, ...EXAM_SUBJECTS.map(([k])=> (rec[k]!==undefined && rec[k]!==null) ? rec[k] : ''), avg!==null?avg.toFixed(1):'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, ('DiemKT-'+monthLabel(month)).slice(0,30));
    XLSX.writeFile(wb, `Diem-KT-thang-${cls.name.replace(/\s+/g,'_')}-${month}.xlsx`);
    showToast('Đã xuất bảng điểm kiểm tra tháng.');
  }catch(err){
    console.error('Lỗi xuất Excel điểm KT:', err);
    showToast('Không xuất được Excel — lỗi: ' + (err && err.message ? err.message : 'không rõ nguyên nhân') + '. Cô mở Console (F12) xem chi tiết giúp tôi nhé.', 6000);
  }
}

function buildExamReportPrompt(classId, month){
  const cls = getClass(classId);
  const monthData = (cls.monthlyExams && cls.monthlyExams[month]) || {};
  const prevMonth = prevMonthKey(month);
  const prevData = (cls.monthlyExams && cls.monthlyExams[prevMonth]) || {};

  const rows = cls.students.map(s=>{
    const rec = monthData[s.id] || {};
    return { name: s.name, rec, avg: studentExamAvg(rec), prevAvg: studentExamAvg(prevData[s.id] || {}) };
  });
  const withAvg = rows.filter(r=>r.avg!==null);
  const top5High = withAvg.slice().sort((a,b)=>b.avg-a.avg).slice(0,5);
  const top5Low = withAvg.slice().sort((a,b)=>a.avg-b.avg).slice(0,5);
  const deltas = rows.filter(r=>r.avg!==null && r.prevAvg!==null).map(r=>({...r, delta: r.avg-r.prevAvg}));
  const improved = deltas.slice().sort((a,b)=>b.delta-a.delta).filter(d=>d.delta>0).slice(0,5);
  const declined = deltas.slice().sort((a,b)=>a.delta-b.delta).filter(d=>d.delta<0).slice(0,5);

  const subjectStats = EXAM_SUBJECTS.map(([k,label])=>{
    const vals = cls.students.map(s=>{ const v=(monthData[s.id]||{})[k]; return (v!==undefined && v!==null && v!=='') ? Number(v) : null; }).filter(v=>v!==null);
    const avg = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    return {label, avg, count: vals.length};
  });

  const L = [];
  L.push('Bạn là trợ lý giúp giáo viên chủ nhiệm viết BÁO CÁO ĐẦY ĐỦ kết quả kiểm tra định kỳ hàng tháng, kèm nhận xét chuyên môn.');
  L.push('');
  L.push(`Lớp: ${cls.name}`);
  L.push(`Tháng: ${monthLabel(month)}`);
  L.push(`Giáo viên chủ nhiệm: ${state.teacherName || '(chưa nhập tên)'}`);
  L.push('');
  L.push('=== BẢNG ĐIỂM CHI TIẾT (Toán / Văn / Tiếng Anh / KHTN / Điểm TB) ===');
  rows.forEach(r=>{
    const cells = EXAM_SUBJECTS.map(([k])=> (r.rec[k]!==undefined && r.rec[k]!==null) ? r.rec[k] : '—');
    L.push(`- ${r.name}: ${cells.join(' / ')} — TB: ${r.avg!==null? r.avg.toFixed(1) : '—'}`);
  });
  L.push('');
  L.push('=== ĐIỂM TRUNG BÌNH TỪNG MÔN CỦA CẢ LỚP ===');
  subjectStats.forEach(s=> L.push(`- ${s.label}: ${s.avg!==null? s.avg.toFixed(1) : 'chưa có dữ liệu'} (${s.count} học sinh có điểm)`));
  L.push('');
  L.push('=== TOP 5 ĐIỂM CAO NHẤT ===');
  L.push(top5High.length ? top5High.map((r,i)=>`${i+1}. ${r.name} — ${r.avg.toFixed(1)}`).join('\n') : '(chưa đủ dữ liệu)');
  L.push('');
  L.push('=== TOP 5 ĐIỂM THẤP NHẤT ===');
  L.push(top5Low.length ? top5Low.map((r,i)=>`${i+1}. ${r.name} — ${r.avg.toFixed(1)}`).join('\n') : '(chưa đủ dữ liệu)');
  L.push('');
  L.push(`=== TIẾN BỘ VƯỢT BẬC (so với ${monthLabel(prevMonth)}) ===`);
  L.push(improved.length ? improved.map(r=>`- ${r.name}: ${r.prevAvg.toFixed(1)} → ${r.avg.toFixed(1)} (+${r.delta.toFixed(1)})`).join('\n') : '(chưa đủ dữ liệu 2 tháng liên tiếp để so sánh)');
  L.push('');
  L.push(`=== CẦN RÚT KINH NGHIỆM (so với ${monthLabel(prevMonth)}) ===`);
  L.push(declined.length ? declined.map(r=>`- ${r.name}: ${r.prevAvg.toFixed(1)} → ${r.avg.toFixed(1)} (${r.delta.toFixed(1)})`).join('\n') : '(chưa đủ dữ liệu 2 tháng liên tiếp để so sánh)');
  L.push('');
  L.push('=== YÊU CẦU ===');
  L.push('Hãy viết một BÁO CÁO ĐẦY ĐỦ dựa trên dữ liệu trên, gồm:');
  L.push('1. Tổng quan kết quả kiểm tra tháng (điểm trung bình chung, xu hướng so với tháng trước nếu có dữ liệu).');
  L.push('2. Nhận xét từng môn học — đặc biệt nêu rõ môn nào đang yếu/báo động, phân tích nguyên nhân có thể và đề xuất giải pháp cải thiện cụ thể.');
  L.push('3. Vinh danh học sinh đạt điểm cao và học sinh tiến bộ vượt bậc (nêu rõ tên).');
  L.push('4. Lưu ý về các học sinh điểm thấp hoặc bị giảm sút (nêu rõ tên), kèm đề xuất hướng hỗ trợ.');
  L.push('5. Kết luận và định hướng cho tháng tiếp theo.');
  L.push('Văn phong: chuyên nghiệp, khách quan, súc tích — phù hợp để báo cáo Ban giám hiệu hoặc trình bày trong buổi họp phụ huynh.');
  return L.join('\n');
}

/* ---- Đóng góp / Vi phạm: mỗi học sinh có 2 loại ghi nhận. Cả hai đều cộng/trừ vào điểm tổ ---- */
function studentMeritLog(st){
  const v = (st.violations||[]).map(x=>({...x, kind:'v', points: x.points!==undefined ? x.points : 5}));
  const c = (st.contributions||[]).map(x=>({...x, kind:'c', points: x.points!==undefined ? x.points : 5}));
  return v.concat(c).sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
}
function studentMeritTotals(st){
  const vp = (st.violations||[]).reduce((a,b)=> a+(b.points!==undefined?b.points:5), 0);
  const cp = (st.contributions||[]).reduce((a,b)=> a+(b.points!==undefined?b.points:5), 0);
  return {vCount:(st.violations||[]).length, cCount:(st.contributions||[]).length, vPoints:vp, cPoints:cp, net:cp-vp};
}

/* ---- Đóng góp / Vi phạm ---- */
function renderViolationsSection(classId, cls){
  const studentId = state.homeroom.violationStudentId;
  if(studentId){
    const st = cls.students.find(s=>s.id===studentId);

    const log = studentMeritLog(st);

/* ---- Trực nhật xoay vòng + Nhiệm vụ theo đợt ---- */
function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function weeksBetween(mondayA, mondayB){
  const a=new Date(mondayA+'T00:00:00'), b=new Date(mondayB+'T00:00:00');
  return Math.round((b-a)/(7*24*3600*1000));
}
function getDutyTurn(duty, forWeekMonday){
  if(!duty || !duty.order || !duty.order.length) return [];
  const startMonday = mondayOf(duty.startDate);
  const weeksElapsed = weeksBetween(startMonday, forWeekMonday);
  const groupSize = Math.max(1, duty.groupSize||1);
  const totalGroups = Math.ceil(duty.order.length/groupSize);
  const groupIndex = ((weeksElapsed % totalGroups)+totalGroups)%totalGroups;
  const startIdx = groupIndex*groupSize;
  return duty.order.slice(startIdx, startIdx+groupSize);
}

/* ---- Thi đua tổ/nhóm: hệ thống điểm theo tháng ---- */
function getTeamSettings(cls){
  const s = cls.teamSettings || {};
  return { baseScore: (typeof s.baseScore==='number')? s.baseScore : 60 };
}
// Các tháng có dữ liệu liên quan tới thi đua (vi phạm của thành viên, điều chỉnh thủ công) + luôn có tháng hiện tại
function getTeamMonthsAvailable(classId){
  const cls = getClass(classId);
  const keys = new Set([todayISO().slice(0,7)]);
  (cls.students||[]).forEach(s=> { (s.violations||[]).forEach(v=> keys.add(monthKey(v.date))); (s.contributions||[]).forEach(v=> keys.add(monthKey(v.date))); });
  (cls.teamScores||[]).forEach(e=> keys.add(monthKey(e.date)));
  return Array.from(keys).sort();
}
// Tính điểm 1 tổ trong 1 tháng: khởi điểm + điều chỉnh thủ công (thưởng/phạt) - (số vi phạm thành viên × điểm trừ/lỗi)
function computeTeamMonthScore(classId, teamId, monthKey_){
  const cls = getClass(classId);
  const settings = getTeamSettings(cls);
  const members = cls.students.filter(s=>s.teamId===teamId);
  let violationCount = 0, violationDeduction = 0;
  members.forEach(s=> (s.violations||[]).forEach(v=>{
    if(monthKey(v.date)===monthKey_){ violationCount++; violationDeduction += (v.points!==undefined ? v.points : 5); }
  }));
  let contribCount = 0, contribBonus = 0;
  members.forEach(s=> (s.contributions||[]).forEach(c=>{
    if(monthKey(c.date)===monthKey_){ contribCount++; contribBonus += (c.points!==undefined ? c.points : 5); }
  }));
  let activityBonus = 0, activityCount = 0;
  members.forEach(s=> (s.activities||[]).forEach(a=>{
    if(monthKey(a.date)===monthKey_){ activityCount++; activityBonus += (a.points!==undefined ? a.points : (a.level||0)); }
  }));
  const manualEntries = (cls.teamScores||[]).filter(e=> e.teamId===teamId && monthKey(e.date)===monthKey_);
  const manualBonus = manualEntries.filter(e=>e.points>0).reduce((a,b)=>a+b.points,0);
  const manualPenalty = manualEntries.filter(e=>e.points<0).reduce((a,b)=>a+Math.abs(b.points),0);
  const manualSum = manualBonus - manualPenalty;
  const totalBonus = manualBonus + activityBonus + contribBonus;
  const totalPenalty = violationDeduction + manualPenalty;
  const score = settings.baseScore + totalBonus - totalPenalty;
  return { score, base: settings.baseScore, violationCount, violationDeduction, contribCount, contribBonus, activityCount, activityBonus, manualSum, manualBonus, manualPenalty, totalBonus, totalPenalty, manualEntries };
}
// Học sinh "tích cực" trong tháng: tổng điểm cộng từ hoạt động phong trào trong tháng đạt ngưỡng
function isStudentActiveThisMonth(student, monthKey_){
  const acts = (student.activities||[]).filter(a=> monthKey(a.date)===monthKey_);
  if(!acts.length) return false;
  const total = acts.reduce((a,b)=>a+(b.points!==undefined?b.points:(b.level||0)),0);
  return total>=8;
}

function buildTeamRosterPrompt(classId, teamId, monthKey_){

  const result = computeTeamMonthScore(classId, teamId, monthKey_);

  const activeMembers = members.filter(m=>isStudentActiveThisMonth(m, monthKey_));
  const L = [];
  L.push('Bạn là trợ lý giúp giáo viên chủ nhiệm TỔNG KẾT THÀNH TÍCH THI ĐUA của 1 tổ trong tháng, để thông báo/tôn vinh trước lớp.');

  L.push(`Lớp: ${cls.name}`);
  L.push(`Tổ: ${team.name}`);

  L.push(`Điểm khởi điểm: ${result.base}`);
  L.push(`Điểm cộng: +${result.totalBonus} (trong đó ${result.contribCount} lượt đóng góp của học sinh +${result.contribBonus}, ${result.activityCount} lượt hoạt động phong trào +${result.activityBonus}, thưởng cả tổ +${result.manualBonus})`);
  L.push(`Điểm trừ (vi phạm + phạt): −${result.totalPenalty} (trong đó ${result.violationCount} lượt vi phạm)`);
  L.push(`Tổng điểm tháng này: ${result.score}`);
  L.push(`So với tháng trước (${prevResult.score}): ${result.score-prevResult.score>=0?'+':''}${result.score-prevResult.score}`);
  L.push('');
  L.push('=== THÀNH VIÊN ===');
  if(members.length){
    members.forEach(m=> L.push(`- ${m.name}${isStudentActiveThisMonth(m, monthKey_) ? ' ⭐ (tích cực trong tháng)' : ''}`));
  } else {
    L.push('(Chưa có học sinh nào trong tổ)');
  }
  L.push('');
  L.push('=== YÊU CẦU ===');
  L.push('Hãy soạn một BẢN TỔNG KẾT THÀNH TÍCH của tổ trong tháng, gồm:');
  L.push('1. Nhận xét ngắn gọn về kết quả thi đua tháng này (tiến bộ hay đi xuống so với tháng trước, nguyên nhân chính nếu có từ số liệu vi phạm/thưởng).');
  L.push(`2. Nêu bật và khen ngợi các thành viên có đánh dấu ⭐ (tích cực trong tháng)${activeMembers.length? ': '+activeMembers.map(m=>m.name).join(', ') : ''}.`);
  L.push('3. Một vài lời động viên để tổ cố gắng hơn (hoặc giữ vững phong độ) trong tháng tới.');
  L.push('4. Nếu tiện, có thể trình bày thêm dưới dạng hình ảnh/thẻ tổng kết trực quan, màu sắc tươi sáng, phù hợp dán trong lớp học THCS.');
  return L.join('\n');
}

function buildClassTeamsDiagramPrompt(classId, monthKey_){
  const cls = getClass(classId);
  const teams = cls.teams || [];
  if(!teams.length) return '';
  const results = teams.map(t=>({...t, cur: computeTeamMonthScore(classId, t.id, monthKey_)})).sort((a,b)=> b.cur.score-a.cur.score);
  const L = [];
  L.push('Bạn là trợ lý giúp giáo viên chủ nhiệm tạo SƠ ĐỒ NHÓM/TỔ trực quan cho CẢ LỚP (gộp tất cả các tổ trong 1 hình duy nhất), dùng để dán bảng tin lớp học.');
  L.push('');
  L.push(`Lớp: ${cls.name}`);
  L.push(`Tháng: ${monthLabel(monthKey_)}`);
  L.push(`Số tổ: ${teams.length}`);
  L.push('');
  L.push('=== DANH SÁCH CÁC TỔ (đã xếp theo điểm thi đua từ cao xuống thấp) ===');
  results.forEach((t,i)=>{
    const members = cls.students.filter(s=>s.teamId===t.id);
    L.push(`${i+1}. ${t.name} — Điểm thi đua tháng: ${t.cur.score}`);
    if(members.length){
      members.forEach(m=> L.push(`   - ${m.name}${isStudentActiveThisMonth(m, monthKey_) ? ' ⭐' : ''}`));
    } else {
      L.push('   (chưa có học sinh)');
    }
  });
  L.push('');
  L.push('=== YÊU CẦU ===');
  L.push('Hãy thiết kế MỘT hình ảnh sơ đồ duy nhất thể hiện TẤT CẢ các tổ của lớp cùng lúc, gồm:');
  L.push('1. Tiêu đề: tên lớp + tháng.');
  L.push('2. Mỗi tổ là 1 khối/cột riêng biệt, có tên tổ, điểm thi đua tháng, và danh sách đầy đủ thành viên trong khối đó.');
  L.push('3. Học sinh có đánh dấu ⭐ thì làm nổi bật hơn (khung/màu khác) để tôn vinh sự tích cực.');
  L.push('4. Tổ đang xếp hạng cao nhất có thể làm nổi bật hơn (VD thêm huy chương/vương miện nhỏ).');
  L.push('5. Phong cách tươi sáng, vui vẻ, bố cục rõ ràng dễ đọc, phù hợp in/dán trong lớp học THCS.');
  return L.join('\n');
}

function buildTeamsMonthReportPrompt(classId, monthKey_){
  const cls = getClass(classId);
  const teams = cls.teams || [];
  if(!teams.length) return '';
  const settings = getTeamSettings(cls);
  const prevMonth_ = prevMonthKey(monthKey_);
  const hasPrevData = getTeamMonthsAvailable(classId).includes(prevMonth_);
  const results = teams.map(t=>{
    const cur = computeTeamMonthScore(classId, t.id, monthKey_);
    const prev = computeTeamMonthScore(classId, t.id, prevMonth_);
    return { ...t, cur, prev, delta: hasPrevData ? cur.score - prev.score : null };
  }).sort((a,b)=> b.cur.score - a.cur.score);

  const L = [];
  L.push('Bạn là trợ lý giúp giáo viên chủ nhiệm viết BÁO CÁO TỔNG KẾT THI ĐUA TỔ/NHÓM trong tháng, để thông báo trước lớp hoặc gửi cho Ban giám hiệu/phụ huynh.');
  L.push('');
  L.push(`Lớp: ${cls.name}`);
  L.push(`Tháng: ${monthLabel(monthKey_)}`);
  L.push(`Điểm khởi điểm mỗi tổ / tháng: ${settings.baseScore}`);
  L.push(`Số tổ: ${teams.length}`);
  L.push('');
  L.push('=== BẢNG TỔNG KẾT THEO TỔ (đã xếp hạng theo điểm từ cao xuống thấp) ===');
  results.forEach((t,i)=>{
    const deltaText = t.delta===null ? 'chưa có dữ liệu tháng trước' : `${t.delta>=0?'+':''}${t.delta} so với tháng trước`;
    L.push(`${i+1}. ${t.name} — Điểm cuối tháng: ${t.cur.score} (${deltaText})`);
    L.push(`   + Điểm cộng: +${t.cur.totalBonus} (đóng góp học sinh: ${t.cur.contribCount} lượt / +${t.cur.contribBonus}; hoạt động phong trào: ${t.cur.activityCount} lượt / +${t.cur.activityBonus}; thưởng cả tổ: +${t.cur.manualBonus})`);
    L.push(`   − Điểm trừ: −${t.cur.totalPenalty} (vi phạm: ${t.cur.violationCount} lỗi / −${t.cur.violationDeduction}; phạt thủ công: −${t.cur.manualPenalty})`);
  });
  L.push('');
  L.push('=== YÊU CẦU ===');
  L.push('Hãy viết một BẢN BÁO CÁO TỔNG KẾT THI ĐUA TỔ/NHÓM của lớp trong tháng, gồm:');
  L.push('1. Bảng xếp hạng đầy đủ các tổ (thứ hạng, điểm, điểm cộng, điểm trừ, số lỗi vi phạm) trình bày rõ ràng, dễ đọc.');
  L.push('2. Nhận xét chung về tình hình thi đua tháng này (tổ nào tiến bộ/đi xuống rõ rệt so với tháng trước, xu hướng chung của cả lớp).');
  L.push('3. Khen ngợi tổ dẫn đầu và nêu điểm mạnh; nhắc nhở nhẹ nhàng, mang tính xây dựng với (các) tổ xếp cuối.');
  L.push('4. Một vài định hướng/lời động viên chung để các tổ cố gắng hơn trong tháng tới.');
  L.push('5. Văn phong ngắn gọn, mạch lạc, phù hợp để đọc trước lớp hoặc gửi qua nhóm Zalo phụ huynh.');
  return L.join('\n');
}

/* ---- Chỗ ngồi ---- */
const SEATING_ZONES = 3, SEATING_ROWS = 6, SEATING_SEATS = 3;

function seatKey(z,r,s){ return `${z}-${r}-${s}`; }

function renderSeatingSection(classId, cls){
  const seating = cls.seating || {assignments:{}};
  const assignments = seating.assignments || {};
  const nameOf = id => { const s = cls.students.find(x=>x.id===id); return s ? s.name : ''; };

  const assignedIds = Object.values(assignments).filter(Boolean);
  const assignedCount = {};
  assignedIds.forEach(id=>{ assignedCount[id] = (assignedCount[id]||0)+1; });
  const duplicateIds = new Set(Object.keys(assignedCount).filter(id=>assignedCount[id]>1));
  const unassigned = cls.students.filter(s=>!assignedIds.includes(s.id));

  let zonesHtml = '';
  for(let z=1; z<=SEATING_ZONES; z++){
    let rowsHtml = '';
    for(let r=1; r<=SEATING_ROWS; r++){
      let seatsHtml = '';
      for(let s=1; s<=SEATING_SEATS; s++){
        const key = seatKey(z,r,s);
        const studentId = assignments[key] || '';
        const isDup = studentId && duplicateIds.has(studentId);
        seatsHtml += `
          <select data-action="set-seat" data-class="${classId}" data-seat="${key}" style="width:100%;font-size:13.5px;padding:6px 6px;${isDup?'border-color:var(--danger);':''}">
            <option value="">— Trống —</option>
            ${cls.students.map(st=>`<option value="${st.id}" ${studentId===st.id?'selected':''}>${esc(st.name)}</option>`).join('')}
          </select>`;
      }
      rowsHtml += `<div style="display:grid;grid-template-columns:repeat(${SEATING_SEATS},1fr);gap:6px;margin-bottom:6px;padding:8px;background:var(--surface-alt);border-radius:8px;">
        <div class="tiny" style="grid-column:1/-1;color:var(--ink-faint);">Dãy ${r}</div>
        ${seatsHtml}
      </div>`;
    }
    zonesHtml += `
      <div style="flex:1;min-width:210px;">
        <div style="text-align:center;font-weight:700;font-family:'Baloo 2',sans-serif;font-size:16px;margin-bottom:10px;color:var(--accent-deep);">🪑 Tổ ${z}</div>
        ${rowsHtml}
      </div>`;
  }

  return `
    <div class="card">
      <div class="card-title">
        <span>🪑 Sơ đồ chỗ ngồi</span>
        <button class="btn btn-outline" data-action="generate-seating-prompt" data-class="${classId}">✨ Tạo prompt minh hoạ</button>
      </div>
      <div class="muted" style="margin-bottom:12px;">Bố cục: 3 tổ — mỗi tổ 6 dãy bàn — mỗi bàn 3 học sinh (tối đa 54 chỗ). Dãy 1 gần bảng nhất.</div>
      <div style="text-align:center; background:var(--ink); color:#fff; border-radius:8px; padding:8px; margin-bottom:16px; font-family:'Baloo 2',sans-serif; font-weight:700; letter-spacing:.05em;">🖊️ BẢNG</div>
      <div style="display:flex; gap:16px; flex-wrap:wrap;">
        ${zonesHtml}
      </div>
      ${duplicateIds.size ? `<div class="tiny" style="color:var(--danger); margin-top:10px;">⚠ Có học sinh đang được xếp trùng nhiều hơn 1 chỗ — ô viền đỏ.</div>` : ''}
      ${unassigned.length ? `<div class="tiny" style="margin-top:10px;">Chưa xếp chỗ: ${unassigned.map(s=>esc(s.name)).join(', ')}</div>` : ''}
    </div>

    ${state.seating.prompt ? `
    <div class="card">
      <div class="card-title">
        <span>📝 Prompt minh hoạ chỗ ngồi</span>
        <button class="btn btn-outline btn-sm" data-action="copy-seating-prompt">💬 Copy prompt</button>
      </div>
      <div class="muted" style="margin-bottom:8px;">Dán prompt này vào ChatGPT/Claude/Gemini... để tạo hình minh hoạ sơ đồ chỗ ngồi.</div>
      <textarea id="seating-prompt-text" rows="14">${esc(state.seating.prompt)}</textarea>
    </div>` : ''}
  `;
}

function buildSeatingPrompt(classId){
  const cls = getClass(classId);
  if(!cls) return '';
  const seating = cls.seating || {assignments:{}};
  const assignments = seating.assignments || {};
  const nameOf = id => { const s = cls.students.find(x=>x.id===id); return s ? s.name : '(trống)'; };

  const L = [];
  L.push('Bạn là trợ lý giúp giáo viên minh hoạ trực quan SƠ ĐỒ CHỖ NGỒI của lớp học.');
  L.push('');
  L.push(`Lớp: ${cls.name}`);
  L.push('Bố cục lớp: 3 tổ, mỗi tổ có 6 dãy bàn, mỗi bàn ngồi 3 học sinh (tổng tối đa 54 chỗ).');
  L.push('Hướng nhìn: từ vị trí giáo viên đứng trên bảng nhìn xuống lớp — Tổ 1 bên trái, Tổ 2 ở giữa, Tổ 3 bên phải. Dãy bàn 1 gần bảng nhất, dãy 6 xa bảng nhất.');
  L.push('');
  L.push('=== SƠ ĐỒ CHỖ NGỒI HIỆN TẠI ===');
  for(let z=1; z<=SEATING_ZONES; z++){
    L.push(`Tổ ${z}:`);
    for(let r=1; r<=SEATING_ROWS; r++){
      const seats = [];
      for(let s=1; s<=SEATING_SEATS; s++){
        const sid = assignments[seatKey(z,r,s)];
        seats.push(sid ? nameOf(sid) : '(trống)');
      }
      L.push(`  Dãy ${r}: ${seats.join(' | ')}`);
    }
  }
  L.push('');
  L.push('=== YÊU CẦU ===');
  L.push('Hãy vẽ/minh hoạ lại sơ đồ chỗ ngồi này dưới dạng hình ảnh trực quan (sơ đồ lớp học nhìn từ trên xuống), thể hiện rõ:');
  L.push('1. Vị trí bảng ở phía trên cùng.');
  L.push('2. 3 tổ, mỗi tổ 6 dãy bàn, mỗi bàn 3 học sinh, đúng tên từng em theo sơ đồ trên.');
  L.push('3. Trình bày dạng lưới/bảng rõ ràng, dễ nhìn, đẹp mắt, phù hợp để in dán trong lớp học.');
  return L.join('\n');
}

  homework:   {icon:'📝', label:'Hoàn thành bài tập tốt'},
  conduct:    {icon:'🌟', label:'Hạnh kiểm Tốt'},
  activity:   {icon:'🙌', label:'Tích cực hoạt động phong trào'},
};
const HONOR_SEMESTER_ORDER = ['hk1','hk2','he'];

function avgExamOfMonths(cls, studentId, months){
  const vals = months.map(m => studentExamAvg((cls.monthlyExams && cls.monthlyExams[m] && cls.monthlyExams[m][studentId]) || {})).filter(v=>v!==null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

function computeHonorCandidates(classId, period, key, criteria, thresholds){
  const cls = getClass(classId);
  const sessions = period==='month' ? getSessions(classId).filter(s=>monthKey(s.date)===key) : getSessions(classId).filter(s=>getSemesterKey(s.date)===key);
  const results = [];

  cls.students.forEach(st=>{
    const badges = [];
    const details = {};

    if(criteria.score){
      let avg = null;
      if(period==='month'){
        avg = studentExamAvg((cls.monthlyExams && cls.monthlyExams[key] && cls.monthlyExams[key][st.id]) || {});
      } else {
        const monthsInSem = Object.keys(cls.monthlyExams||{}).filter(m=>getSemesterKey(m)===key);
        avg = avgExamOfMonths(cls, st.id, monthsInSem);
      }
      details.score = avg;
      if(avg!==null && avg>=thresholds.score) badges.push('score');
    }

    if(criteria.improve){
      let curAvg=null, prevAvg=null;
      if(period==='month'){
        curAvg = studentExamAvg((cls.monthlyExams && cls.monthlyExams[key] && cls.monthlyExams[key][st.id]) || {});
        const pm = prevMonthKey(key);
        prevAvg = studentExamAvg((cls.monthlyExams && cls.monthlyExams[pm] && cls.monthlyExams[pm][st.id]) || {});
      } else {
        const idx = HONOR_SEMESTER_ORDER.indexOf(key);
        const prevSem = idx>0 ? HONOR_SEMESTER_ORDER[idx-1] : null;
        const curMonths = Object.keys(cls.monthlyExams||{}).filter(m=>getSemesterKey(m)===key);
        curAvg = avgExamOfMonths(cls, st.id, curMonths);
        if(prevSem){
          const prevMonths = Object.keys(cls.monthlyExams||{}).filter(m=>getSemesterKey(m)===prevSem);
          prevAvg = avgExamOfMonths(cls, st.id, prevMonths);
        }
      }
      const delta = (curAvg!==null && prevAvg!==null) ? curAvg-prevAvg : null;
      details.improve = delta;
      if(delta!==null && delta>=thresholds.improve) badges.push('improve');
    }

    if(criteria.attendance){
      const att = attendanceFromSessions(sessions, st.id);
      details.attendance = att.rate;
      if(att.rate!==null && att.rate>=thresholds.attendance) badges.push('attendance');
    }

    if(criteria.homework){
      const cl = checklistFromSessions(sessions, st.id);
      details.homework = cl.rate;
      if(cl.rate!==null && cl.rate>=thresholds.homework) badges.push('homework');
    }

    if(criteria.conduct){
      const monthsToCheck = period==='month' ? [key] : getClassMonths(classId).filter(m=>getSemesterKey(m)===key);
      let allTot = monthsToCheck.length>0;
      monthsToCheck.forEach(m=>{
        const saved = (cls.conduct && cls.conduct[m] && cls.conduct[m][st.id]) || {};
        const rating = saved.rating || conductSuggestion(classId, m, st.id).rating;
        if(rating!=='tot') allTot = false;
      });
      details.conduct = monthsToCheck.length ? allTot : null;
      if(monthsToCheck.length && allTot) badges.push('conduct');
    }

    if(criteria.activity){
      const acts = (st.activities||[]).filter(a => period==='month' ? monthKey(a.date)===key : getSemesterKey(a.date)===key);
      const totalPoints = acts.length ? acts.reduce((a,b)=>a+(b.points!==undefined?b.points:(b.level||0)),0) : null;
      details.activity = {totalPoints, count:acts.length};
      if(acts.length>=thresholds.activityMinCount && totalPoints!==null && totalPoints>=thresholds.activityLevel) badges.push('activity');
    }

    if(badges.length){
      results.push({student:st, badges, details});
    }
  });

  return results;
}

  const cls = getClass(classId);
  const st = cls.students.find(s=>s.id===studentId);
  if(!st) return '';
  const result = computeHonorCandidates(classId, period, key, state.honors.criteria, state.honors.thresholds).find(r=>r.student.id===studentId);

    const info = HONOR_BADGES[b];

  const L = [];

  L.push('');
  L.push('=== YÊU CẦU ===');
  L.push('Hãy soạn một GIẤY KHEN hoàn chỉnh, trang trọng, gồm:');
  L.push('1. Tiêu đề "GIẤY KHEN" và tên danh hiệu cụ thể (nếu đạt từ 3 tiêu chí trở lên, có thể gộp thành danh hiệu tổng hợp, ví dụ "Học sinh xuất sắc toàn diện").');
  L.push(`2. Nội dung: "Giáo viên chủ nhiệm lớp ${cls.name} khen tặng em ${st.name}..." nêu rõ lý do dựa trên số liệu ở trên.`);
  L.push('3. Ngày tháng, chữ ký giáo viên chủ nhiệm.');
  L.push('4. Gợi ý icon trang trí phù hợp theo danh hiệu đạt được, và bảng màu tươi sáng, trang trọng.');
  L.push('Văn phong: trang trọng nhưng gần gũi, phù hợp học sinh THCS.');
  return L.join('\n');
}

const RISK_BADGES = {
  lowScore:   {icon:'📉', label:'Điểm số thấp'},
  declining:  {icon:'📊', label:'Điểm giảm dần'},
  attendance: {icon:'📅', label:'Chuyên cần kém'},
  homework:   {icon:'📝', label:'Bài tập không hoàn thành'},
  violations: {icon:'⚠',  label:'Vi phạm nội quy nhiều'},
  conduct:    {icon:'🌟', label:'Hạnh kiểm chưa tốt'},
  punishment: {icon:'📌', label:'Chép phạt lặp lại'},
};

function latestExamMonth(cls){ const months = Object.keys(cls.monthlyExams||{}).sort(); return months.length ? months[months.length-1] : null; }
function latestConductMonth(cls){ const months = Object.keys(cls.conduct||{}).sort(); return months.length ? months[months.length-1] : null; }

function riskLevelOf(count){
  if(count>=4) return {label:'Cao', color:'var(--danger)', icon:'🔴'};
  if(count>=2) return {label:'Trung bình', color:'#B8710A', icon:'🟠'};
  return {label:'Thấp', color:'#B79400', icon:'🟡'};
}

function computeRiskCandidates(classId, sessionCount, criteria, thresholds){
  const cls = getClass(classId);
  const allSessions = getSessions(classId);
  const recentSessions = allSessions.slice(-sessionCount);
  const since = recentSessions.length ? recentSessions[0].date : null;
  const examMonth = latestExamMonth(cls);
  const prevMonth = examMonth ? prevMonthKey(examMonth) : null;
  const conductMonth = latestConductMonth(cls) || getClassMonths(classId).slice(-1)[0];

  const results = [];
  cls.students.forEach(st=>{
    const badges = [], details = {};

    if(criteria.lowScore){
      const avg = examMonth ? studentExamAvg((cls.monthlyExams[examMonth]||{})[st.id]||{}) : null;
      details.lowScore = avg;
      if(avg!==null && avg<thresholds.lowScore) badges.push('lowScore');
    }
    if(criteria.declining){
      let cur=null, prev=null;
      if(examMonth) cur = studentExamAvg((cls.monthlyExams[examMonth]||{})[st.id]||{});
      if(prevMonth) prev = studentExamAvg((cls.monthlyExams[prevMonth]||{})[st.id]||{});
      const delta = (cur!==null && prev!==null) ? cur-prev : null;
      details.declining = delta;
      if(delta!==null && delta <= -thresholds.declineAmount) badges.push('declining');
    }
    if(criteria.attendance){
      const att = attendanceFromSessions(recentSessions, st.id);
      details.attendance = att.rate;
      if(att.rate!==null && att.rate<thresholds.attendance) badges.push('attendance');
    }
    if(criteria.homework){
      const hw = checklistFromSessions(recentSessions, st.id);
      details.homework = hw.rate;
      if(hw.rate!==null && hw.rate<thresholds.homework) badges.push('homework');
    }
    if(criteria.violations){
      const count = (st.violations||[]).filter(v=> !since || v.date>=since).length;
      details.violations = count;
      if(count>=thresholds.violationsCount) badges.push('violations');
    }
    if(criteria.conduct){
      if(conductMonth){
        const saved = (cls.conduct && cls.conduct[conductMonth] && cls.conduct[conductMonth][st.id]) || {};
        const rating = saved.rating || conductSuggestion(classId, conductMonth, st.id).rating;
        details.conduct = rating;
        if(rating==='yeu' || rating==='trungbinh') badges.push('conduct');
      } else details.conduct = null;
    }
    if(criteria.punishment){
      const count = recentSessions.filter(s=> s.punishmentAssigned && s.punishmentAssigned[st.id]).length;
      details.punishment = count;
      if(count>=thresholds.punishmentCount) badges.push('punishment');
    }

    if(badges.length){
      results.push({student:st, badges, details});
    }
  });

  results.sort((a,b)=> b.badges.length - a.badges.length);
  return results;
}

// Gom toàn bộ số liệu của 1 học sinh — dùng chung cho cả 3 loại prompt
function gatherRiskData(classId, studentId, sessionCount){
  const cls = getClass(classId);
  const st = cls.students.find(s=>s.id===studentId);
  const allSessions = getSessions(classId);
  const recentSessions = allSessions.slice(-sessionCount);
  const att = attendanceFromSessions(recentSessions, studentId);
  const hw = checklistFromSessions(recentSessions, studentId);
  const since = recentSessions.length ? recentSessions[0].date : null;
  const violList = (st.violations||[]).filter(v=> !since || v.date>=since);
  const punishCount = recentSessions.filter(s=> s.punishmentAssigned && s.punishmentAssigned[studentId]).length;
  const examMonth = latestExamMonth(cls);
  const examAvg = examMonth ? studentExamAvg((cls.monthlyExams[examMonth]||{})[studentId]||{}) : null;
  const prevMonth = examMonth ? prevMonthKey(examMonth) : null;
  const prevAvg = prevMonth ? studentExamAvg((cls.monthlyExams[prevMonth]||{})[studentId]||{}) : null;
  const conductMonth = latestConductMonth(cls) || getClassMonths(classId).slice(-1)[0];
  let conductRating = null;
  if(conductMonth){
    const saved = (cls.conduct && cls.conduct[conductMonth] && cls.conduct[conductMonth][studentId]) || {};
    conductRating = saved.rating || conductSuggestion(classId, conductMonth, studentId).rating;
  }
  const scoreSeries = recentSessions.map(s=>sessionScoreAvg(s, studentId)).filter(v=>v!==null);
  const sessionAvg = scoreSeries.length ? scoreSeries.reduce((a,b)=>a+b,0)/scoreSeries.length : null;
  const contactLog = (st.contactLog||[]).slice().sort((a,b)=> b.date.localeCompare(a.date));

  return {cls, st, recentSessions, att, hw, violList, punishCount, examMonth, examAvg, prevMonth, prevAvg, conductRating, sessionAvg, contactLog};
}

  L.push('');
  if(d.contactLog.length){
    L.push('=== LỊCH SỬ ĐÃ TRAO ĐỔI VỚI PHỤ HUYNH ===');
    d.contactLog.slice(0,5).forEach(c=> L.push(`- ${fmtDateVN(c.date)} (${c.method}): ${c.content}`));
  } else {
    L.push('=== LỊCH SỬ TRAO ĐỔI VỚI PHỤ HUYNH ===');
    L.push('Chưa có lần trao đổi nào được ghi nhận.');
  }
  return L;
}

function buildRiskParentPrompt(classId, studentId, sessionCount){

/* ============================================================
   SVG LINE CHART
============================================================ */
function resolveVar(v){
  if(typeof v==='string' && v.startsWith('var(')){
    const name = v.slice(4,-1).trim();
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#999';
  }
  return v;
}
function lineChartSVG(labels, series){
  const W = 760, H = 240, padL = 40, padR = 16, padT = 16, padB = 34;
  const allVals = [];
  series.forEach(s=> s.values.forEach(v=>{ if(v!==null && v!==undefined) allVals.push(v); }));
  if(!allVals.length) return `<div class="muted">Không đủ dữ liệu.</div>`;
  let min = Math.min(0, Math.min(...allVals));
  let max = Math.max(10, Math.max(...allVals));
  if(max===min) max = min+1;
  const n = labels.length;
  const x = i => padL + (n<=1? 0 : (i/(n-1))*(W-padL-padR));
  const y = v => H - padB - ((v-min)/(max-min))*(H-padT-padB);

  const gridLines = [];
  const steps = 4;
  for(let i=0;i<=steps;i++){
    const val = min + (max-min)*i/steps;
    const yy = y(val);
    gridLines.push(`<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="#E4DCC9" stroke-width="1"/>`);
    gridLines.push(`<text x="${padL-8}" y="${yy+3}" font-size="10" fill="#9AA7AC" text-anchor="end" font-family="IBM Plex Mono, monospace">${val.toFixed(1)}</text>`);
  }
  const xLabels = labels.map((l,i)=>{
    if(n>8 && i%Math.ceil(n/8)!==0 && i!==n-1) return '';
    return `<text x="${x(i)}" y="${H-12}" font-size="10" fill="#9AA7AC" text-anchor="middle" font-family="Roboto, sans-serif">${l}</text>`;
  }).join('');

  const lines = series.map(s=>{
    const color = resolveVar(s.color);
    let d = '';
    let started = false;
    const pts = [];
    s.values.forEach((v,i)=>{
      if(v===null || v===undefined){ started=false; return; }
      const cmd = started? 'L':'M';
      d += `${cmd}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
      started = true;
      pts.push(`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${color}"/>`);
    });
    const dashAttr = s.dash ? `stroke-dasharray="${s.dash}"` : '';
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" ${dashAttr} stroke-linecap="round" stroke-linejoin="round"/>` + pts.join('');
  }).join('');

  return `<svg class="chart-line" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:260px;">${gridLines.join('')}${lines}${xLabels}</svg>`;
}

function pieChartSVG(data, px){
  const size = 160, r = 70, cx = 80, cy = 80;
  const total = data.reduce((a,b)=>a+b.value,0);
  if(!total) return `<svg viewBox="0 0 ${size} ${size}" style="width:${px||140}px;height:${px||140}px;flex-shrink:0;"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#EFEAE0"/></svg>`;
  const toRad = a => (a*Math.PI/180);
  let angle = -90;
  const parts = data.filter(d=>d.value>0).map(d=>{
    const frac = d.value/total;
    const startAngle = angle;
    const endAngle = angle + frac*360;
    angle = endAngle;
    const color = resolveVar(d.color);
    if(frac >= 0.9999){
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
    }
    const large = (endAngle-startAngle) > 180 ? 1 : 0;
    const x1 = cx + r*Math.cos(toRad(startAngle));
    const y1 = cy + r*Math.sin(toRad(startAngle));
    const x2 = cx + r*Math.cos(toRad(endAngle));
    const y2 = cy + r*Math.sin(toRad(endAngle));
    return `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${px||140}px;height:${px||140}px;flex-shrink:0;">${parts}</svg>`;
}
function progressRingSVG(percent, opts){
  opts = opts || {};
  const size = opts.size || 132;
  const stroke = opts.stroke || 12;
  const color = resolveVar(opts.color || 'var(--accent)');
  const bg = '#EFEAE0';
  const r = (size - stroke)/2;
  const cx = size/2, cy = size/2;
  const circumference = 2*Math.PI*r;
  const pct = (percent===null || percent===undefined || isNaN(percent)) ? 0 : Math.max(0, Math.min(100, percent));
  const dash = circumference * pct/100;
  const mainText = opts.centerMain !== undefined ? opts.centerMain : `${Math.round(pct)}%`;
  const subText = opts.centerSub || '';
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0;">
    <svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;transform:rotate(-90deg);">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${bg}" stroke-width="${stroke}"/>
      ${pct>0 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${circumference.toFixed(1)}"/>` : ''}
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div style="font-size:${Math.round(size*0.19)}px;font-weight:800;color:var(--ink);line-height:1;">${esc(String(mainText))}</div>
      ${subText? `<div style="font-size:${Math.round(size*0.078)}px;color:var(--ink-soft);margin-top:4px;text-align:center;max-width:${size-20}px;">${esc(subText)}</div>` : ''}
    </div>
  </div>`;
}
// opts: {size: px của biểu đồ, stack: true = chú thích nằm dưới biểu đồ, pctFirst: true = in đậm % trước, số lượng trong ngoặc}
function pieChartWithLegend(data, opts){
  opts = opts || {};
  const total = data.reduce((a,b)=>a+b.value,0);
  const svg = pieChartSVG(data, opts.size);
  const legend = data.map(d=>{
    const pct = total? Math.round(d.value/total*100) : 0;
    const txt = opts.pctFirst
      ? `${esc(d.label)}: <strong>${pct}%</strong> <span style="color:var(--ink-faint);">(${d.value})</span>`
      : `${esc(d.label)}: <strong>${d.value}</strong>${total? ` (${pct}%)` : ''}`;
    return `<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px;">
      <span style="width:11px;height:11px;border-radius:3px;background:${resolveVar(d.color)};display:inline-block;flex-shrink:0;"></span>
      <span style="font-size:13.5px;">${txt}</span>
    </div>`;
  }).join('');
  return `<div style="display:flex; ${opts.stack ? 'flex-direction:column; align-items:center;' : 'align-items:center; flex-wrap:wrap;'} gap:${opts.stack ? 10 : 18}px;">
    ${svg}
    <div>${legend}</div>
  </div>`;
}
// Phân loại học lực theo thang 10: Giỏi ≥8 · Khá 6,5–<8 · TB 5–<6,5 · Yếu <5
function gradeBuckets(values){
  const b = [
    {label:'Giỏi', value:0, color:'#41BFB6'},
    {label:'Khá', value:0, color:'#5B8DEF'},
    {label:'TB', value:0, color:'#F2A93B'},
    {label:'Yếu', value:0, color:'#DC2626'},
  ];
  values.forEach(v=>{
    if(v>=8) b[0].value++;
    else if(v>=6.5) b[1].value++;
    else if(v>=5) b[2].value++;
    else b[3].value++;
  });
  return b;
}

function copyTextToClipboard(text){
  return new Promise((resolve)=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>resolve(true)).catch(()=>{
        resolve(fallbackCopy(text));
      });
    } else {
      resolve(fallbackCopy(text));
    }
  });
}
function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
async function copyZaloMessage(classId, studentId){
  const text = buildZaloMessage(classId, studentId);
  if(!text){ showToast('Chưa chọn được học sinh để tạo tin nhắn.'); return; }
  const ok = await copyTextToClipboard(text);
  if(ok){
    showToast('Đã copy tin nhắn — dán trực tiếp vào Zalo để gửi phụ huynh.', 3200);
  } else {
    openPromptModal('Copy tin nhắn Zalo', text, ()=>{}, {
      multiline:true,
      submitLabel:'Đóng',
      hint:'Trình duyệt chặn copy tự động — cô bôi đen (Ctrl+A) rồi Ctrl+C nội dung bên dưới nhé.'
    });
  }
}

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const isClassMode = state.report.mode === 'class';
  const cls = getClass(state.report.classId || state.currentClassId);
  const st = !isClassMode && cls ? cls.students.find(s=>s.id===(state.report.studentId)) : null;
  a.href = url;
  a.download = isClassMode
    ? `Bao-cao-lop-${(cls?cls.name:'lop').replace(/\s+/g,'_')}.doc`
    : `Bao-cao-${st? st.name.replace(/\s+/g,'_'):'hoc-sinh'}.doc`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Đã xuất file Word.');
}
function exportExcel(){
  try{
    const classId = state.attendance.classId || state.currentClassId;
    const cls = getClass(classId);
    if(!cls){ showToast('Chưa chọn được lớp để xuất — cô thử chọn lại lớp rồi bấm lại nhé.'); return; }
    const selectedMonth = state.attendance.month || 'all';
    const allSessions = getSessions(classId);
    const sessions = selectedMonth==='all' ? allSessions : allSessions.filter(s=>monthKey(s.date)===selectedMonth);
    if(!sessions.length){ showToast('Chưa có buổi học nào trong khoảng đang xem để xuất.'); return; }

    const dayHeaders = sessions.map(s=>fmtDateVN(s.date));
    const header = ['Học sinh', ...dayHeaders, 'Số buổi có dữ liệu', 'Có mặt', 'Vắng', 'Muộn', 'Tỷ lệ chuyên cần (%)'];
    const rows = [header];
    cls.students.forEach(s=>{
      const att = attendanceFromSessions(sessions, s.id);
      const dayCells = sessions.map(sess=>{
        const a = sess.attendance[s.id];
        if(a==='present') return 'X';
        if(a==='absent') return 'V';
        if(a==='late') return 'M';
        return '';
      });
      rows.push([s.name, ...dayCells, att.total, att.present, att.absent, att.late, att.rate!==null?att.rate:'']);
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    const sheetLabel = (selectedMonth==='all' ? 'Chuyen can' : monthLabel(selectedMonth)).slice(0,30);
    XLSX.utils.book_append_sheet(wb, ws, sheetLabel);

    // Thêm sheet chú thích ký hiệu cho dễ đọc
    const legendWs = XLSX.utils.aoa_to_sheet([
      ['Ký hiệu', 'Ý nghĩa'],
      ['X', 'Có mặt'],
      ['V', 'Vắng'],
      ['M', 'Muộn'],
      ['(để trống)', 'Chưa điểm danh buổi đó'],
    ]);
    XLSX.utils.book_append_sheet(wb, legendWs, 'Chú thích');

    const fileMonthPart = selectedMonth==='all' ? '' : `-${selectedMonth}`;
    XLSX.writeFile(wb, `Chuyen-can-${cls.name.replace(/\s+/g,'_')}${fileMonthPart}.xlsx`);
    showToast('Đã xuất file Excel.');
  }catch(err){
    console.error('Lỗi xuất Excel:', err);
    showToast('Không xuất được Excel — lỗi: ' + (err && err.message ? err.message : 'không rõ nguyên nhân') + '. Cô mở Console (F12) xem chi tiết giúp tôi nhé.', 6000);
  }
}

let toastTimer;
function showToast(msg, duration){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), duration || 2400);
}

/* ============================================================
   EVENT HANDLERS
============================================================ */
function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(elx=>{
    elx.addEventListener('click', ()=>{ state.tab = elx.dataset.nav; state.navOpen = false; render(); window.scrollTo(0,0); });
  });

  app.querySelectorAll('[data-action]').forEach(elx=>{
    const action = elx.dataset.action;
    const evt = (elx.tagName==='INPUT' || elx.tagName==='SELECT' || elx.tagName==='TEXTAREA') ?
      (elx.type==='text'||elx.type==='number'||elx.tagName==='TEXTAREA' ? 'change' : 'change') : 'click';
    elx.addEventListener(evt, (e)=> handleAction(action, elx, e));
    if((elx.tagName==='INPUT' && (elx.type==='text')) || elx.tagName==='TEXTAREA'){
      elx.addEventListener('blur', (e)=> handleAction(action, elx, e));
    }
  });

  // textarea/content fields with data-field
  app.querySelectorAll('[data-field]').forEach(elx=>{
    elx.addEventListener('change', ()=> handleFieldChange(elx));
    elx.addEventListener('blur', ()=> handleFieldChange(elx));
  });

  // cập nhật ngay hiển thị "x.x/10" khi gõ số câu đúng, và cập nhật luôn bảng Tổng kết buổi (Cao nhất/Thấp nhất/TB lớp) của đúng bài đó
  function recomputeExerciseSummary(exerciseId){
    const inputs = app.querySelectorAll('.score-input[data-exercise="'+exerciseId+'"]');
    const vals = [];
    inputs.forEach(inp=>{
      if(inp.value==='') return;
      if(inp.dataset.mode==='scale10'){ vals.push(clamp(Number(inp.value),0,10)); }
      else { const total = Number(inp.dataset.total)||10; vals.push(clamp(Number(inp.value),0,total)/total*10); }
    });
    const row = app.querySelector('[data-summary-exercise="'+exerciseId+'"]');
    if(!row) return;
    const maxEl = row.querySelector('.summary-max'), minEl = row.querySelector('.summary-min'), avgEl = row.querySelector('.summary-avg');
    if(maxEl) maxEl.textContent = vals.length ? Math.max(...vals).toFixed(1) : '—';
    if(minEl) minEl.textContent = vals.length ? Math.min(...vals).toFixed(1) : '—';
    if(avgEl) avgEl.textContent = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : '—';
  }
  app.querySelectorAll('.score-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      if(inp.dataset.mode!=='scale10'){
        const total = Number(inp.dataset.total) || 10;
        const span = inp.parentElement && inp.parentElement.querySelector('.score-computed');
        if(span){
          const val = inp.value;
          if(val===''){ span.textContent = '—'; }
          else { const c = clamp(Number(val), 0, total); span.textContent = ((c/total)*10).toFixed(1)+'/10'; }
        }
      }
      recomputeExerciseSummary(inp.dataset.exercise);
    });
  });

  // Sổ điểm: cập nhật ĐTB ngay khi gõ + Enter nhảy xuống ô cùng cột
  app.querySelectorAll('.gb-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const cls = getClass(inp.dataset.class);
      if(!cls) return;
      const r = gbRecord(cls, inp.dataset.student);
      const val = inp.value==='' ? null : clamp(Number(inp.value),0,10);
      if(inp.dataset.key==='hs1') r.hs1[Number(inp.dataset.idx)||0] = val;
      else r[inp.dataset.key] = val;
      updateGradebookDom(cls.id);
    });
    inp.addEventListener('keydown', (e)=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      const all = Array.from(app.querySelectorAll('.gb-input[data-col="'+inp.dataset.col+'"]'));
      const next = all[all.indexOf(inp)+1];
      if(next){ next.focus(); if(next.select) next.select(); } else { inp.blur(); }
    });
  });

  const exModeSel = app.querySelector('#new-exercise-mode');
  const exTotalInput = app.querySelector('#new-exercise-total');
  if(exModeSel && exTotalInput){
    const syncExMode = ()=>{ exTotalInput.style.display = exModeSel.value==='scale10' ? 'none' : ''; };
    syncExMode();
    exModeSel.addEventListener('change', syncExMode);
  }

  const modalInput = app.querySelector('#modal-input');
  if(modalInput){
    modalInput.addEventListener('keydown', (ev)=>{
      const isTextarea = modalInput.tagName==='TEXTAREA';
      if(ev.key==='Enter' && (!isTextarea || ev.ctrlKey || ev.metaKey)){
        ev.preventDefault(); const btn = app.querySelector('[data-action="modal-submit"]'); if(btn) btn.click();
      }
      if(ev.key==='Escape'){ ev.preventDefault(); closeModal(); }
    });
  }

  const search = app.querySelector('[data-action="progress-search"]');
  if(search){
    search.addEventListener('input', (e)=>{ state.progress.query = e.target.value; render(); setTimeout(()=>{ const i=app.querySelector('[data-action="progress-search"]'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });
  }
  const recSearch = app.querySelector('[data-action="records-search"]');
  if(recSearch){
    recSearch.addEventListener('input', (e)=>{ state.records.search = e.target.value; render(); setTimeout(()=>{ const i=app.querySelector('[data-action="records-search"]'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });
  }
  const globalSearchInput = app.querySelector('#global-student-search');
  if(globalSearchInput){
    globalSearchInput.addEventListener('input', (e)=>{ state.globalSearch = e.target.value; render(); setTimeout(()=>{ const i=app.querySelector('#global-student-search'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });
    globalSearchInput.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ state.globalSearch=''; render(); } });
  }
  const backupInput = app.querySelector('#backup-file-input');
  if(backupInput){
    backupInput.addEventListener('change', (e)=>{
      const file = e.target.files && e.target.files[0];
      if(file) importBackup(file);
      backupInput.value = '';
    });
  }

  // Enter để gửi nhanh: form ghi nhận vi phạm (ngày/điểm trừ/nội dung)
  ['violation-date','violation-points','violation-content'].forEach(id=>{
    const el = app.querySelector('#'+id);
    if(el){
      el.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const btn = app.querySelector('[data-action="add-violation"]');
          if(btn) btn.click();
        }
      });
    }
  });
  // Enter để gửi nhanh: form điều chỉnh điểm tổ (tổ/điểm/ngày/lý do)
  ['score-team-select','score-points','score-date','score-reason'].forEach(id=>{
    const el = app.querySelector('#'+id);
    if(el){
      el.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const btn = app.querySelector('[data-action="add-team-score"]');
          if(btn) btn.click();
        }
      });
    }
  });
}

function setNavOpen(open){
  state.navOpen = !!open;
  const sb = document.querySelector('.sidebar');
  if(sb) sb.classList.toggle('open', state.navOpen);
}
// bấm ra ngoài menu (hoặc chọn kết quả tìm kiếm) thì menu tự thu lại
document.addEventListener('click', (e)=>{
  if(!state.navOpen) return;
  const t = e.target;
  if(t.closest && t.closest('.global-search-item')){ setNavOpen(false); return; }

async function handleFieldChange(elx){
  const sess = ensureSessionEditable();
  sess[elx.dataset.field] = elx.value;
  saveSessions(state.currentClassId);
}

async function handleAction(action, elx, e){
  if(action.indexOf('gt-')===0){ GT.handle(action, elx, e); return; }
  switch(action){
    case 'toggle-nav': { setNavOpen(!state.navOpen); break; }
    case 'nav-search': { setNavOpen(true); setTimeout(()=>{ const i=document.getElementById('global-student-search'); if(i) i.focus(); }, 280); break; }
    case 'go-classes': state.tab='classes'; render(); break;
    case 'export-backup': exportBackup(); break;
    case 'trigger-backup-import': {
      const inp = document.getElementById('backup-file-input');
      if(inp) inp.click();
      break;
    }
    case 'goto-suggestion': {
      state.tab = elx.dataset.tab;
      if(elx.dataset.section){ state.homeroom.section = elx.dataset.section; }
      render();
      break;
    }
    case 'toggle-sync-panel': state.syncPanelOpen = !state.syncPanelOpen; render(); break;
    case 'save-firebase-config': {
      const ta = document.getElementById('firebase-config-input');
      const text = ta ? ta.value : '';
      const parsed = parseFirebaseConfigInput(text);
      if(!parsed){
        showToast('Không đọc được cấu hình — cô kiểm tra lại đã dán đủ và đúng đoạn firebaseConfig chưa nhé.', 4000);
        break;
      }
      saveStoredFirebaseConfig(parsed);
      showToast('Đã lưu cấu hình — đang tải lại trang...', 2500);
      setTimeout(()=> location.reload(), 1200);
      break;
    }
    case 'show-firebase-config-form': state.syncShowConfigForm = !state.syncShowConfigForm; render(); break;
    case 'sync-connect': {
      if(!firebaseReady()){ showToast('Chưa cấu hình Firebase.'); break; }
      const inp = document.getElementById('sync-code-input');
      const code = inp ? inp.value.trim() : '';
      if(!code){ showToast('Nhập mã đồng bộ nhé.'); break; }
      setSyncCode(code);
      showToast('Đang kết nối...', 3000);
      (async ()=>{
        try{
          const existing = await firestoreBackend.get('classes', true);
          const hasCloudData = existing && existing.value && JSON.parse(existing.value).length;
          if(!hasCloudData && state.classes.length){
            openConfirmModal('Mã đồng bộ này chưa có dữ liệu trên đám mây. Tải toàn bộ dữ liệu hiện có trên máy này lên để bắt đầu đồng bộ?', false, async ()=>{
              try{
                showToast('Đang tải dữ liệu lên đám mây, chờ chút nhé...', 6000);
                const ok = await pushAllToFirestore();
                await loadAll();
                if(ok) setLastSyncAt();
                showToast(ok ? 'Đã tải dữ liệu lên và bắt đầu đồng bộ.' : 'Tải lên chưa trọn vẹn — kiểm tra lại Rules trên Firestore rồi thử lại.', 4500);
              }catch(e){
                showToast('Có lỗi khi tải dữ liệu lên — cô kiểm tra lại kết nối mạng và Firestore Rules nhé.', 4500);
              }finally{
                render();
              }
            });
            return;
          }
          await loadAll();
          setLastSyncAt();
          showToast('Đã kết nối đồng bộ.');
        }catch(e){
          showToast('Không kết nối được — kiểm tra lại cấu hình Firebase và Rules trên Firestore.', 4500);
        }finally{
          render();
        }
      })();
      break;
    }
    case 'copy-sync-code': {
      const code = getSyncCode();
      copyTextToClipboard(code).then(ok=>{
        showToast(ok ? 'Đã copy mã đồng bộ.' : 'Không copy được — mã của cô là: '+code, 4000);
      });
      break;
    }
    case 'sync-disconnect': {
      openConfirmModal('Ngắt kết nối đồng bộ? Thiết bị này sẽ quay lại lưu dữ liệu cục bộ, không mất dữ liệu hiện có.', false, ()=>{
        clearSyncCode();
        (async ()=>{ await loadAll(); render(); showToast('Đã ngắt kết nối đồng bộ.'); })();
      });
      break;
    }
    case 'toggle-daily-task': {
      const today = todayISO();
      if(!state.dailyTasks[today]) state.dailyTasks[today] = {};
      state.dailyTasks[today][elx.dataset.task] = elx.checked;
      render(); saveDailyTasks();
      break;
    }
    case 'toggle-suggestion-done': {
      const today = todayISO();
      if(!state.dailyTasks[today]) state.dailyTasks[today] = {};
      state.dailyTasks[today][elx.dataset.id] = elx.checked;
      render(); saveDailyTasks();
      break;
    }
    case 'add-daily-template': {
      const inp = document.getElementById('new-daily-task');
      const title = inp ? inp.value.trim() : '';
      if(!title){ showToast('Nhập tên việc cần làm nhé.'); break; }
      state.dailyTaskTemplates.push({id: uid(), title});
      render(); saveDailyTaskTemplates();
      break;
    }
    case 'delete-daily-template': {
      const taskId = elx.dataset.task;
      openConfirmModal('Xoá việc này khỏi danh sách nhắc hằng ngày?', true, ()=>{
        state.dailyTaskTemplates = state.dailyTaskTemplates.filter(t=>t.id!==taskId);
        render(); saveDailyTaskTemplates();
      });
      break;
    }
    case 'goto-session-class': {
      state.currentClassId = elx.dataset.class;
      state.session.date = todayISO();
      state.tab = 'session';
      render();
      break;
    }
    case 'goto-session-date': {
      state.currentClassId = elx.dataset.class;
      state.session.date = elx.dataset.date;
      state.tab = 'session';
      render();
      break;
    }
    case 'goto-duties': {
      state.currentClassId = elx.dataset.class;
      state.homeroom.classId = elx.dataset.class;
      state.homeroom.section = 'duties';
      state.tab = 'homeroom';
      render();
      break;
    }

    /* ---- Modal ---- */
    case 'modal-cancel': closeModal(); break;
    case 'modal-backdrop': if(e && e.target===elx) closeModal(); break;
    case 'modal-input': break;
    case 'modal-submit': {
      const m = state.modal;
      if(!m) break;
      if(m.type==='prompt'){
        const input = document.getElementById('modal-input');
        const val = input ? input.value : '';
        const cb = m.onSubmit;
        state.modal = null;
        if(cb) cb(val);
        render();
      } else {
        const cb = m.onSubmit;
        state.modal = null;
        if(cb) cb();
        render();
      }
      break;
    }

    /* ---- Classes ---- */
    case 'add-class': {
      openPromptModal('Tên lớp học', '', (name)=>{
        if(name && name.trim()){
          const c = {id:uid(), name:name.trim(), students:[]};
          state.classes.push(c);
          state.currentClassId = c.id;
          saveClasses();
        }
      });
      break;
    }
    case 'rename-class': {
      const c = getClass(elx.dataset.id);
      openPromptModal('Đổi tên lớp', c.name, (name)=>{
        if(name && name.trim()){ c.name = name.trim(); saveClasses(); }
      });
      break;
    }
    case 'delete-class': {
      const id = elx.dataset.id;
      openConfirmModal('Xoá lớp này? Toàn bộ dữ liệu buổi học của lớp sẽ bị xoá.', true, ()=>{
        state.classes = state.classes.filter(c=>c.id!==id);
        delete state.sessionsByClass[id];
        storageSet('sessions_'+id, JSON.stringify([]));
        if(state.currentClassId===id) state.currentClassId = state.classes[0]? state.classes[0].id : null;
        saveClasses();
      });
      break;
    }
    case 'select-class': state.currentClassId = elx.dataset.id; render(); break;
    case 'reminder-change-date': state.homeroom.reminderDate = elx.value || localISO(); render(); break;
    case 'reminder-set-raw': state.homeroom.reminderRaw = elx.value; break;
    case 'reminder-clear': {
      state.homeroom.reminderRaw = ''; state.homeroom.reminderPrompt = '';
      render();
      break;
    }
    case 'generate-reminder-prompt': {
      const rawEl = document.getElementById('reminder-raw');
      const raw = rawEl ? rawEl.value : (state.homeroom.reminderRaw||'');
      state.homeroom.reminderRaw = raw;
      if(!raw.trim()){ showToast('Dán tin nhắn thô vào trước nhé.'); break; }
      state.homeroom.reminderPrompt = buildDailyReminderPrompt(state.homeroom.reminderDate || localISO(), raw);
      render();
      break;
    }
    case 'copy-reminder-prompt': {
      const el = document.getElementById('reminder-prompt-text');
      copyTextToClipboard(el ? el.value : state.homeroom.reminderPrompt).then(ok=>{
        showToast(ok ? 'Đã copy prompt — dán vào ChatGPT.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }
    case 'toggle-homeroom': {
      const c = getClass(elx.dataset.id);
      if(!c) break;
      c.isHomeroom = !isHomeroomClass(c);
      saveClasses();
      render();
      showToast(c.isHomeroom ? c.name+' là lớp chủ nhiệm — dùng ở tab Chủ nhiệm.' : 'Đã tắt chủ nhiệm cho '+c.name+' (dữ liệu vẫn được giữ).');
      break;
    }
    case 'toggle-gradebook': {
      const c = getClass(elx.dataset.id);
      if(!c) break;
      c.hasGradebook = !c.hasGradebook;
      saveClasses();
      render();
      showToast(c.hasGradebook ? 'Đã bật sổ điểm cho '+c.name+' — xem ở tab Sổ điểm.' : 'Đã tắt sổ điểm của '+c.name+' (điểm đã nhập vẫn được giữ).');
      break;
    }
    case 'gradebook-change-class': state.gradebook.classId = elx.value; render(); break;
    case 'set-grade': {
      const cls = getClass(elx.dataset.class);
      if(!cls) break;
      const r = gbRecord(cls, elx.dataset.student);
      const raw = elx.value;
      const val = raw==='' ? null : Math.round(clamp(Number(raw),0,10)*10)/10;
      const key = elx.dataset.key;
      if(key==='hs1') r.hs1[Number(elx.dataset.idx)||0] = val;
      else if(key==='oral' || key==='hs2' || key==='hs3' || key==='bonus') r[key] = val;
      saveClasses();
      updateGradebookDom(cls.id);
      break;
    }
    case 'add-student': {
      const c = getClass(state.currentClassId);
      openPromptModal('Thêm học sinh', '', (text)=>{
        const names = text.split(/\r?\n|,|;/)
          .map(s=> s.trim().replace(/^(\d+[\.\)]|[-•*])\s*/,'').trim())
          .filter(Boolean);
        if(names.length){
          names.forEach(name=> c.students.push({id:uid(), name}));
          saveClasses();
        }
      }, {
        multiline:true,
        showListTip:true,
        placeholder:'Nguyễn Văn A\nTrần Thị B\nLê Văn C\n...',
        hint:'Dán cả danh sách (mỗi học sinh một dòng) hoặc gõ từng tên — mỗi dòng sẽ tự tách thành một học sinh.'
      });
      break;
    }
    case 'rename-student': {
      const c = getClass(state.currentClassId);
      const s = c.students.find(x=>x.id===elx.dataset.id);
      openPromptModal('Sửa tên học sinh', s.name, (name)=>{
        if(name && name.trim()){ s.name = name.trim(); saveClasses(); }
      });
      break;
    }
    case 'archive-student': {
      const c = getClass(state.currentClassId);
      const sid = elx.dataset.id;
      const st = c && c.students.find(x=>x.id===sid);
      if(!st) break;
      openPromptModal('Lưu trữ '+st.name+' — lý do (không bắt buộc)', '', (reason)=>{
        c.students = c.students.filter(x=>x.id!==sid);
        if(!c.archivedStudents) c.archivedStudents = [];
        c.archivedStudents.push({...st, archivedAt: localISO(), archiveReason: (reason||'').trim()});
        if(c.seating && c.seating.assignments){
          Object.keys(c.seating.assignments).forEach(k=>{ if(c.seating.assignments[k]===sid) delete c.seating.assignments[k]; });
        }
        saveClasses();
        showToast('Đã lưu trữ '+st.name+' — xem ở mục Lưu trữ bên dưới.');
      }, {placeholder:'VD: Chuyển trường, nghỉ học...', submitLabel:'Lưu trữ', hint:'Điểm danh, điểm số, vi phạm của em vẫn được giữ lại.'});
      break;
    }
    case 'restore-student': {
      const c = getClass(state.currentClassId);
      const sid = elx.dataset.id;
      const st = c && (c.archivedStudents||[]).find(x=>x.id===sid);
      if(!st) break;
      const {archivedAt, archiveReason, ...rest} = st;
      c.archivedStudents = c.archivedStudents.filter(x=>x.id!==sid);
      c.students.push(rest);
      saveClasses();
      render();
      showToast('Đã khôi phục '+st.name+' về lớp.');
      break;
    }
    case 'delete-archived-student': {
      const c = getClass(state.currentClassId);
      const sid = elx.dataset.id;
      openConfirmModal('Xoá hẳn học sinh này khỏi Lưu trữ? Không thể hoàn tác.', true, ()=>{
        c.archivedStudents = (c.archivedStudents||[]).filter(x=>x.id!==sid);
        saveClasses();
      });
      break;
    }
    case 'delete-student': {
      const c = getClass(state.currentClassId);
      const sid = elx.dataset.id;
      openConfirmModal('Xoá học sinh này khỏi lớp?', true, ()=>{
        c.students = c.students.filter(x=>x.id!==sid);
        saveClasses();
      });
      break;
    }

    /* ---- Session ---- */
    case 'change-class-session': state.currentClassId = elx.value; state.session.prompt=''; render(); break;
    case 'change-session-date': state.session.date = elx.value; state.session.prompt=''; render(); break;
    case 'delete-session': {
      const classId = state.currentClassId, date = state.session.date;
      openConfirmModal(`Xoá toàn bộ dữ liệu buổi học ngày ${fmtDateVN(date)}? Điểm danh, checklist, điểm số và ghi chú của buổi này sẽ mất hết.`, true, ()=>{
        const list = state.sessionsByClass[classId] || [];
        state.sessionsByClass[classId] = list.filter(s=>s.date!==date);
        render(); saveSessions(classId);
      });
      break;
    }
    case 'set-teacher-name': state.teacherName = elx.value; saveTeacherName(); break;
    case 'export-session-doc': exportSessionWordTemplate(); break;
    case 'generate-session-prompt': {
      state.session.prompt = buildSessionReportPrompt(elx.dataset.class, elx.dataset.date);
      render();
      break;
    }
    case 'copy-session-prompt': {
      const el = document.getElementById('session-prompt-text');
      const text = el ? el.value : state.session.prompt;
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy prompt — dán vào công cụ AI để tạo bảng báo cáo.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }
    case 'set-att': {
      const sess = ensureSessionEditable();
      sess.attendance[elx.dataset.student] = elx.dataset.value;
      render(); saveSessions(state.currentClassId);
      break;
    }
    case 'tick-all-attendance': {
      const sess = ensureSessionEditable();
      getStudents(state.currentClassId).forEach(st=>{ sess.attendance[st.id] = 'present'; });
      render(); saveSessions(state.currentClassId);
      showToast('Đã tick cả lớp là Có mặt.');
      break;
    }
    case 'tick-all-checklist': {
      const sess = ensureSessionEditable();
      const typeId = elx.dataset.type;
      getStudents(state.currentClassId).forEach(st=>{
        if(sess.attendance[st.id]==='absent') return; // học sinh vắng — bỏ qua, không tick
        if(!sess.checklist[st.id]) sess.checklist[st.id] = {};
        sess.checklist[st.id][typeId] = 'full';
      });
      render(); saveSessions(state.currentClassId);
      showToast('Đã tick cả lớp là Đầy đủ (trừ học sinh vắng).');
      break;
    }
    case 'add-extype': {
      const input = document.getElementById('new-extype');
      if(input && input.value.trim()){
        const sess = ensureSessionEditable();
        sess.exerciseTypes.push({id:uid(), name:input.value.trim()});
        render(); saveSessions(state.currentClassId);
      }
      break;
    }
    case 'del-extype': {
      const sess = ensureSessionEditable();
      sess.exerciseTypes = sess.exerciseTypes.filter(t=>t.id!==elx.dataset.id);
      Object.keys(sess.checklist).forEach(sid=>{ delete sess.checklist[sid][elx.dataset.id]; });
      render(); saveSessions(state.currentClassId);
      break;
    }
    case 'cycle-check': {
      const sess = ensureSessionEditable();
      const sid = elx.dataset.student, tid = elx.dataset.type;
      if(!sess.checklist[sid]) sess.checklist[sid] = {};
      const cur = sess.checklist[sid][tid] || 'none';
      const next = cur==='none' ? 'partial' : (cur==='partial' ? 'full' : 'none');
      sess.checklist[sid][tid] = next;
      render(); saveSessions(state.currentClassId);
      break;
    }
    case 'add-exercise': {
      const input = document.getElementById('new-exercise');
      const modeSel = document.getElementById('new-exercise-mode');
      const totalInput = document.getElementById('new-exercise-total');
      const name = input ? input.value.trim() : '';
      const mode = modeSel ? modeSel.value : 'fraction';
      if(!name){ showToast('Nhập tên bài luyện tập nhé.'); break; }
      const sess = ensureSessionEditable();
      if(mode==='scale10'){
        sess.exercises.push({id:uid(), name, mode:'scale10'});
        render(); saveSessions(state.currentClassId);
      } else {
        const total = totalInput ? parseInt(totalInput.value, 10) : NaN;
        if(!(total>0)){ showToast('Nhập tổng số câu (lớn hơn 0) nhé.'); break; }
        sess.exercises.push({id:uid(), name, mode:'fraction', totalQuestions: total});
        render(); saveSessions(state.currentClassId);
      }
      break;
    }
    case 'del-exercise': {
      const sess = ensureSessionEditable();
      sess.exercises = sess.exercises.filter(x=>x.id!==elx.dataset.id);
      Object.keys(sess.scores).forEach(sid=>{ delete sess.scores[sid][elx.dataset.id]; });
      if(state.session.sortKey === elx.dataset.id) state.session.sortKey = 'default';
      render(); saveSessions(state.currentClassId);
      break;
    }
    case 'session-sort-key': state.session.sortKey = elx.value; render(); break;
    case 'session-sort-dir': state.session.sortDir = elx.value; render(); break;
    case 'reset-scores': {
      openConfirmModal('Đặt lại toàn bộ điểm bài luyện tập của buổi này? Các bài đã tạo vẫn được giữ nguyên, chỉ xoá điểm đã nhập.', true, ()=>{
        const sess = ensureSessionEditable();
        sess.scores = {};
        render(); saveSessions(state.currentClassId);
      });
      break;
    }
    case 'set-score': {
      const sess = ensureSessionEditable();
      const sid = elx.dataset.student, exid = elx.dataset.exercise;
      const total = Number(elx.dataset.total) || 10;
      const mode = elx.dataset.mode || 'fraction';
      if(!sess.scores[sid]) sess.scores[sid] = {};
      const val = elx.value;
      if(val===''){ delete sess.scores[sid][exid]; }
      else if(mode==='scale10'){
        sess.scores[sid][exid] = Math.round(clamp(Number(val),0,10)*10)/10;
      } else {
        sess.scores[sid][exid] = clamp(Math.round(Number(val)),0,total);
      }
      saveSessions(state.currentClassId);
      break;
    }
    case 'toggle-punishment-done': {
      const sess = ensureSessionEditable();
      if(!sess.punishmentDone) sess.punishmentDone = {};
      sess.punishmentDone[elx.dataset.student] = elx.checked;
      saveSessions(state.currentClassId);
      break;
    }
    case 'toggle-punishment-assign': {
      const sess = ensureSessionEditable();
      if(!sess.punishmentAssigned) sess.punishmentAssigned = {};
      sess.punishmentAssigned[elx.dataset.student] = elx.checked;
      saveSessions(state.currentClassId);
      break;
    }

      break;

      state.report.classId = elx.dataset.class; state.report.studentId = elx.dataset.student; state.report.mode='student';

      state.studentProfileId = elx.dataset.student; state.globalSearch=''; state.tab = 'studentProfile'; render(); break;

      state.tab = 'report'; render(); break;

      state.currentClassId = elx.dataset.class; state.homeroom.classId = elx.dataset.class;

      state.tab = 'homeroom'; render(); break;
    case 'goto-activities-profile':
      state.currentClassId = elx.dataset.class; state.homeroom.classId = elx.dataset.class;
      state.homeroom.section = 'activities'; state.homeroom.activityStudentId = elx.dataset.student;
      state.tab = 'homeroom'; render(); break;
    case 'goto-contacts-profile':
      state.currentClassId = elx.dataset.class; state.contacts.classId = elx.dataset.class; state.contacts.studentId = elx.dataset.student;
      state.tab = 'contacts'; render(); break;
    case 'export-doc': exportWordDoc(); break;
    case 'copy-zalo': copyZaloMessage(elx.dataset.class, elx.dataset.student); break;

    /* ---- Progress ---- */
    case 'progress-select':
      state.progress.classId = elx.dataset.class; state.progress.studentId = elx.dataset.student; state.progress.query=''; render(); break;
    case 'progress-class-overview':
      state.progress.classId = elx.dataset.class; state.progress.studentId = null; render(); break;
    case 'progress-pick':
      state.progress.classId = elx.dataset.class; state.progress.studentId = elx.dataset.student; render(); break;
    case 'progress-to-report':
      state.report.classId = elx.dataset.class; state.report.studentId = elx.dataset.student; state.report.mode='student'; state.tab='report'; render(); break;

    /* ---- Attendance ---- */
    case 'attendance-change-class': state.attendance.classId = elx.value; state.attendance.month='all'; render(); break;
    case 'attendance-change-month': state.attendance.month = elx.value; render(); break;
    case 'attendance-pick-month': state.attendance.month = elx.dataset.month; render(); break;
    case 'export-excel': exportExcel(); break;

    case 'contacts-change-class': state.contacts.classId = elx.value; state.contacts.studentId=null; render(); break;

    case 'contacts-back': state.contacts.studentId = null; render(); break;
    case 'add-contact': {
      const classId = elx.dataset.class, studentId = elx.dataset.student;
      const dateEl = document.getElementById('contact-date');
      const methodEl = document.getElementById('contact-method');
      const contentEl = document.getElementById('contact-content');

      if(!content){ showToast('Nhập nội dung trao đổi trước khi lưu nhé.'); break; }

      if(st){

        st.contactLog.push({
          id: uid(),
          date: dateEl && dateEl.value ? dateEl.value : todayISO(),
          method: methodEl ? methodEl.value : 'Khác',
          content
        });
        render(); saveClasses();

        const cls = getClass(classId);

    case 'cert-change-student': state.certificates.studentId = elx.value; state.certificates.description=''; render(); break;
    case 'cert-change-type': state.certificates.type = elx.value; state.certificates.description=''; render(); break;
    case 'cert-change-session': state.certificates.sessionDate = elx.value; state.certificates.description=''; render(); break;
    case 'cert-change-month': state.certificates.month = elx.value; state.certificates.description=''; render(); break;

      });
      break;

    /* ---- Challenge cả lớp ---- */
    case 'challenge-change-class': state.challenges.classId = elx.value; render(); break;
    case 'add-challenge': {
      const classId = elx.dataset.class;
      const titleEl = document.getElementById('new-challenge-title');
      const targetEl = document.getElementById('new-challenge-target');
      const unitEl = document.getElementById('new-challenge-unit');
      const descEl = document.getElementById('new-challenge-desc');
      const title = titleEl ? titleEl.value.trim() : '';
      const target = targetEl ? Number(targetEl.value) : NaN;
      const unit = unitEl ? unitEl.value.trim() : '';
      if(!title || !target || target<=0 || !unit){ showToast('Nhập đủ tên thử thách, mục tiêu (lớn hơn 0) và đơn vị nhé.'); break; }
      const cls = getClass(classId);
      if(!cls.challenges) cls.challenges = [];
      cls.challenges.push({
        id: uid(), title, description: descEl? descEl.value.trim() : '',
        target, unit, progress:0, createdDate: todayISO(), completed:false, log:[]
      });
      render(); saveClasses();
      break;
    }
    case 'add-challenge-progress': {
      const classId = elx.dataset.class, challengeId = elx.dataset.challenge;
      const amountEl = document.getElementById('add-progress-'+challengeId);
      const noteEl = document.getElementById('add-note-'+challengeId);
      const amount = amountEl ? Number(amountEl.value) : NaN;
      if(!amount || amount<=0){ showToast('Nhập số lượng cần cộng (lớn hơn 0) nhé.'); break; }
      const cls = getClass(classId);
      const ch = cls && cls.challenges && cls.challenges.find(c=>c.id===challengeId);
      if(ch){
        ch.progress += amount;
        if(!ch.log) ch.log = [];
        ch.log.push({id:uid(), date:todayISO(), amount, note: noteEl? noteEl.value.trim() : ''});
        if(ch.progress >= ch.target) ch.completed = true;
        render(); saveClasses();
      }

        const cls = getClass(classId);
        if(cls && cls.challenges){ cls.challenges = cls.challenges.filter(c=>c.id!==challengeId); }
        render(); saveClasses();
      });

    case 'homeroom-set-section': state.homeroom.section = elx.dataset.section; state.homeroom.violationStudentId=null; render(); break;

      const classId = elx.dataset.class, month = elx.dataset.month, studentId = elx.dataset.student;
      const cls = getClass(classId);

      if(!cls.conduct[month]) cls.conduct[month] = {};
      if(!cls.conduct[month][studentId]) cls.conduct[month][studentId] = {};
      cls.conduct[month][studentId].note = elx.value;
      saveClasses();
      break;

    case 'set-exam-score': {
      const classId = elx.dataset.class, month = elx.dataset.month, studentId = elx.dataset.student, subject = elx.dataset.subject;

      if(!cls.monthlyExams[month]) cls.monthlyExams[month] = {};
      if(!cls.monthlyExams[month][studentId]) cls.monthlyExams[month][studentId] = {};

      rec.type = typeEl ? typeEl.value : rec.type;
      rec.date = dateEl && dateEl.value ? dateEl.value : rec.date;

      state.records.formStudentIds = [];
      state.records.formClassId = '';
      render(); saveRecords();
      showToast('Đã cập nhật hồ sơ.');
      break;
    }
    case 'records-delete': {
      const id = elx.dataset.id;
      openConfirmModal('Xoá hồ sơ này? Không thể khôi phục.', true, ()=>{
        state.records.list = state.records.list.filter(x=>x.id!==id);
        delete state.records.prompts[id];
        render(); saveRecords();
      });
      break;
    }
    case 'generate-record-prompt': {
      const text = buildRecordSummaryPrompt(elx.dataset.id);
      if(text){ state.records.prompts[elx.dataset.id] = text; render(); }
      break;
    }
    case 'copy-record-prompt': {
      const id = elx.dataset.id;
      const el = document.getElementById('record-prompt-'+id);
      const text = el ? el.value : state.records.prompts[id];
      copyTextToClipboard(text).then(ok=>{
        showToast(ok ? 'Đã copy — dán vào ChatGPT để tóm tắt.' : 'Không copy được, cô bôi đen (Ctrl+A) rồi Ctrl+C nhé.', 3200);
      });
      break;
    }
  }
}

function shuffleArr(arr, R){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function circ(c,x,y,r,f,s,lw){ c.beginPath(); c.arc(x,y,Math.max(.1,r),0,TAU); if(f){c.fillStyle=f;c.fill();} if(s){c.lineWidth=lw||2;c.strokeStyle=s;c.stroke();} }

}

let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(f,d,type,vol,delay,slide){
  if(!cfg.sound) return; const a=ac(); if(!a) return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.03);
}
function noise(d,vol,delay){
  if(!cfg.sound) return; const a=ac(); if(!a) return;
  const n=Math.max(1,Math.floor(a.sampleRate*d)), buf=a.createBuffer(1,n,a.sampleRate), data=buf.getChannelData(0);
  for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), g=a.createGain(); s.buffer=buf; g.gain.value=vol||0.15;
  s.connect(g); g.connect(a.destination); s.start(a.currentTime+(delay||0));
}

function stats(classId, sid){

  (state.sessionsByClass[classId]||[]).forEach(s=> (s.callLog||[]).forEach(e=>{
    if(e.sid!==sid) return; calls++;

  return {calls, good, wrong, skip, rated:good+wrong};
