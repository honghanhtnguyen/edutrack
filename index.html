    <button class="${mode==='class'?'on':''}" data-action="report-set-mode" data-mode="class">Cả lớp</button>
  </div>`;

  const cls = getClass(classId);

  if(mode==='class'){
    return `
      <div class="topbar no-print">
        <div><h1 class="page-title">Báo cáo học tập</h1>${chalkUnderline()}<div class="page-sub">Tổng hợp tình hình học tập chung của cả lớp</div></div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-accent" data-action="export-doc">⬇ Xuất Word</button>
        </div>
      </div>
      ${modeToggle}
      <div class="card no-print" style="display:flex; gap:16px; flex-wrap:wrap;">
        <div><label class="field-label">Lớp</label><select class="class-select" data-action="report-change-class">${classOptions}</select></div>
      </div>
      <div class="card" id="report-print-area">
        ${cls.students.length ? renderClassReportBody(classId) : `<div class="empty"><h3>Lớp chưa có học sinh</h3></div>`}
      </div>
    `;
  }

  if(!students.length){
    return `<div class="topbar"><h1 class="page-title">Báo cáo</h1>${chalkUnderline()}</div>
    ${modeToggle}
    <div class="card no-print"><select class="class-select" data-action="report-change-class">${classOptions}</select></div>
    <div class="card empty"><h3>Lớp chưa có học sinh</h3></div>`;
  }

  const st = cls.students.find(s=>s.id===studentId);
  const remark = generateRemark(classId, studentId);
  const allSessions = getSessions(classId);
  const attLabel = (s) => s==='present'?'Có mặt': s==='absent'?'Vắng': s==='late'?'Muộn':'—';

  return `
    <div class="topbar no-print">
      <div><h1 class="page-title">Báo cáo học tập</h1>${chalkUnderline()}<div class="page-sub">Chọn lớp và học sinh để xem báo cáo gửi phụ huynh</div></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline" data-action="copy-zalo" data-class="${classId}" data-student="${studentId}">💬 Copy tin nhắn Zalo</button>
        <button class="btn btn-accent" data-action="export-doc">⬇ Xuất Word</button>
      </div>
    </div>
    ${modeToggle}
    <div class="card no-print" style="display:flex; gap:16px; flex-wrap:wrap;">
      <div><label class="field-label">Lớp</label><select class="class-select" data-action="report-change-class">${classOptions}</select></div>
      <div><label class="field-label">Học sinh</label><select class="class-select" data-action="report-change-student">${studentOptions}</select></div>
    </div>

    <div class="card" id="report-print-area">
      <div class="report-header">
        <div>
          <h2>Báo cáo học tập — ${esc(st.name)}</h2>
          <div class="muted">Lớp: ${esc(cls.name)} · Ngày xuất: ${fmtDateVN(todayISO())}</div>
        </div>
      </div>

      ${allSessions.length ? `
      <div style="overflow-x:auto;">
      <table style="min-width:840px;">
        <thead><tr>
          <th style="width:40px;text-align:center;">Stt</th>
          <th style="width:95px;">Ngày</th>
          <th>Nội dung học</th>
          <th>BTVN</th>
          <th style="width:75px;text-align:center;">Điểm TB</th>
          <th style="width:90px;text-align:center;">Điểm danh</th>
          <th>Nhận xét / Ghi chú</th>
          <th class="no-print" style="width:70px;text-align:center;">Chỉnh sửa</th>
        </tr></thead>
        <tbody>
        ${allSessions.map((s,i)=>{
          const attStatus = s.attendance[studentId] || null;
          const attLabel = attStatus==='present'?'Có mặt': attStatus==='absent'?'Vắng': attStatus==='late'?'Muộn':'—';
          const attColor = attStatus==='present'?'var(--success)': attStatus==='absent'?'var(--danger)': attStatus==='late'?'var(--late)':'var(--ink-soft)';
          const scoreAvg = sessionScoreAvg(s, studentId);
          // Gộp ghi chú riêng của em + nhận xét nền nếp chung của buổi (2 ô "Ghi chú" trong tab Buổi học)
          const noteParts = [];
          if(s.studentNotes[studentId]) noteParts.push(s.studentNotes[studentId]);
          if(s.disciplineNote) noteParts.push(s.disciplineNote);
          const note = noteParts.join(' — ');
          return `<tr class="ledger">
            <td class="mono" style="text-align:center;">${i+1}</td>
            <td class="mono">${fmtDateVN(s.date)}</td>
            <td class="note-text">${esc(s.content||'—')}</td>
            <td class="note-text">${esc(s.homework||'—')}</td>
            <td class="mono" style="text-align:center;">${scoreAvg!==null? scoreAvg.toFixed(1) : '—'}</td>
            <td class="mono" style="text-align:center;color:${attColor};font-weight:700;">${attLabel}</td>
            <td class="note-text">${esc(note||'—')}</td>
            <td class="no-print" style="text-align:center;"><button class="btn btn-outline btn-sm" data-action="goto-session-date" data-class="${classId}" data-date="${s.date}">✎ Sửa</button></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
      </div>
      ` : `<div class="muted">Chưa có buổi học nào được ghi nhận cho lớp này.</div>`}

      <h3 style="font-size:16.5px;margin:18px 0 10px;">Nhận xét</h3>
      <div class="remark-box">${esc(remark)}</div>
    </div>
  `;
}

/* ============================================================
   PROGRESS
============================================================ */
function renderProgress(){
  if(!state.classes.length) return `<div class="topbar"><h1 class="page-title">Tiến độ học tập</h1></div><div class="card empty"><h3>Chưa có lớp học</h3></div>`;

  const q = state.progress.query || '';
  let results = [];
  if(q.trim()){
    const ql = q.toLowerCase();
    state.classes.forEach(c=>{
      c.students.forEach(s=>{
        const hay = (c.name+' '+s.name).toLowerCase();
        if(hay.includes(ql)) results.push({classId:c.id, className:c.name, studentId:s.id, studentName:s.name});
      });
    });
  }

  let detail = '';
  if(state.progress.classId && state.progress.studentId){
    const classId = state.progress.classId, studentId = state.progress.studentId;
    const cls = getClass(classId);
    const st = cls && cls.students.find(s=>s.id===studentId);
    if(st){
      const series = studentScoreSeries(classId, studentId);
      const att = studentAttendanceStats(classId, studentId);
      const chartSvg = series.length ? lineChartSVG(
        series.map(s=>fmtDateVN(s.date)),
        [
          {name:esc(st.name), color:'var(--accent-deep)', values: series.map(s=>s.score)},
          {name:'Trung bình lớp', color:'var(--ink-faint)', dash:'5,4', values: series.map(s=>s.classAvg)},
        ]
      ) : `<div class="muted">Chưa có dữ liệu điểm.</div>`;

      detail = `
        <div class="card">
          <div class="card-title">${esc(cls.name)} — ${esc(st.name)}
            <button class="btn btn-outline btn-sm" data-action="progress-to-report" data-class="${classId}" data-student="${studentId}">Xem báo cáo đầy đủ →</button>
          </div>
          <div class="grid-3" style="margin-bottom:16px;">
            <div class="stat-box"><div class="stat-num">${att.rate!==null?att.rate+'%':'—'}</div><div class="stat-label">Chuyên cần</div></div>
            <div class="stat-box"><div class="stat-num">${series.length? (series.reduce((a,b)=>a+b.score,0)/series.length).toFixed(1) :'—'}</div><div class="stat-label">Điểm TB</div></div>
            <div class="stat-box"><div class="stat-num">${series.length}</div><div class="stat-label">Buổi có điểm</div></div>
          </div>
          ${chartSvg}
          <div class="legend"><span><i style="background:var(--accent-deep);"></i>${esc(st.name)}</span><span><i style="background:var(--ink-faint);"></i>Trung bình lớp</span></div>
          <table style="margin-top:16px;"><thead><tr><th>Buổi</th><th>Điểm TB</th><th>Ghi chú</th></tr></thead><tbody>
          ${getSessions(classId).map(s=>{
            const sc = sessionScoreAvg(s, studentId);
            const note = s.studentNotes[studentId];
            if(sc===null && !note) return '';
            return `<tr class="ledger"><td>${fmtDateVN(s.date)}</td><td class="mono">${sc!==null?sc.toFixed(1):'—'}</td><td class="note-text">${esc(note||'')}</td></tr>`;
          }).join('')}
          </tbody></table>
        </div>`;
    }
  } else if(state.progress.classId){
    const classId = state.progress.classId;
    const cls = getClass(classId);
    const sessions = getSessions(classId);
    const students = cls.students;
    const perSession = sessions.map(s=>({date:s.date, avg: sessionClassAvg(s, students.map(x=>x.id))})).filter(x=>x.avg!==null);
    const chartSvg = perSession.length ? lineChartSVG(perSession.map(p=>fmtDateVN(p.date)), [{name:'Trung bình lớp', color:'var(--accent-deep)', values:perSession.map(p=>p.avg)}]) : `<div class="muted">Chưa có dữ liệu điểm.</div>`;
    detail = `
      <div class="card">
        <div class="card-title">Tổng quan lớp — ${esc(cls.name)}</div>
        ${chartSvg}
        <table style="margin-top:16px;"><thead><tr><th>Học sinh</th><th>Chuyên cần</th><th>Điểm TB</th></tr></thead><tbody>
        ${students.map(s=>{
          const att = studentAttendanceStats(classId, s.id);
          const series = studentScoreSeries(classId, s.id);
          const avg = series.length? series.reduce((a,b)=>a+b.score,0)/series.length : null;
          return `<tr class="ledger" style="cursor:pointer;" data-action="progress-pick" data-class="${classId}" data-student="${s.id}">
            <td>${esc(s.name)}</td><td class="mono">${att.rate!==null?att.rate+'%':'—'}</td><td class="mono">${avg!==null?avg.toFixed(1):'—'}</td>
          </tr>`;
        }).join('')}
        </tbody></table>
      </div>`;
  }

  return `
    <div class="topbar">
      <div><h1 class="page-title">Tiến độ học tập</h1>${chalkUnderline()}<div class="page-sub">Gõ "lớp - tên học sinh" để tra cứu nhanh khi phụ huynh hỏi</div></div>
    </div>
    <div class="card">
      <div class="search-box">
        <input type="text" placeholder="Tìm theo tên lớp hoặc tên học sinh..." value="${esc(q)}" data-action="progress-search">
        ${results.length? `<div class="search-results">
          ${results.slice(0,20).map(r=>`<div class="search-result-item" data-action="progress-select" data-class="${r.classId}" data-student="${r.studentId}"><b>${esc(r.className)}</b> — ${esc(r.studentName)}</div>`).join('')}
        </div>` : ''}
      </div>
      <div class="chip-row" style="margin-top:14px;">
        ${state.classes.map(c=>`<div class="chip" style="cursor:pointer;background:${c.id===state.progress.classId && !state.progress.studentId ?'var(--accent)':'var(--accent-soft)'};color:${c.id===state.progress.classId && !state.progress.studentId?'#FFFFFF':'var(--accent-deep)'};" data-action="progress-class-overview" data-class="${c.id}">${esc(c.name)}</div>`).join('')}
      </div>
    </div>
    ${detail}
  `;
}

/* ============================================================
   ATTENDANCE EXPORT
============================================================ */
function renderAttendanceExport(){
  if(!state.classes.length) return `<div class="topbar"><h1 class="page-title">Chuyên cần</h1></div><div class="card empty"><h3>Chưa có lớp học</h3></div>`;
  const classId = state.attendance.classId || state.currentClassId;
  const cls = getClass(classId);
  const classOptions = state.classes.map(c=>`<option value="${c.id}" ${c.id===classId?'selected':''}>${esc(c.name)}</option>`).join('');
  const allSessions = getSessions(classId);
  const months = getClassMonths(classId);
  const selectedMonth = state.attendance.month || 'all';
  const sessions = selectedMonth==='all' ? allSessions : allSessions.filter(s=>monthKey(s.date)===selectedMonth);

  const monthOptions = [`<option value="all" ${selectedMonth==='all'?'selected':''}>Tất cả các tháng</option>`]
    .concat(months.map(m=>`<option value="${m}" ${m===selectedMonth?'selected':''}>${monthLabel(m)}</option>`)).join('');

  const rows = cls.students.map(s=>{
    const att = attendanceFromSessions(sessions, s.id);
    return {name:s.name, ...att};
  });

  // Bảng tổng hợp theo từng tháng (tỷ lệ chuyên cần trung bình cả lớp mỗi tháng)
  const monthlySummary = months.map(m=>{
    const sess = allSessions.filter(s=>monthKey(s.date)===m);
    const rates = cls.students.map(s=>attendanceFromSessions(sess, s.id).rate).filter(r=>r!==null);
    const avgRate = rates.length? Math.round(rates.reduce((a,b)=>a+b,0)/rates.length) : null;
    return { month:m, sessionCount: sess.length, avgRate };
  });

  return `
    <div class="topbar">
      <div><h1 class="page-title">Chuyên cần</h1>${chalkUnderline()}<div class="page-sub">Đếm buổi học và xuất báo cáo chuyên cần theo lớp, theo tháng</div></div>
      <button class="btn btn-accent" data-action="export-excel">⬇ Xuất Excel</button>
    </div>
    <div class="card" style="display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;">
      <div><label class="field-label">Lớp</label><select class="class-select" data-action="attendance-change-class">${classOptions}</select></div>
      <div><label class="field-label">Tháng</label><select class="class-select" data-action="attendance-change-month">${monthOptions}</select></div>
      <div class="muted">Số buổi ${selectedMonth==='all'?'đã ghi nhận':'trong tháng này'}: <b>${sessions.length}</b></div>
    </div>

    ${months.length>1 ? `
    <div class="card">
      <div class="card-title">Tổng hợp theo tháng</div>
      <table><thead><tr><th>Tháng</th><th>Số buổi</th><th>Tỷ lệ chuyên cần TB lớp</th></tr></thead><tbody>
      ${monthlySummary.map(m=>`
        <tr class="ledger ${m.month===selectedMonth?'flagged':''}" style="cursor:pointer;" data-action="attendance-pick-month" data-month="${m.month}">
          <td>${monthLabel(m.month)}</td>
          <td class="mono">${m.sessionCount}</td>
          <td class="mono">${m.avgRate!==null? m.avgRate+'%':'—'}</td>
        </tr>`).join('')}
      </tbody></table>
      <div class="tiny" style="margin-top:8px;">Bấm vào một dòng để xem chi tiết chuyên cần của tháng đó.</div>
    </div>` : ''}

    <div class="card">
      <div class="card-title">Chi tiết theo học sinh ${selectedMonth!=='all'? '— '+monthLabel(selectedMonth) : '— Tất cả các tháng'}</div>
      <table><thead><tr><th>Học sinh</th><th>Số buổi có dữ liệu</th><th>Có mặt</th><th>Vắng</th><th>Muộn</th><th>Tỷ lệ chuyên cần</th></tr></thead><tbody>
      ${rows.map(r=>`
        <tr class="ledger ${r.rate!==null && r.rate<75?'flagged':''}">
          <td>${esc(r.name)}</td>
          <td class="mono">${r.total}</td>
          <td class="mono">${r.present}</td>
          <td class="mono">${r.absent}</td>
          <td class="mono">${r.late}</td>
          <td class="mono">${r.rate!==null?r.rate+'%':'—'}</td>
        </tr>`).join('')}
      </tbody></table>
    </div>
  `;
}

/* ============================================================
   TRAO ĐỔI PHỤ HUYNH
============================================================ */
function renderContacts(){
  if(!state.classes.length) return `<div class="topbar"><h1 class="page-title">Trao đổi phụ huynh</h1></div><div class="card empty"><h3>Chưa có lớp học</h3></div>`;
  const classId = state.contacts.classId || state.currentClassId;
  const cls = getClass(classId);
  const classOptions = state.classes.map(c=>`<option value="${c.id}" ${c.id===classId?'selected':''}>${esc(c.name)}</option>`).join('');
  const studentId = state.contacts.studentId;

  let detail;
  if(!cls.students.length){
    detail = `<div class="card empty"><h3>Lớp chưa có học sinh</h3></div>`;
  } else if(studentId){
    const st = cls.students.find(s=>s.id===studentId);
    if(!st){
      detail = `<div class="card empty"><h3>Không tìm thấy học sinh</h3></div>`;
    } else {
      const log = (st.contactLog||[]).slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
      detail = `
        <div class="card">
          <div class="card-title">
            <span>Trao đổi với PH — ${esc(st.name)} (${log.length} lần)</span>
            <button class="btn btn-outline btn-sm" data-action="contacts-back">← Quay lại danh sách</button>
          </div>

          <div style="border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:18px; background:var(--surface-alt);">
            <div style="font-weight:700; margin-bottom:10px; font-size:16px;">+ Thêm lần trao đổi mới</div>
            <div class="grid-2" style="margin-bottom:10px;">
              <div><label class="field-label">Ngày</label><input type="date" id="contact-date" value="${todayISO()}"></div>
              <div><label class="field-label">Hình thức</label>
                <select id="contact-method">
                  <option>Gọi điện</option>
                  <option>Nhắn tin Zalo</option>
                  <option>Gặp trực tiếp</option>
                  <option>Họp phụ huynh</option>
                  <option>Khác</option>
                </select>
              </div>
            </div>
            <label class="field-label">Nội dung trao đổi</label>
            <textarea id="contact-content" rows="3" placeholder="VD: Trao đổi về việc con hay quên bài tập, phụ huynh sẽ nhắc nhở thêm ở nhà..."></textarea>
            <div style="margin-top:10px; text-align:right;">
              <button class="btn btn-accent btn-sm" data-action="add-contact" data-class="${classId}" data-student="${studentId}">+ Lưu lần trao đổi</button>
            </div>
          </div>

          ${log.length? log.map(e=>`
            <div style="border-bottom:1px solid var(--line); padding:10px 0;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                <div style="flex:1;">
                  <b>${fmtDateVN(e.date)}</b> · <span class="tiny">${esc(e.method)}</span>
                  <div class="note-text" style="margin-top:4px;">${esc(e.content)}</div>
                </div>
                <button class="btn btn-danger-outline btn-sm" data-action="delete-contact" data-class="${classId}" data-student="${studentId}" data-entry="${e.id}">Xoá</button>
              </div>
            </div>`).join('') : `<div class="muted">Chưa có lần trao đổi nào được ghi nhận cho học sinh này.</div>`}
        </div>
      `;
    }
  } else {
    const rows = cls.students.map(s=>{
      const log = (s.contactLog||[]).slice().sort((a,b)=> b.date.localeCompare(a.date));
      return {id:s.id, name:s.name, count: log.length, last: log[0]? log[0].date : null};
    });
    detail = `
      <div class="card">
        <div class="card-title">Danh sách học sinh — ${esc(cls.name)}</div>
        <table><thead><tr><th>Học sinh</th><th>Số lần trao đổi</th><th>Lần gần nhất</th><th></th></tr></thead><tbody>
        ${rows.map(r=>`
          <tr class="ledger ${r.count===0?'flagged':''}" style="cursor:pointer;" data-action="contacts-select" data-student="${r.id}">
            <td>${esc(r.name)}</td>
            <td class="mono">${r.count}</td>
            <td class="mono">${r.last? fmtDateVN(r.last) : '—'}</td>
            <td style="text-align:right;"><button class="btn btn-outline btn-sm" data-action="contacts-select" data-student="${r.id}">Xem / Thêm</button></td>
          </tr>`).join('')}
        </tbody></table>
        <div class="tiny" style="margin-top:8px;">Các dòng tô đỏ là học sinh chưa có lần trao đổi nào được ghi nhận.</div>
      </div>
    `;
  }

  return `
    <div class="topbar">
      <div><h1 class="page-title">Trao đổi phụ huynh</h1>${chalkUnderline()}<div class="page-sub">Ghi lại số lần và nội dung trao đổi với phụ huynh của từng học sinh</div></div>
    </div>
    <div class="card" style="display:flex; gap:16px; align-items:flex-end;">
      <div><label class="field-label">Lớp</label><select class="class-select" data-action="contacts-change-class">${classOptions}</select></div>
    </div>
    ${detail}
  `;
}

/* ============================================================
   THƯ KHEN (PDF)
============================================================ */
function renderCertificates(){
  if(!state.classes.length) return `<div class="topbar"><h1 class="page-title">Thư khen</h1></div><div class="card empty"><h3>Chưa có lớp học</h3></div>`;
  const classId = state.certificates.classId || state.currentClassId;
  const cls = getClass(classId);
  if(!cls.students.length) return `<div class="topbar"><h1 class="page-title">Thư khen</h1>${chalkUnderline()}</div><div class="card empty"><h3>Lớp chưa có học sinh</h3></div>`;

  const studentId = state.certificates.studentId || cls.students[0].id;
  const type = state.certificates.type || 'session';
  const classOptions = state.classes.map(c=>`<option value="${c.id}" ${c.id===classId?'selected':''}>${esc(c.name)}</option>`).join('');
  const studentOptions = cls.students.map(s=>`<option value="${s.id}" ${s.id===studentId?'selected':''}>${esc(s.name)}</option>`).join('');

  let extraSelector = '';
  let suggested = '';

  if(type==='session'){
    const sessions = getSessions(classId).filter(s=> sessionScoreAvg(s, studentId)!==null);
    const chosenDate = (state.certificates.sessionDate && sessions.some(s=>s.date===state.certificates.sessionDate))
      ? state.certificates.sessionDate : (sessions.length? sessions[sessions.length-1].date : null);
    if(sessions.length){
      extraSelector = `<div><label class="field-label">Buổi học</label><select class="class-select" data-action="cert-change-session">
        ${sessions.map(s=>`<option value="${s.date}" ${s.date===chosenDate?'selected':''}>${fmtDateVN(s.date)} (${sessionScoreAvg(s,studentId).toFixed(1)}/10)</option>`).join('')}
      </select></div>`;
      const sess = sessions.find(s=>s.date===chosenDate);
      const score = sess ? sessionScoreAvg(sess, studentId) : null;
      if(score!==null) suggested = `Chúc mừng em đã đạt điểm xuất sắc ${score.toFixed(1)}/10 trong buổi học ngày ${fmtDateVN(chosenDate)}! Cô rất tự hào về sự cố gắng của em, hãy tiếp tục phát huy nhé.`;
    } else {
      extraSelector = `<div class="muted">Học sinh chưa có buổi nào có điểm.</div>`;
    }
  } else if(type==='month'){
    const months = getClassMonths(classId);
    const chosenMonth = (state.certificates.month && months.includes(state.certificates.month)) ? state.certificates.month : (months.length? months[months.length-1] : null);

      const sessions = getSessions(classId).filter(s=>monthKey(s.date)===chosenMonth);
      const scores = sessions.map(s=>sessionScoreAvg(s,studentId)).filter(v=>v!==null);
      const avg = scores.length? scores.reduce((a,b)=>a+b,0)/scores.length : null;
      if(avg!==null) suggested = `Chúc mừng em đã có một ${monthLabel(chosenMonth).toLowerCase()} học tập rất tốt với điểm trung bình ${avg.toFixed(1)}/10! Cô ghi nhận sự nỗ lực và tiến bộ không ngừng của em.`;
    } else {
      extraSelector = `<div class="muted">Lớp chưa có dữ liệu theo tháng.</div>`;
    }
  } else {
    suggested = '';
  }

  return `
    <div class="topbar">
      <div><h1 class="page-title">Thư khen</h1>${chalkUnderline()}<div class="page-sub">Tạo thư khen, vinh danh điểm tốt hoặc lời khích lệ bất ngờ cho học sinh</div></div>

// Chọn icon gợi ý dựa theo loại thư khen và từ khoá trong nội dung, để mô tả sát với ngữ cảnh thực tế
function suggestCertificateIcons(type, bodyText){
  const text = (bodyText||'').toLowerCase();
  let icons = [];
  if(type==='session') icons = ['🏅','⭐','📈'];
  else if(type==='month') icons = ['🏆','🎖️','📅'];
  else icons = ['💌','🌈','🎈'];

  const keywordMap = [
    [/đọc|sách/, '📚'],
    [/nói|giao tiếp|thuyết trình/, '🗣️'],
    [/viết|chính tả/, '✍️'],
    [/chăm chỉ|cố gắng|nỗ lực/, '💪'],
    [/chuyên cần|đi học đều/, '📆'],
    [/tiến bộ/, '📈'],
    [/hát|nhạc/, '🎵'],
    [/vẽ|hoạ/, '🎨'],
    [/tự tin/, '😊'],
    [/tích cực|năng nổ/, '🙌'],
  ];
  keywordMap.forEach(([re, icon])=>{
    if(re.test(text) && !icons.includes(icon)) icons.push(icon);
  });
  // luôn có 1-2 icon "ăn mừng" để không khô khan
  ['🎉','✨'].forEach(icon=>{ if(!icons.includes(icon) && icons.length<6) icons.push(icon); });
  return icons.slice(0,6);
}

function buildCertificateDescription(classId, studentId, type){
  const cls = getClass(classId);
  const st = cls && cls.students.find(s=>s.id===studentId);
  if(!st) return '';
  const msgEl = document.getElementById('cert-message');
  const bodyText = msgEl ? msgEl.value.trim() : '';
  const icons = suggestCertificateIcons(type, bodyText);
  const title = type==='surprise' ? 'THƯ KHÍCH LỆ' : (type==='month' ? 'THƯ KHEN — THÀNH TÍCH THÁNG' : 'THƯ KHEN — BUỔI HỌC XUẤT SẮC');

  const lines = [];
  lines.push(`🎨 MÔ TẢ THIẾT KẾ THƯ KHEN`);
  lines.push('');
  lines.push(`Tiêu đề: "${title}"`);
  lines.push(`Vinh danh: ${st.name} — Lớp ${cls.name}`);
  lines.push(`Giáo viên: ${state.teacherName || '(chưa nhập tên)'}`);
  lines.push(`Ngày: ${fmtDateVN(todayISO())}`);
  lines.push('');
  lines.push(`Nội dung chính (đưa vào giữa thư, chữ rõ ràng, dễ đọc):`);
  lines.push(`"${bodyText || '(cô chưa nhập nội dung — hãy điền lời khen ở ô phía trên trước khi tạo mô tả)'}"`);
  lines.push('');
  lines.push(`Phong cách hình ảnh: tươi sáng, rực rỡ, vui tươi, thân thiện với học sinh THCS — không cứng nhắc kiểu văn bản hành chính.`);
  lines.push(`Bảng màu gợi ý: gradient ấm (vàng — cam — hồng) hoặc (xanh ngọc — tím pastel), nền sáng màu, có thể thêm hoạ tiết pháo giấy/ánh sao nhẹ ở góc.`);
  lines.push(`Icon/hình trang trí gợi ý: ${icons.join('  ')}`);
  lines.push(`Bố cục: khung viền bo tròn mềm mại, tên học sinh là điểm nhấn lớn nhất, có chỗ để chữ ký giáo viên ở góc dưới.`);
  lines.push('');
  lines.push(`— Mô tả này có thể dán trực tiếp vào công cụ tạo ảnh AI (Canva AI, ChatGPT/Gemini tạo ảnh...) để ra hình thư khen hoàn chỉnh.`);
  return lines.join('\n');
}

const CONDUCT_LABEL = {tot:'Tốt', kha:'Khá', trungbinh:'Trung bình', yeu:'Yếu'};

function conductSuggestion(classId, monthKey_, studentId){
  const sessions = getSessions(classId).filter(s=>monthKey(s.date)===monthKey_);
  const att = attendanceFromSessions(sessions, studentId);
  const cl = checklistFromSessions(sessions, studentId);
  const punishCount = sessions.filter(s=> s.punishmentAssigned && s.punishmentAssigned[studentId]).length;
  const cls = getClass(classId);
  const st = cls && cls.students.find(s=>s.id===studentId);
  const violCount = st && st.violations ? st.violations.filter(v=>monthKey(v.date)===monthKey_).length : 0;

  let rating;
  const attRate = att.rate, hwRate = cl.rate;
  if(violCount>=4 || (attRate!==null && attRate<60)) rating = 'yeu';
  else if(violCount>=2 || (attRate!==null && attRate<75) || (hwRate!==null && hwRate<50)) rating = 'trungbinh';
  else if(violCount===0 && (attRate===null || attRate>=90) && (hwRate===null || hwRate>=80) && punishCount===0) rating = 'tot';
  else rating = 'kha';

  return {rating, attRate, hwRate, punishCount, violCount};
}

function renderConductSection(classId, cls){
  const months = getClassMonths(classId);

    return `<div class="card empty"><h3>Chưa có dữ liệu buổi học theo tháng</h3><div class="muted">Vào tab Buổi học để ghi nhận trước.</div></div>`;
  }
  const month = (state.homeroom.month && months.includes(state.homeroom.month)) ? state.homeroom.month : months[months.length-1];
  const monthOptions = months.map(m=>`<option value="${m}" ${m===month?'selected':''}>${monthLabel(m)}</option>`).join('');
  const saved = (cls.conduct && cls.conduct[month]) || {};

  const rows = cls.students.map(s=>{
    const sug = conductSuggestion(classId, month, s.id);
    const current = saved[s.id] || {};
    const rating = current.rating || sug.rating;
    const note = current.note || '';
    return `<tr class="ledger">
      <td>${esc(s.name)}</td>
      <td class="mono">${sug.attRate!==null?sug.attRate+'%':'—'}</td>
      <td class="mono">${sug.hwRate!==null?sug.hwRate+'%':'—'}</td>
      <td class="mono">${sug.violCount}</td>
      <td>
        <select data-action="conduct-set-rating" data-class="${classId}" data-month="${month}" data-student="${s.id}">
          ${Object.keys(CONDUCT_LABEL).map(k=>`<option value="${k}" ${rating===k?'selected':''}>${CONDUCT_LABEL[k]}</option>`).join('')}
        </select>
      </td>
      <td><input type="text" placeholder="Nhận xét..." value="${esc(note)}" data-action="conduct-set-note" data-class="${classId}" data-month="${month}" data-student="${s.id}"></td>
    </tr>`;
  }).join('');

  return `
    <div class="card" style="display:flex; gap:16px; align-items:flex-end;">
      <div><label class="field-label">Tháng</label><select class="class-select" data-action="homeroom-change-month">${monthOptions}</select></div>
      <button class="btn btn-accent" style="margin-left:auto;" data-action="export-conduct" data-class="${classId}" data-month="${month}">⬇ Xuất Excel</button>
    </div>
    <div class="card">
      <div class="card-title">Xếp loại hạnh kiểm — ${monthLabel(month)}</div>
      <div class="muted" style="margin-bottom:10px;">Các cột chuyên cần/bài tập/vi phạm chỉ để tham khảo — xếp loại đã tự gợi ý sẵn theo dữ liệu tháng này, cô điều chỉnh trực tiếp ở cột "Xếp loại" nếu thấy chưa đúng.</div>
      <table><thead><tr><th>Học sinh</th><th>Chuyên cần</th><th>Hoàn thành BT</th><th>Vi phạm</th><th>Xếp loại</th><th>Nhận xét</th></tr></thead><tbody>
      ${rows}
      </tbody></table>
    </div>
  `;
}

function exportConductExcel(classId, month){
  const cls = getClass(classId);
  const rows = [['Học sinh','Chuyên cần (%)','Hoàn thành BT (%)','Số vi phạm','Xếp loại hạnh kiểm','Nhận xét']];
  cls.students.forEach(s=>{
    const sug = conductSuggestion(classId, month, s.id);
    const saved = (cls.conduct && cls.conduct[month] && cls.conduct[month][s.id]) || {};
    const rating = saved.rating || sug.rating;
    rows.push([s.name, sug.attRate!==null?sug.attRate:'', sug.hwRate!==null?sug.hwRate:'', sug.violCount, CONDUCT_LABEL[rating], saved.note||'']);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, monthLabel(month).slice(0,30));
  XLSX.writeFile(wb, `Hanh-kiem-${cls.name.replace(/\s+/g,'_')}-${month}.xlsx`);
  showToast('Đã xuất bảng hạnh kiểm.');
}

/* ---- Điểm kiểm tra định kỳ hàng tháng ---- */
const EXAM_SUBJECTS = [['toan','Toán'],['van','Văn'],['tienganh','Tiếng Anh'],['khtn','KHTN']];

function studentExamAvg(rec){
  const vals = EXAM_SUBJECTS.map(([k])=>rec[k]).filter(v=>v!==undefined && v!==null && v!=='');
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+Number(b),0)/vals.length;
}
function prevMonthKey(month){
  const [y,m] = month.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function renderExamsSection(classId, cls){
  const month = state.homeroom.examMonth || todayISO().slice(0,7);
  const monthData = (cls.monthlyExams && cls.monthlyExams[month]) || {};
  const prevMonth = prevMonthKey(month);
  const prevData = (cls.monthlyExams && cls.monthlyExams[prevMonth]) || {};

  const rows = cls.students.map(s=>{
    const rec = monthData[s.id] || {};
    return {id:s.id, name:s.name, rec, avg: studentExamAvg(rec)};
  });

  const tableRows = rows.map(r=>`
    <tr class="ledger">
      <td>${esc(r.name)}</td>
      ${EXAM_SUBJECTS.map(([k])=>`<td style="text-align:center;"><input class="score-input" type="number" min="0" max="10" step="0.5" value="${(r.rec[k]!==undefined && r.rec[k]!==null)?r.rec[k]:''}" data-action="set-exam-score" data-class="${classId}" data-month="${month}" data-student="${r.id}" data-subject="${k}"></td>`).join('')}
      <td class="mono" style="text-align:center;">${r.avg!==null? r.avg.toFixed(1) : '—'}</td>
    </tr>`).join('');

  const withAvg = rows.filter(r=>r.avg!==null);
  const top5High = withAvg.slice().sort((a,b)=>b.avg-a.avg).slice(0,5);
  const top5Low = withAvg.slice().sort((a,b)=>a.avg-b.avg).slice(0,5);

  const deltas = rows.map(r=>{
    const prevAvg = studentExamAvg(prevData[r.id] || {});
    if(r.avg===null || prevAvg===null) return null;
    return {name:r.name, avg:r.avg, prevAvg, delta: r.avg-prevAvg};
  }).filter(Boolean);
  const improved = deltas.slice().sort((a,b)=>b.delta-a.delta).filter(d=>d.delta>0).slice(0,5);
  const declined = deltas.slice().sort((a,b)=>a.delta-b.delta).filter(d=>d.delta<0).slice(0,5);

  const subjectStats = EXAM_SUBJECTS.map(([k,label])=>{
    const vals = cls.students.map(s=>{ const v=(monthData[s.id]||{})[k]; return (v!==undefined && v!==null && v!=='') ? Number(v) : null; }).filter(v=>v!==null);
    const avg = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    const failCount = vals.filter(v=>v<5).length;
    return {key:k, label, avg, count:vals.length, failCount};
  });
  const alarmingSubjects = subjectStats.filter(s=>s.avg!==null && s.avg<5);

  return `
    <div class="card" style="display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;">
      <div><label class="field-label">Tháng kiểm tra</label><input type="month" value="${month}" data-action="exam-change-month"></div>
      <div style="margin-left:auto; display:flex; gap:8px;">
        <button class="btn btn-outline" data-action="generate-exam-prompt" data-class="${classId}" data-month="${month}">✨ Tạo prompt báo cáo</button>
        <button class="btn btn-accent" data-action="export-exams" data-class="${classId}" data-month="${month}">⬇ Xuất Excel</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Bảng điểm kiểm tra tháng — ${monthLabel(month)}</div>
      <table><thead><tr><th>Học sinh</th>${EXAM_SUBJECTS.map(([,label])=>`<th style="text-align:center;">${label}</th>`).join('')}<th style="text-align:center;">TB tháng</th></tr></thead><tbody>
      ${tableRows}
      </tbody></table>
    </div>

    <div class="card">
      <div class="card-title">📊 Phân tích tháng ${monthLabel(month)}</div>

      ${alarmingSubjects.length? `
      <div class="warn-banner" style="margin-bottom:14px;">
        <div class="dot"></div>
        <div>
          <div class="warn-title">⚠ Môn đang báo động (điểm trung bình lớp dưới 5)</div>
          <div class="warn-detail">${alarmingSubjects.map(s=>`${esc(s.label)}: TB ${s.avg.toFixed(1)} — ${s.failCount}/${s.count} em dưới điểm 5`).join(' · ')}</div>
        </div>
      </div>` : (subjectStats.some(s=>s.avg!==null) ? `<div class="muted" style="margin-bottom:14px;">✓ Không có môn nào ở mức báo động (TB lớp trên 5).</div>` : '')}

      <div class="grid-2" style="margin-bottom:16px;">
        <div>
          <h3 style="font-size:16.5px;margin-bottom:8px;">🏆 Top 5 điểm cao nhất</h3>
          ${top5High.length? `<table><tbody>${top5High.map((r,i)=>`<tr class="ledger"><td class="mono">${i+1}</td><td>${esc(r.name)}</td><td class="mono">${r.avg.toFixed(1)}</td></tr>`).join('')}</tbody></table>` : `<div class="muted">Chưa đủ dữ liệu.</div>`}
        </div>
        <div>
          <h3 style="font-size:16.5px;margin-bottom:8px;">📉 Top 5 điểm thấp nhất</h3>
          ${top5Low.length? `<table><tbody>${top5Low.map((r,i)=>`<tr class="ledger flagged"><td class="mono">${i+1}</td><td>${esc(r.name)}</td><td class="mono">${r.avg.toFixed(1)}</td></tr>`).join('')}</tbody></table>` : `<div class="muted">Chưa đủ dữ liệu.</div>`}
        </div>
      </div>

      <div class="grid-2">
        <div>
          <h3 style="font-size:16.5px;margin-bottom:8px;">📈 Tiến bộ vượt bậc (so với ${monthLabel(prevMonth)})</h3>
          ${improved.length? `<table><tbody>${improved.map(r=>`<tr class="ledger"><td>${esc(r.name)}</td><td class="mono">+${r.delta.toFixed(1)}</td><td class="tiny">${r.prevAvg.toFixed(1)} → ${r.avg.toFixed(1)}</td></tr>`).join('')}</tbody></table>` : `<div class="muted">Chưa đủ dữ liệu 2 tháng liên tiếp để so sánh.</div>`}
        </div>
        <div>
          <h3 style="font-size:16.5px;margin-bottom:8px;">⚠ Cần rút kinh nghiệm (giảm so với ${monthLabel(prevMonth)})</h3>
          ${declined.length? `<table><tbody>${declined.map(r=>`<tr class="ledger flagged"><td>${esc(r.name)}</td><td class="mono">${r.delta.toFixed(1)}</td><td class="tiny">${r.prevAvg.toFixed(1)} → ${r.avg.toFixed(1)}</td></tr>`).join('')}</tbody></table>` : `<div class="muted">Chưa đủ dữ liệu 2 tháng liên tiếp để so sánh.</div>`}
        </div>
      </div>
    </div>

    ${state.homeroom.examPrompt ? `
    <div class="card">
      <div class="card-title">
        <span>📝 Prompt báo cáo kết quả kiểm tra</span>
        <button class="btn btn-outline btn-sm" data-action="copy-exam-prompt">💬 Copy prompt</button>
      </div>
      <div class="muted" style="margin-bottom:8px;">Dán prompt này vào ChatGPT/Claude/Gemini... để nhận báo cáo đầy đủ kèm nhận xét chuyên môn.</div>
      <textarea id="exam-prompt-text" rows="14">${esc(state.homeroom.examPrompt)}</textarea>
    </div>` : ''}
  `;
}

/* ---- Hoạt động phong trào (CLB + theo dõi sự nhiệt tình tham gia) ---- */
const SEMESTER_LABEL = {all:'Cả năm học', hk1:'Học kỳ 1', hk2:'Học kỳ 2', he:'Hè'};
function getSemesterKey(dateStr){
  const m = Number(dateStr.slice(5,7));
  if(m>=9 || m===1) return 'hk1';
  if(m>=2 && m<=5) return 'hk2';
  return 'he';
}

          ⚪ Em chưa được phân tổ, nên hoạt động ghi ở đây sẽ chưa cộng vào điểm tổ nào.

              <b>${fmtDateVN(a.date)}</b> · ${esc(a.activityName)} · <span class="tiny mono" style="color:var(--success);">+${a.points!==undefined?a.points:a.level} điểm</span>
              ${a.note? `<div class="note-text" style="margin-top:4px;">${esc(a.note)}</div>`:''}
              ${team? `<div class="tiny" style="margin-top:3px;color:var(--ink-faint);">→ Đã cộng ${a.points!==undefined?a.points:a.level} điểm cho ${esc(team.name)}, tháng ${monthLabel(monthKey(a.date))}</div>` : ''}

      ${rows.map(r=>`
        <tr class="ledger ${r.count===0?'flagged':''}" style="cursor:pointer;" data-action="activities-select" data-student="${r.id}">

          <td>${esc(r.club)}</td>

          <td class="mono">${r.totalPoints!==null? '+'+r.totalPoints : '—'}</td>
          <td style="text-align:right;"><button class="btn btn-outline btn-sm" data-action="activities-select" data-student="${r.id}">Xem / Thêm</button></td>
        </tr>`).join('')}
      </tbody></table>
      <div class="tiny" style="margin-top:8px;">Học sinh tô đỏ là chưa có hoạt động nào được ghi nhận trong khoảng thời gian đang xem.</div>
    </div>
  `;
}

function exportExamsExcel(classId, month){
  const cls = getClass(classId);
  const monthData = (cls.monthlyExams && cls.monthlyExams[month]) || {};
  const rows = [['Học sinh', ...EXAM_SUBJECTS.map(([,l])=>l), 'Điểm TB tháng']];
  cls.students.forEach(s=>{
    const rec = monthData[s.id] || {};
    const avg = studentExamAvg(rec);
    rows.push([s.name, ...EXAM_SUBJECTS.map(([k])=> (rec[k]!==undefined && rec[k]!==null) ? rec[k] : ''), avg!==null?avg.toFixed(1):'']);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, ('DiemKT-'+monthLabel(month)).slice(0,30));
  XLSX.writeFile(wb, `Diem-KT-thang-${cls.name.replace(/\s+/g,'_')}-${month}.xlsx`);
  showToast('Đã xuất bảng điểm kiểm tra tháng.');
}

function buildExamReportPrompt(classId, month){
  const cls = getClass(classId);
  const monthData = (cls.monthlyExams && cls.monthlyExams[month]) || {};
  const prevMonth = prevMonthKey(month);
  const prevData = (cls.monthlyExams && cls.monthlyExams[prevMonth]) || {};

  const rows = cls.students.map(s=>{
    const rec = monthData[s.id] || {};
    return { name: s.name, rec, avg: studentExamAvg(rec), prevAvg: studentExamAvg(prevData[s.id] || {}) };
  });
  const withAvg = rows.filter(r=>r.avg!==null);
  const top5High = withAvg.slice().sort((a,b)=>b.avg-a.avg).slice(0,5);
  const top5Low = withAvg.slice().sort((a,b)=>a.avg-b.avg).slice(0,5);
  const deltas = rows.filter(r=>r.avg!==null && r.prevAvg!==null).map(r=>({...r, delta: r.avg-r.prevAvg}));
  const improved = deltas.slice().sort((a,b)=>b.delta-a.delta).filter(d=>d.delta>0).slice(0,5);
  const declined = deltas.slice().sort((a,b)=>a.delta-b.delta).filter(d=>d.delta<0).slice(0,5);

  const subjectStats = EXAM_SUBJECTS.map(([k,label])=>{
    const vals = cls.students.map(s=>{ const v=(monthData[s.id]||{})[k]; return (v!==undefined && v!==null && v!=='') ? Number(v) : null; }).filter(v=>v!==null);
    const avg = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    return {label, avg, count: vals.length};
  });

  const L = [];
  L.push('Bạn là trợ lý giúp giáo viên chủ nhiệm viết BÁO CÁO ĐẦY ĐỦ kết quả kiểm tra định kỳ hàng tháng, kèm nhận xét chuyên môn.');
  L.push('');
  L.push(`Lớp: ${cls.name}`);
  L.push(`Tháng: ${monthLabel(month)}`);
  L.push(`Giáo viên chủ nhiệm: ${state.teacherName || '(chưa nhập tên)'}`);
  L.push('');
  L.push('=== BẢNG ĐIỂM CHI TIẾT (Toán / Văn / Tiếng Anh / KHTN / Điểm TB) ===');
  rows.forEach(r=>{
    const cells = EXAM_SUBJECTS.map(([k])=> (r.rec[k]!==undefined && r.rec[k]!==null) ? r.rec[k] : '—');
    L.push(`- ${r.name}: ${cells.join(' / ')} — TB: ${r.avg!==null? r.avg.toFixed(1) : '—'}`);
  });
  L.push('');
  L.push('=== ĐIỂM TRUNG BÌNH TỪNG MÔN CỦA CẢ LỚP ===');
  subjectStats.forEach(s=> L.push(`- ${s.label}: ${s.avg!==null? s.avg.toFixed(1) : 'chưa có dữ liệu'} (${s.count} học sinh có điểm)`));
  L.push('');
  L.push('=== TOP 5 ĐIỂM CAO NHẤT ===');
  L.push(top5High.length ? top5High.map((r,i)=>`${i+1}. ${r.name} — ${r.avg.toFixed(1)}`).join('\n') : '(chưa đủ dữ liệu)');
  L.push('');
  L.push('=== TOP 5 ĐIỂM THẤP NHẤT ===');
  L.push(top5Low.length ? top5Low.map((r,i)=>`${i+1}. ${r.name} — ${r.avg.toFixed(1)}`).join('\n') : '(chưa đủ dữ liệu)');
  L.push('');
  L.push(`=== TIẾN BỘ VƯỢT BẬC (so với ${monthLabel(prevMonth)}) ===`);
  L.push(improved.length ? improved.map(r=>`- ${r.name}: ${r.prevAvg.toFixed(1)} → ${r.avg.toFixed(1)} (+${r.delta.toFixed(1)})`).join('\n') : '(chưa đủ dữ liệu 2 tháng liên tiếp để so sánh)');
  L.push('');
  L.push(`=== CẦN RÚT KINH NGHIỆM (so với ${monthLabel(prevMonth)}) ===`);
  L.push(declined.length ? declined.map(r=>`- ${r.name}: ${r.prevAvg.toFixed(1)} → ${r.avg.toFixed(1)} (${r.delta.toFixed(1)})`).join('\n') : '(chưa đủ dữ liệu 2 tháng liên tiếp để so sánh)');
  L.push('');
  L.push('=== YÊU CẦU ===');
  L.push('Hãy viết một BÁO CÁO ĐẦY ĐỦ dựa trên dữ liệu trên, gồm:');
  L.push('1. Tổng quan kết quả kiểm tra tháng (điểm trung bình chung, xu hướng so với tháng trước nếu có dữ liệu).');
  L.push('2. Nhận xét từng môn học — đặc biệt nêu rõ môn nào đang yếu/báo động, phân tích nguyên nhân có thể và đề xuất giải pháp cải thiện cụ thể.');
  L.push('3. Vinh danh học sinh đạt điểm cao và học sinh tiến bộ vượt bậc (nêu rõ tên).');
  L.push('4. Lưu ý về các học sinh điểm thấp hoặc bị giảm sút (nêu rõ tên), kèm đề xuất hướng hỗ trợ.');
  L.push('5. Kết luận và định hướng cho tháng tiếp theo.');
  L.push('Văn phong: chuyên nghiệp, khách quan, súc tích — phù hợp để báo cáo Ban giám hiệu hoặc trình bày trong buổi họp phụ huynh.');
  return L.join('\n');
}

    const team = st.teamId ? (cls.teams||[]).find(t=>t.id===st.teamId) : null;
    return `

/* ---- Trực nhật xoay vòng + Nhiệm vụ theo đợt ---- */
function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function weeksBetween(mondayA, mondayB){
  const a=new Date(mondayA+'T00:00:00'), b=new Date(mondayB+'T00:00:00');
  return Math.round((b-a)/(7*24*3600*1000));
}
function getDutyTurn(duty, forWeekMonday){
  if(!duty || !duty.order || !duty.order.length) return [];
  const startMonday = mondayOf(duty.startDate);
  const weeksElapsed = weeksBetween(startMonday, forWeekMonday);
  const groupSize = Math.max(1, duty.groupSize||1);
  const totalGroups = Math.ceil(duty.order.length/groupSize);
  const groupIndex = ((weeksElapsed % totalGroups)+totalGroups)%totalGroups;
  const startIdx = groupIndex*groupSize;
  return duty.order.slice(startIdx, startIdx+groupSize);
}

/* ---- Thi đua tổ/nhóm: hệ thống điểm theo tháng ---- */
function getTeamSettings(cls){
  const s = cls.teamSettings || {};
  return { baseScore: (typeof s.baseScore==='number')? s.baseScore : 60 };
}
// Các tháng có dữ liệu liên quan tới thi đua (vi phạm của thành viên, điều chỉnh thủ công) + luôn có tháng hiện tại
function getTeamMonthsAvailable(classId){
  const cls = getClass(classId);
  const keys = new Set([todayISO().slice(0,7)]);
  (cls.students||[]).forEach(s=> (s.violations||[]).forEach(v=> keys.add(monthKey(v.date))));
  (cls.teamScores||[]).forEach(e=> keys.add(monthKey(e.date)));
  return Array.from(keys).sort();
}
// Tính điểm 1 tổ trong 1 tháng: khởi điểm + điều chỉnh thủ công (thưởng/phạt) - (số vi phạm thành viên × điểm trừ/lỗi)
function computeTeamMonthScore(classId, teamId, monthKey_){
  const cls = getClass(classId);
  const settings = getTeamSettings(cls);
  const members = cls.students.filter(s=>s.teamId===teamId);
  let violationCount = 0, violationDeduction = 0;
  members.forEach(s=> (s.violations||[]).forEach(v=>{
    if(monthKey(v.date)===monthKey_){ violationCount++; violationDeduction += (v.points!==undefined ? v.points : 5); }
  }));
  let activityBonus = 0, activityCount = 0;
  members.forEach(s=> (s.activities||[]).forEach(a=>{
    if(monthKey(a.date)===monthKey_){ activityCount++; activityBonus += (a.points!==undefined ? a.points : (a.level||0)); }
  }));
  const manualEntries = (cls.teamScores||[]).filter(e=> e.teamId===teamId && monthKey(e.date)===monthKey_);
  const manualBonus = manualEntries.filter(e=>e.points>0).reduce((a,b)=>a+b.points,0);
  const manualPenalty = manualEntries.filter(e=>e.points<0).reduce((a,b)=>a+Math.abs(b.points),0);
  const manualSum = manualBonus - manualPenalty;
  const totalBonus = manualBonus + activityBonus;
  const totalPenalty = violationDeduction + manualPenalty;
  const score = settings.baseScore + totalBonus - totalPenalty;
  return { score, base: settings.baseScore, violationCount, violationDeduction, activityCount, activityBonus, manualSum, manualBonus, manualPenalty, totalBonus, totalPenalty, manualEntries };
}
// Học sinh "tích cực" trong tháng: tổng điểm cộng từ hoạt động phong trào trong tháng đạt ngưỡng
function isStudentActiveThisMonth(student, monthKey_){
  const acts = (student.activities||[]).filter(a=> monthKey(a.date)===monthKey_);
  if(!acts.length) return false;
  const total = acts.reduce((a,b)=>a+(b.points!==undefined?b.points:(b.level||0)),0);
  return total>=8;
}

function renderTeamsSection(classId, cls){
  const teams = cls.teams || [];
  const settings = getTeamSettings(cls);
  const months = getTeamMonthsAvailable(classId);
  const month = (state.teamsMonth && months.includes(state.teamsMonth)) ? state.teamsMonth : months[months.length-1];
  const prevMonth = prevMonthKey(month);
  const teamName = id => { const t = teams.find(x=>x.id===id); return t? t.name : '(đã xoá)'; };

  const results = teams.map(t=>{
    const cur = computeTeamMonthScore(classId, t.id, month);
    const prev = computeTeamMonthScore(classId, t.id, prevMonth);
    const hasPrevData = months.includes(prevMonth);
    return { ...t, cur, prev, delta: hasPrevData ? cur.score - prev.score : null, hasPrevData };

const SEATING_ZONES = 3, SEATING_ROWS = 6, SEATING_SEATS = 3;

function seatKey(z,r,s){ return `${z}-${r}-${s}`; }

function renderSeatingSection(classId, cls){

  const assignments = seating.assignments || {};
  const nameOf = id => { const s = cls.students.find(x=>x.id===id); return s ? s.name : ''; };

  const assignedIds = Object.values(assignments).filter(Boolean);
  const assignedCount = {};
  assignedIds.forEach(id=>{ assignedCount[id] = (assignedCount[id]||0)+1; });
  const duplicateIds = new Set(Object.keys(assignedCount).filter(id=>assignedCount[id]>1));
  const unassigned = cls.students.filter(s=>!assignedIds.includes(s.id));

  let zonesHtml = '';
  for(let z=1; z<=SEATING_ZONES; z++){
    let rowsHtml = '';
    for(let r=1; r<=SEATING_ROWS; r++){
      let seatsHtml = '';
      for(let s=1; s<=SEATING_SEATS; s++){
        const key = seatKey(z,r,s);
        const studentId = assignments[key] || '';
        const isDup = studentId && duplicateIds.has(studentId);
        seatsHtml += `
          <select data-action="set-seat" data-class="${classId}" data-seat="${key}" style="width:100%;font-size:13.5px;padding:6px 6px;${isDup?'border-color:var(--danger);':''}">

            ${cls.students.map(st=>`<option value="${st.id}" ${studentId===st.id?'selected':''}>${esc(st.name)}</option>`).join('')}

      }

        <div class="tiny" style="grid-column:1/-1;color:var(--ink-faint);">Dãy ${r}</div>
        ${seatsHtml}
      </div>`;
    }
    zonesHtml += `
      <div style="flex:1;min-width:210px;">
        <div style="text-align:center;font-weight:700;font-family:'Baloo 2',sans-serif;font-size:16px;margin-bottom:10px;color:var(--accent-deep);">🪑 Tổ ${z}</div>

  return `
    <div class="card">
      <div class="card-title">
        <span>🪑 Sơ đồ chỗ ngồi</span>
        <button class="btn btn-outline" data-action="generate-seating-prompt" data-class="${classId}">✨ Tạo prompt minh hoạ</button>

      <div class="muted" style="margin-bottom:12px;">Bố cục: 3 tổ — mỗi tổ 6 dãy bàn — mỗi bàn 3 học sinh (tối đa 54 chỗ). Dãy 1 gần bảng nhất.</div>
      <div style="text-align:center; background:var(--ink); color:#fff; border-radius:8px; padding:8px; margin-bottom:16px; font-family:'Baloo 2',sans-serif; font-weight:700; letter-spacing:.05em;">🖊️ BẢNG</div>
      <div style="display:flex; gap:16px; flex-wrap:wrap;">
        ${zonesHtml}
      </div>
      ${duplicateIds.size ? `<div class="tiny" style="color:var(--danger); margin-top:10px;">⚠ Có học sinh đang được xếp trùng nhiều hơn 1 chỗ — ô viền đỏ.</div>` : ''}
      ${unassigned.length ? `<div class="tiny" style="margin-top:10px;">Chưa xếp chỗ: ${unassigned.map(s=>esc(s.name)).join(', ')}</div>` : ''}
    </div>

    ${state.seating.prompt ? `
    <div class="card">
      <div class="card-title">
        <span>📝 Prompt minh hoạ chỗ ngồi</span>
        <button class="btn btn-outline btn-sm" data-action="copy-seating-prompt">💬 Copy prompt</button>
      </div>
      <div class="muted" style="margin-bottom:8px;">Dán prompt này vào ChatGPT/Claude/Gemini... để tạo hình minh hoạ sơ đồ chỗ ngồi.</div>
      <textarea id="seating-prompt-text" rows="14">${esc(state.seating.prompt)}</textarea>
    </div>` : ''}
  `;
}

function buildSeatingPrompt(classId){

  const nameOf = id => { const s = cls.students.find(x=>x.id===id); return s ? s.name : '(trống)'; };

  const L = [];
  L.push('Bạn là trợ lý giúp giáo viên minh hoạ trực quan SƠ ĐỒ CHỖ NGỒI của lớp học.');

  L.push('');
  L.push('=== SƠ ĐỒ CHỖ NGỒI HIỆN TẠI ===');

    L.push(`Tổ ${z}:`);
    for(let r=1; r<=SEATING_ROWS; r++){
      const seats = [];
      for(let s=1; s<=SEATING_SEATS; s++){

  L.push('');

  return L.join('\n');
}

============================================================ */
const HONOR_BADGES = {
  score:      {icon:'🏆', label:'Điểm số xuất sắc'},
  improve:    {icon:'📈', label:'Tiến bộ vượt bậc'},
  attendance: {icon:'📅', label:'Chuyên cần xuất sắc'},
  homework:   {icon:'📝', label:'Hoàn thành bài tập tốt'},
  conduct:    {icon:'🌟', label:'Hạnh kiểm Tốt'},
  activity:   {icon:'🙌', label:'Tích cực hoạt động phong trào'},
};
const HONOR_SEMESTER_ORDER = ['hk1','hk2','he'];

function avgExamOfMonths(cls, studentId, months){
  const vals = months.map(m => studentExamAvg((cls.monthlyExams && cls.monthlyExams[m] && cls.monthlyExams[m][studentId]) || {})).filter(v=>v!==null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

function computeHonorCandidates(classId, period, key, criteria, thresholds){
  const cls = getClass(classId);
  const sessions = period==='month' ? getSessions(classId).filter(s=>monthKey(s.date)===key) : getSessions(classId).filter(s=>getSemesterKey(s.date)===key);
  const results = [];

  cls.students.forEach(st=>{
    const badges = [];
    const details = {};

    if(criteria.score){
      let avg = null;
      if(period==='month'){
        avg = studentExamAvg((cls.monthlyExams && cls.monthlyExams[key] && cls.monthlyExams[key][st.id]) || {});
      } else {
        const monthsInSem = Object.keys(cls.monthlyExams||{}).filter(m=>getSemesterKey(m)===key);
        avg = avgExamOfMonths(cls, st.id, monthsInSem);
      }
      details.score = avg;
      if(avg!==null && avg>=thresholds.score) badges.push('score');
    }

    if(criteria.improve){
      let curAvg=null, prevAvg=null;
      if(period==='month'){
        curAvg = studentExamAvg((cls.monthlyExams && cls.monthlyExams[key] && cls.monthlyExams[key][st.id]) || {});
        const pm = prevMonthKey(key);
        prevAvg = studentExamAvg((cls.monthlyExams && cls.monthlyExams[pm] && cls.monthlyExams[pm][st.id]) || {});
      } else {
        const idx = HONOR_SEMESTER_ORDER.indexOf(key);
        const prevSem = idx>0 ? HONOR_SEMESTER_ORDER[idx-1] : null;
        const curMonths = Object.keys(cls.monthlyExams||{}).filter(m=>getSemesterKey(m)===key);
        curAvg = avgExamOfMonths(cls, st.id, curMonths);
        if(prevSem){
          const prevMonths = Object.keys(cls.monthlyExams||{}).filter(m=>getSemesterKey(m)===prevSem);
          prevAvg = avgExamOfMonths(cls, st.id, prevMonths);
        }
      }
      const delta = (curAvg!==null && prevAvg!==null) ? curAvg-prevAvg : null;
      details.improve = delta;
      if(delta!==null && delta>=thresholds.improve) badges.push('improve');
    }

    if(criteria.attendance){
      const att = attendanceFromSessions(sessions, st.id);
      details.attendance = att.rate;
      if(att.rate!==null && att.rate>=thresholds.attendance) badges.push('attendance');
    }

    if(criteria.homework){
      const cl = checklistFromSessions(sessions, st.id);
      details.homework = cl.rate;
      if(cl.rate!==null && cl.rate>=thresholds.homework) badges.push('homework');
    }

    if(criteria.conduct){
      const monthsToCheck = period==='month' ? [key] : getClassMonths(classId).filter(m=>getSemesterKey(m)===key);
      let allTot = monthsToCheck.length>0;
      monthsToCheck.forEach(m=>{
        const saved = (cls.conduct && cls.conduct[m] && cls.conduct[m][st.id]) || {};
        const rating = saved.rating || conductSuggestion(classId, m, st.id).rating;
        if(rating!=='tot') allTot = false;
      });
      details.conduct = monthsToCheck.length ? allTot : null;
      if(monthsToCheck.length && allTot) badges.push('conduct');
    }

    if(criteria.activity){
      const acts = (st.activities||[]).filter(a => period==='month' ? monthKey(a.date)===key : getSemesterKey(a.date)===key);
      const totalPoints = acts.length ? acts.reduce((a,b)=>a+(b.points!==undefined?b.points:(b.level||0)),0) : null;
      details.activity = {totalPoints, count:acts.length};
      if(acts.length>=thresholds.activityMinCount && totalPoints!==null && totalPoints>=thresholds.activityLevel) badges.push('activity');
    }

    if(badges.length){
      results.push({student:st, badges, details});
    }
  });

  return results;
}

function buildHonorPrompt(classId, studentId, period, key){
  const cls = getClass(classId);
  const st = cls.students.find(s=>s.id===studentId);
  if(!st) return '';
  const result = computeHonorCandidates(classId, period, key, state.honors.criteria, state.honors.thresholds).find(r=>r.student.id===studentId);
  if(!result) return '';
  const periodLabel = period==='month' ? monthLabel(key) : SEMESTER_LABEL[key];

  const badgeLines = result.badges.map(b=>{
    const info = HONOR_BADGES[b];
    let detail = '';
    if(b==='score') detail = `Điểm trung bình: ${result.details.score.toFixed(1)}/10`;
    if(b==='improve') detail = `Tiến bộ: +${result.details.improve.toFixed(1)} điểm so với kỳ trước`;
    if(b==='attendance') detail = `Tỷ lệ chuyên cần: ${result.details.attendance}%`;
    if(b==='homework') detail = `Tỷ lệ hoàn thành bài tập: ${result.details.homework}%`;
    if(b==='conduct') detail = 'Xếp loại hạnh kiểm: Tốt';
    if(b==='activity') detail = `Tổng điểm cộng hoạt động: +${result.details.activity.totalPoints} (${result.details.activity.count} hoạt động)`;
    return `${info.icon} ${info.label} — ${detail}`;
  });

  const L = [];
  L.push('Bạn là trợ lý giúp giáo viên soạn GIẤY KHEN THƯỞNG chính thức cho học sinh, dựa trên thành tích đã đạt được.');
  L.push('');
  L.push(`Học sinh: ${st.name}`);
  L.push(`Lớp: ${cls.name}`);
  L.push(`Kỳ vinh danh: ${periodLabel}`);
  L.push(`Giáo viên chủ nhiệm: ${state.teacherName || '(chưa nhập tên)'}`);
  L.push('');
  L.push('=== DANH HIỆU ĐẠT ĐƯỢC (có số liệu minh chứng) ===');
  badgeLines.forEach(l => L.push(`- ${l}`));
  L.push('');
  L.push('=== YÊU CẦU ===');
  L.push('Hãy soạn một GIẤY KHEN hoàn chỉnh, trang trọng, gồm:');
  L.push('1. Tiêu đề "GIẤY KHEN" và tên danh hiệu cụ thể (nếu đạt từ 3 tiêu chí trở lên, có thể gộp thành danh hiệu tổng hợp, ví dụ "Học sinh xuất sắc toàn diện").');
  L.push(`2. Nội dung: "Giáo viên chủ nhiệm lớp ${cls.name} khen tặng em ${st.name}..." nêu rõ lý do dựa trên số liệu ở trên.`);
  L.push('3. Ngày tháng, chữ ký giáo viên chủ nhiệm.');
  L.push('4. Gợi ý icon trang trí phù hợp theo danh hiệu đạt được, và bảng màu tươi sáng, trang trọng.');
  L.push('Văn phong: trang trọng nhưng gần gũi, phù hợp học sinh THCS.');
  return L.join('\n');

const RISK_BADGES = {
  lowScore:   {icon:'📉', label:'Điểm số thấp'},
  declining:  {icon:'📊', label:'Điểm giảm dần'},
  attendance: {icon:'📅', label:'Chuyên cần kém'},
  homework:   {icon:'📝', label:'Bài tập không hoàn thành'},
  violations: {icon:'⚠',  label:'Vi phạm nội quy nhiều'},
  conduct:    {icon:'🌟', label:'Hạnh kiểm chưa tốt'},
  punishment: {icon:'📌', label:'Chép phạt lặp lại'},
};

function latestExamMonth(cls){ const months = Object.keys(cls.monthlyExams||{}).sort(); return months.length ? months[months.length-1] : null; }
function latestConductMonth(cls){ const months = Object.keys(cls.conduct||{}).sort(); return months.length ? months[months.length-1] : null; }

function riskLevelOf(count){
  if(count>=4) return {label:'Cao', color:'var(--danger)', icon:'🔴'};
  if(count>=2) return {label:'Trung bình', color:'#B8710A', icon:'🟠'};
  return {label:'Thấp', color:'#B79400', icon:'🟡'};
}

function computeRiskCandidates(classId, sessionCount, criteria, thresholds){
  const cls = getClass(classId);
  const allSessions = getSessions(classId);
  const recentSessions = allSessions.slice(-sessionCount);
  const since = recentSessions.length ? recentSessions[0].date : null;
  const examMonth = latestExamMonth(cls);
  const prevMonth = examMonth ? prevMonthKey(examMonth) : null;
  const conductMonth = latestConductMonth(cls) || getClassMonths(classId).slice(-1)[0];

  const results = [];
  cls.students.forEach(st=>{
    const badges = [], details = {};

    if(criteria.lowScore){
      const avg = examMonth ? studentExamAvg((cls.monthlyExams[examMonth]||{})[st.id]||{}) : null;
      details.lowScore = avg;
      if(avg!==null && avg<thresholds.lowScore) badges.push('lowScore');
    }
    if(criteria.declining){
      let cur=null, prev=null;
      if(examMonth) cur = studentExamAvg((cls.monthlyExams[examMonth]||{})[st.id]||{});
      if(prevMonth) prev = studentExamAvg((cls.monthlyExams[prevMonth]||{})[st.id]||{});
      const delta = (cur!==null && prev!==null) ? cur-prev : null;
      details.declining = delta;
      if(delta!==null && delta <= -thresholds.declineAmount) badges.push('declining');
    }
    if(criteria.attendance){
      const att = attendanceFromSessions(recentSessions, st.id);
      details.attendance = att.rate;
      if(att.rate!==null && att.rate<thresholds.attendance) badges.push('attendance');
    }
    if(criteria.homework){
      const hw = checklistFromSessions(recentSessions, st.id);
      details.homework = hw.rate;
      if(hw.rate!==null && hw.rate<thresholds.homework) badges.push('homework');
    }
    if(criteria.violations){
      const count = (st.violations||[]).filter(v=> !since || v.date>=since).length;
      details.violations = count;
      if(count>=thresholds.violationsCount) badges.push('violations');
    }
    if(criteria.conduct){
      if(conductMonth){
        const saved = (cls.conduct && cls.conduct[conductMonth] && cls.conduct[conductMonth][st.id]) || {};
        const rating = saved.rating || conductSuggestion(classId, conductMonth, st.id).rating;
        details.conduct = rating;
        if(rating==='yeu' || rating==='trungbinh') badges.push('conduct');
      } else details.conduct = null;
    }
    if(criteria.punishment){
      const count = recentSessions.filter(s=> s.punishmentAssigned && s.punishmentAssigned[st.id]).length;
      details.punishment = count;
      if(count>=thresholds.punishmentCount) badges.push('punishment');
    }

    if(badges.length){
      results.push({student:st, badges, details});
    }
  });

  results.sort((a,b)=> b.badges.length - a.badges.length);
  return results;
}

// Gom toàn bộ số liệu của 1 học sinh — dùng chung cho cả 3 loại prompt
function gatherRiskData(classId, studentId, sessionCount){
  const cls = getClass(classId);
  const st = cls.students.find(s=>s.id===studentId);
  const allSessions = getSessions(classId);
  const recentSessions = allSessions.slice(-sessionCount);
  const att = attendanceFromSessions(recentSessions, studentId);
  const hw = checklistFromSessions(recentSessions, studentId);
  const since = recentSessions.length ? recentSessions[0].date : null;
  const violList = (st.violations||[]).filter(v=> !since || v.date>=since);
  const punishCount = recentSessions.filter(s=> s.punishmentAssigned && s.punishmentAssigned[studentId]).length;
  const examMonth = latestExamMonth(cls);
  const examAvg = examMonth ? studentExamAvg((cls.monthlyExams[examMonth]||{})[studentId]||{}) : null;
  const prevMonth = examMonth ? prevMonthKey(examMonth) : null;
  const prevAvg = prevMonth ? studentExamAvg((cls.monthlyExams[prevMonth]||{})[studentId]||{}) : null;
  const conductMonth = latestConductMonth(cls) || getClassMonths(classId).slice(-1)[0];
  let conductRating = null;
  if(conductMonth){
    const saved = (cls.conduct && cls.conduct[conductMonth] && cls.conduct[conductMonth][studentId]) || {};
    conductRating = saved.rating || conductSuggestion(classId, conductMonth, studentId).rating;
  }
  const scoreSeries = recentSessions.map(s=>sessionScoreAvg(s, studentId)).filter(v=>v!==null);
  const sessionAvg = scoreSeries.length ? scoreSeries.reduce((a,b)=>a+b,0)/scoreSeries.length : null;
  const contactLog = (st.contactLog||[]).slice().sort((a,b)=> b.date.localeCompare(a.date));

  return {cls, st, recentSessions, att, hw, violList, punishCount, examMonth, examAvg, prevMonth, prevAvg, conductRating, sessionAvg, contactLog};
}

function riskDataBlockLines(d){

  L.push(`- Chuyên cần: ${d.att.rate!==null ? d.att.rate+'%' : 'chưa có dữ liệu'} (có mặt ${d.att.present}, vắng ${d.att.absent}, muộn ${d.att.late})`);

    L.push(`- Điểm KT tháng ${monthLabel(d.examMonth)}: ${d.examAvg.toFixed(1)}/10${d.prevAvg!==null ? ` (tháng trước: ${d.prevAvg.toFixed(1)}/10, ${d.examAvg-d.prevAvg>=0?'+':''}${(d.examAvg-d.prevAvg).toFixed(1)})` : ''}`);
  }
  L.push(`- Hoàn thành bài tập: ${d.hw.rate!==null ? d.hw.rate+'%' : 'chưa có dữ liệu'}`);
  L.push(`- Hạnh kiểm gần nhất: ${d.conductRating ? CONDUCT_LABEL[d.conductRating] : 'chưa xếp loại'}`);
  L.push(`- Số lần vi phạm nội quy (trong phạm vi xét): ${d.violList.length}${d.violList.length ? ' — ' + d.violList.slice(0,5).map(v=>`"${v.content}" (${fmtDateVN(v.date)})`).join('; ') : ''}`);
  L.push(`- Số lần chép phạt (trong phạm vi xét): ${d.punishCount}`);
  L.push('');
  if(d.contactLog.length){
    L.push('=== LỊCH SỬ ĐÃ TRAO ĐỔI VỚI PHỤ HUYNH ===');
    d.contactLog.slice(0,5).forEach(c=> L.push(`- ${fmtDateVN(c.date)} (${c.method}): ${c.content}`));
  } else {
    L.push('=== LỊCH SỬ TRAO ĐỔI VỚI PHỤ HUYNH ===');
    L.push('Chưa có lần trao đổi nào được ghi nhận.');
  }
  return L;
}

/* ============================================================
   SVG LINE CHART
============================================================ */
function resolveVar(v){
  if(typeof v==='string' && v.startsWith('var(')){
    const name = v.slice(4,-1).trim();
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#999';
  }
  return v;
}
function lineChartSVG(labels, series){
  const W = 760, H = 240, padL = 40, padR = 16, padT = 16, padB = 34;
  const allVals = [];
  series.forEach(s=> s.values.forEach(v=>{ if(v!==null && v!==undefined) allVals.push(v); }));
  if(!allVals.length) return `<div class="muted">Không đủ dữ liệu.</div>`;
  let min = Math.min(0, Math.min(...allVals));
  let max = Math.max(10, Math.max(...allVals));
  if(max===min) max = min+1;
  const n = labels.length;
  const x = i => padL + (n<=1? 0 : (i/(n-1))*(W-padL-padR));
  const y = v => H - padB - ((v-min)/(max-min))*(H-padT-padB);

  const gridLines = [];
  const steps = 4;
  for(let i=0;i<=steps;i++){
    const val = min + (max-min)*i/steps;
    const yy = y(val);
    gridLines.push(`<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="#E4DCC9" stroke-width="1"/>`);
    gridLines.push(`<text x="${padL-8}" y="${yy+3}" font-size="10" fill="#9AA7AC" text-anchor="end" font-family="IBM Plex Mono, monospace">${val.toFixed(1)}</text>`);
  }
  const xLabels = labels.map((l,i)=>{
    if(n>8 && i%Math.ceil(n/8)!==0 && i!==n-1) return '';
    return `<text x="${x(i)}" y="${H-12}" font-size="10" fill="#9AA7AC" text-anchor="middle" font-family="Roboto, sans-serif">${l}</text>`;
  }).join('');

  const lines = series.map(s=>{
    const color = resolveVar(s.color);
    let d = '';
    let started = false;
    const pts = [];
    s.values.forEach((v,i)=>{
      if(v===null || v===undefined){ started=false; return; }
      const cmd = started? 'L':'M';
      d += `${cmd}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
      started = true;
      pts.push(`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${color}"/>`);
    });
    const dashAttr = s.dash ? `stroke-dasharray="${s.dash}"` : '';
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" ${dashAttr} stroke-linecap="round" stroke-linejoin="round"/>` + pts.join('');
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:260px;">${gridLines.join('')}${lines}${xLabels}</svg>`;
}

function copyTextToClipboard(text){
  return new Promise((resolve)=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>resolve(true)).catch(()=>{
        resolve(fallbackCopy(text));
      });
    } else {
      resolve(fallbackCopy(text));
    }
  });
}
function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
async function copyZaloMessage(classId, studentId){
  const text = buildZaloMessage(classId, studentId);
  if(!text){ showToast('Chưa chọn được học sinh để tạo tin nhắn.'); return; }
  const ok = await copyTextToClipboard(text);
  if(ok){
    showToast('Đã copy tin nhắn — dán trực tiếp vào Zalo để gửi phụ huynh.', 3200);
  } else {
    openPromptModal('Copy tin nhắn Zalo', text, ()=>{}, {
      multiline:true,
      submitLabel:'Đóng',
      hint:'Trình duyệt chặn copy tự động — cô bôi đen (Ctrl+A) rồi Ctrl+C nội dung bên dưới nhé.'
    });
  }
}

function buildSessionReportPrompt(classId, date){
  const cls = getClass(classId);
  if(!cls) return '';
  const students = cls.students;
  const session = (state.sessionsByClass[classId]||[]).find(s=>s.date===date) || newSession(date);
  const types = session.exerciseTypes || [];
  const exercises = session.exercises || [];

  const scores = students.map(s=>sessionScoreAvg(session, s.id)).filter(v=>v!==null);
  const maxS = scores.length? Math.max(...scores) : null;
  const minS = scores.length? Math.min(...scores) : null;
  const avgS = scores.length? scores.reduce((a,b)=>a+b,0)/scores.length : null;

  const L = [];
  L.push('Bạn là trợ lý giúp giáo viên soạn một BÁO CÁO BUỔI HỌC hoàn chỉnh dưới dạng FILE WORD (.docx), có bố cục chuyên nghiệp, sẵn sàng in ấn hoặc gửi cho phụ huynh/BGH.');
  L.push('');
  L.push(`Lớp: ${cls.name}`);
  L.push(`Ngày học: ${fmtDateVN(date)}`);
  L.push(`Giáo viên: ${state.teacherName || '(chưa nhập tên)'}`);
  L.push(`Sĩ số: ${students.length} học sinh`);
  L.push(`Nội dung học tập: ${session.content || '(chưa nhập)'}`);
  L.push(`Nhận xét về nền nếp: ${session.disciplineNote || '(chưa nhập)'}`);
  if(scores.length){
    L.push(`Điểm buổi học — Cao nhất: ${maxS.toFixed(1)} · Thấp nhất: ${minS.toFixed(1)} · Trung bình lớp: ${avgS.toFixed(1)}`);
  }
  L.push('');

  L.push('=== BẢNG CHI TIẾT TỪNG HỌC SINH ===');
  students.forEach(st=>{
    const att = session.attendance[st.id];
    const attLabel = att==='present' ? 'Có mặt' : att==='absent' ? 'Vắng' : att==='late' ? 'Muộn' : 'Chưa điểm danh';
    const checklistPart = types.length ? types.map(t=>{
      const v = (session.checklist[st.id]||{})[t.id] || 'none';
      const label = v==='full' ? 'Đầy đủ' : v==='partial' ? 'Thiếu' : 'Chưa làm';
      return `${t.name}: ${label}`;
    }).join(', ') : '';
    const scorePart = exercises.length ? exercises.map(e=>{
      const total = exerciseTotal(e);
      const raw = (session.scores[st.id]||{})[e.id];
      const s10 = scoreOn10(raw, total);
      return `${e.name}: ${raw!==undefined && raw!==null ? raw+'/'+total+' câu ('+s10.toFixed(1)+'/10)' : 'chưa chấm'}`;
    }).join(', ') : '';
    const note = session.studentNotes[st.id] || '';
    const owesPunish = studentOwesPunishment(classId, st.id, date) || (session.punishmentAssigned && session.punishmentAssigned[st.id]);

    const parts = [`- ${st.name}: Điểm danh ${attLabel}`];
    if(checklistPart) parts.push(`Checklist [${checklistPart}]`);
    if(scorePart) parts.push(`Điểm [${scorePart}]`);
    if(owesPunish) parts.push('⚠ Có chép phạt cần theo dõi');
    if(note) parts.push(`Ghi chú: ${note}`);
    L.push(parts.join(' · '));
  });

  L.push('');
  L.push('=== LƯU Ý CỦA BUỔI HỌC ===');
  L.push(session.generalNote || '(chưa nhập)');
  L.push('');
  L.push('=== BÀI TẬP VỀ NHÀ ===');
  L.push(session.homework || '(chưa nhập)');
  L.push('');
  L.push('=== YÊU CẦU ===');
  L.push('Hãy tạo cho tôi MỘT FILE WORD (.docx) báo cáo buổi học hoàn chỉnh dựa trên dữ liệu trên, bố cục gồm:');
  L.push('1. Tiêu đề báo cáo, thông tin buổi học (lớp, ngày, giáo viên, nội dung học, điểm cao nhất/thấp nhất/trung bình) trình bày dạng bảng thông tin gọn gàng ở đầu trang.');
  L.push('2. Bảng chi tiết từng học sinh (điểm danh, checklist, điểm số, đánh giá, ghi chú) — dùng định dạng bảng chuẩn của Word, có tô nền/in đậm để làm nổi bật học sinh vắng, điểm thấp hoặc có chép phạt.');
  L.push('3. Mục "Lưu ý của buổi học" và "Bài tập về nhà" trình bày dạng danh sách gạch đầu dòng, có tiêu đề mục rõ ràng (heading).');
  L.push('4. Bố cục chuyên nghiệp: có tiêu đề lớn ở đầu, các mục có heading phân cấp rõ ràng, phông chữ và khoảng cách hợp lý, canh lề chuẩn để in ấn trên khổ A4.');
  L.push('5. Xuất trực tiếp file .docx hoàn chỉnh (không phải HTML hay trang web) để tôi tải về dùng ngay.');
  return L.join('\n');
}

function exportExcel(){
  const classId = state.attendance.classId || state.currentClassId;
  const cls = getClass(classId);
  const selectedMonth = state.attendance.month || 'all';
  const allSessions = getSessions(classId);
  const sessions = selectedMonth==='all' ? allSessions : allSessions.filter(s=>monthKey(s.date)===selectedMonth);

  const dayHeaders = sessions.map(s=>fmtDateVN(s.date));
  const header = ['Học sinh', ...dayHeaders, 'Số buổi có dữ liệu', 'Có mặt', 'Vắng', 'Muộn', 'Tỷ lệ chuyên cần (%)'];
  const rows = [header];
  cls.students.forEach(s=>{
    const att = attendanceFromSessions(sessions, s.id);
    const dayCells = sessions.map(sess=>{
      const a = sess.attendance[s.id];
      if(a==='present') return 'X';
      if(a==='absent') return 'V';
      if(a==='late') return 'M';
      return '';
    });
    rows.push([s.name, ...dayCells, att.total, att.present, att.absent, att.late, att.rate!==null?att.rate:'']);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  const sheetLabel = (selectedMonth==='all' ? 'Chuyen can' : monthLabel(selectedMonth)).slice(0,30);
  XLSX.utils.book_append_sheet(wb, ws, sheetLabel);

  // Thêm sheet chú thích ký hiệu cho dễ đọc
  const legendWs = XLSX.utils.aoa_to_sheet([
    ['Ký hiệu', 'Ý nghĩa'],
    ['X', 'Có mặt'],
    ['V', 'Vắng'],
    ['M', 'Muộn'],
    ['(để trống)', 'Chưa điểm danh buổi đó'],
  ]);
  XLSX.utils.book_append_sheet(wb, legendWs, 'Chú thích');

  const fileMonthPart = selectedMonth==='all' ? '' : `-${selectedMonth}`;
  XLSX.writeFile(wb, `Chuyen-can-${cls.name.replace(/\s+/g,'_')}${fileMonthPart}.xlsx`);
  showToast('Đã xuất file Excel.');
}

let toastTimer;
function showToast(msg, duration){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), duration || 2400);
}
